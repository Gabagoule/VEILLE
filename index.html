const DTABS = [["essentiel", "Essentiel"], ["figures", "Figures"], ["texte", "Texte"], ["fiche", "Fiche"], ["infos", "Infos"]];

// ---------- Fiche : données ----------
const noteOf = (pmid) => DB.notes[pmid] || null;
const filled = (s) => !!(s && String(s).trim());
function ficheProgress(n) {
  const keys = ["k", ...FICHE_FIELDS.map(f => f.k), "m"];
  const done = n ? keys.filter(k => filled(n[k])).length + (n.imp ? 1 : 0) : 0;
  return { done, total: keys.length + 1 };
}
function hasFiche(pmid) {
  const n = DB.notes[pmid];
  return !!n && (ficheProgress(n).done > 0 || (n.h || []).length > 0 || (n.img || []).length > 0);
}
function noteText(pmid) {
  const n = DB.notes[pmid];
  if (!n) return "";
  return [n.k, ...FICHE_FIELDS.map(f => n[f.k]), n.m, ...(n.h || []).map(h => h.q), ...(n.img || []).map(i => i.cap)]
    .filter(Boolean).join(" ").toLowerCase();
}
function saveNote(pmid, patch) {
  const had = hasFiche(pmid);
  DB.notes[pmid] = { h: [], img: [], ...DB.notes[pmid], ...patch, u: Date.now() };
  touch("notes");
  const has = hasFiche(pmid);
  if (!had && has && stateOf(pmid).s === "inbox") {
    setState(pmid, { s: "toread" }, "status_toread");
    $$("#dStatus button").forEach(x => x.classList.toggle("on", x.dataset.s === "toread"));
    toast("Article ajouté à ta liste de lecture");
  }
  if (had !== has) { mapCache.delete(pmid); retrainSoon(); refreshAfterEdit(); }
  if (drawer.pmid === pmid) drawer.edited = true;
}

// ---------- Europe PMC ----------
const EPMC = "https://www.ebi.ac.uk/europepmc/webservices/rest/";
const FT_VERSION = 1;
const ftMem = new Map();   // pmid -> promesse du dossier de lecture

/** Dossier de lecture d'un article : PMCID, lien PDF libre, texte intégral analysé. */
function getReading(a, force = false) {
  if (!force && ftMem.has(a.pmid)) return ftMem.get(a.pmid);
  const p = (async () => {
    const cached = force ? null : await IDB.get("fulltext", a.pmid).catch(() => null);
    // Un texte trouvé est gardé ; une absence est revérifiée après 14 jours (dépôt tardif dans PMC)
    if (cached && cached.v === FT_VERSION && (cached.ft || Date.now() - cached.t < 14 * 864e5)) return cached;
    const rd = await loadReading(a);
    await IDB.put("fulltext", rd).catch(() => {});
    return rd;
  })();
  ftMem.set(a.pmid, p);
  p.catch(() => ftMem.delete(a.pmid));
  return p;
}

async function loadReading(a) {
  const out = { pmid: a.pmid, v: FT_VERSION, t: Date.now(), pmcid: a.pmc || null, oa: false, pdf: null, ft: null };
  const r = await http("epmc", EPMC + "search", {
    params: { query: `EXT_ID:${a.pmid} AND SRC:MED`, resultType: "core", format: "json", pageSize: "1" },
  });
  const hit = ((await r.json()).resultList?.result || [])[0];
  if (hit) {
    out.pmcid ||= hit.pmcid || null;
    out.oa = hit.isOpenAccess === "Y";
    const urls = (hit.fullTextUrlList?.fullTextUrl || []).filter(u => ["OA", "F"].includes(u.availabilityCode));
    out.pdf = (urls.find(u => u.documentStyle === "pdf") || {}).url || null;
  }
  if (!out.pdf && a.oaUrl && /\.pdf($|[?#])/i.test(a.oaUrl)) out.pdf = a.oaUrl;
  if (out.pmcid && (!hit || hit.inEPMC === "Y" || out.oa)) {
    const x = await http("epmc", `${EPMC}${out.pmcid}/fullTextXML`, { allow404: true });
    if (x) {
      const xml = await x.text();
      if (xml.includes("<article")) out.ft = parseJats(xml);
    }
  }
  return out;
}

/** Adresses possibles d'une figure (Europe PMC d'abord, PMC en secours). */
function figSrcs(pmcid, href) {
  const base = href.replace(/\.(tiff?|eps|gif|png|jpe?g)$/i, "");
  const direct = /\.(gif|png|jpe?g)$/i.test(href) ? [href] : [];
  const names = [...new Set([...direct, base + ".jpg", base + ".gif"])];
  return [...names.map(n => `https://europepmc.org/articles/${pmcid}/bin/${n}`),
    `https://www.ncbi.nlm.nih.gov/pmc/articles/${pmcid}/bin/${base}.jpg`];
}

// ---------- Analyse JATS (texte intégral) ----------
const J_INLINE = { italic: "i", bold: "b", sup: "sup", sub: "sub", underline: "u", monospace: "code" };
const J_SKIP = new Set(["fig", "table-wrap", "supplementary-material", "fn", "label", "object-id", "tex-math", "list"]);
const J_DROP_SEC = /^(electronic )?supplementary|^additional (file|material)|^data (availability|sharing)|^availability of data|^funding|^conflicts? of interest|^competing interests?|^acknowledg|^author(s'|s)? contributions?|^abbreviations|^declarations?|^ethics|^consent|^disclosures?/i;
const xhref = (g) => g ? (g.getAttributeNS("http://www.w3.org/1999/xlink", "href") || g.getAttribute("xlink:href") || g.getAttribute("href") || "") : "";

/** Texte en ligne vers HTML sûr : seules quelques balises connues sont recréées. */
function jInline(node) {
  let h = "";
  for (const c of node.childNodes) {
    if (c.nodeType === 3 || c.nodeType === 4) { h += esc(c.nodeValue.replace(/\s+/g, " ")); continue; }
    if (c.nodeType !== 1) continue;
    const n = c.localName;
    if (J_INLINE[n]) h += `<${J_INLINE[n]}>${jInline(c)}</${J_INLINE[n]}>`;
    else if (n === "xref") {
      const type = c.getAttribute("ref-type"), rid = (c.getAttribute("rid") || "").split(/\s+/)[0];
      if ((type === "fig" || type === "table") && rid) h += `<a class="xref" data-ref="${esc(rid)}" href="#">${jInline(c)}</a>`;
      else if (type === "bibr") h += `<span class="cite">${jInline(c)}</span>`;
      else h += jInline(c);
    }
    else if (n === "break") h += "<br>";
    else if (n === "inline-formula" || n === "disp-formula" || n === "math") {
      const m = c.getElementsByTagNameNS("*", "math")[0] || c;
      h += `<span class="math">${esc(txt(m))}</span>`;
    }
    else if (J_SKIP.has(n)) continue;
    else h += jInline(c);
  }
  return h;
}
function figRefHtml(f) {
  const id = f.getAttribute("id");
  if (!id) return "";
  const isFig = f.localName === "fig";
  return `<p class="figref"><a class="xref" data-ref="${esc(id)}" href="#">${icon(isFig ? "image" : "table")}${esc(txt(kid(f, "label")) || (isFig ? "Figure" : "Tableau"))}</a></p>`;
}
function jList(c) {
  const tag = c.getAttribute("list-type") === "order" ? "ol" : "ul";
  const items = [...c.children].filter(li => li.localName === "list-item")
    .map(li => `<li>${[...li.children].filter(x => x.localName === "p").map(jInline).join(" ") || jInline(li)}</li>`).join("");
  return `<${tag}>${items}</${tag}>`;
}
function jBlocks(node, depth) {
  let h = "";
  for (const c of node.children) {
    const n = c.localName;
    if (n === "p") {
      const t = jInline(c).trim();
      if (t) h += `<p>${t}</p>`;
      for (const f of c.children) {   // listes et figures glissées dans un paragraphe
        if (f.localName === "list") h += jList(f);
        else if (f.localName === "fig" || f.localName === "table-wrap") h += figRefHtml(f);
      }
    }
    else if (n === "sec") {
      const t = txt(kid(c, "title"));
      if (J_DROP_SEC.test(t)) continue;
      h += `${t ? `<h4>${esc(t)}</h4>` : ""}${jBlocks(c, depth + 1)}`;
    }
    else if (n === "list") h += jList(c);
    else if (n === "fig" || n === "table-wrap") h += figRefHtml(c);
    else if (n === "disp-quote") h += `<blockquote>${jBlocks(c, depth)}</blockquote>`;
    else if (n === "disp-formula") h += `<p class="math">${esc(txt(c))}</p>`;
    else if (n === "boxed-text" || n === "statement") h += jBlocks(c, depth);
  }
  return h;
}
function secKind(t) {
  const s = t.toLowerCase();
  if (/conclu/.test(s)) return "concl";
  if (/limitation/.test(s)) return "lim";
  if (/discuss/.test(s)) return "disc";
  if (/result|finding/.test(s)) return "res";
  if (/method|material|patients and|design|population|setting/.test(s)) return "meth";
  if (/intro|background|rationale/.test(s)) return "intro";
  return "";
}
function jTable(tb) {
  const row = (tr) => `<tr>${[...tr.children].filter(c => c.localName === "td" || c.localName === "th").map(c => {
    const cs = Math.min(40, +c.getAttribute("colspan") || 1), rs = Math.min(200, +c.getAttribute("rowspan") || 1);
    return `<${c.localName}${cs > 1 ? ` colspan="${cs}"` : ""}${rs > 1 ? ` rowspan="${rs}"` : ""}>${jInline(c)}</${c.localName}>`;
  }).join("")}</tr>`;
  let h = "";
  for (const part of tb.children) {
    const n = part.localName;
    if (n === "tr") h += row(part);
    else if (n === "thead" || n === "tbody" || n === "tfoot") h += `<${n}>${[...part.children].filter(r => r.localName === "tr").map(row).join("")}</${n}>`;
  }
  return `<table>${h}</table>`;
}
function capParts(node) {
  const cap = kid(node, "caption");
  if (!cap) return { title: "", cap: "" };
  const title = kid(cap, "title");
  return { title: title ? jInline(title) : "", cap: kids(cap, "p").map(p => `<p>${jInline(p)}</p>`).join("") };
}

/** Article JATS (Europe PMC) : sections, figures, tableaux. */
function parseJats(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  const figs = [], tables = [], seen = new Set();
  for (const f of doc.getElementsByTagName("fig")) {
    const href = xhref(f.getElementsByTagName("graphic")[0]);
    const id = f.getAttribute("id") || "fig" + figs.length;
    if (!href || seen.has(id)) continue;
    seen.add(id);
    figs.push({ id, label: txt(kid(f, "label")), href, ...capParts(f) });
  }
  for (const t of doc.getElementsByTagName("table-wrap")) {
    const id = t.getAttribute("id") || "tab" + tables.length;
    if (seen.has(id)) continue;
    seen.add(id);
    const tb = t.getElementsByTagName("table")[0];
    const foot = kid(t, "table-wrap-foot");
    tables.push({ id, label: txt(kid(t, "label")), ...capParts(t), html: tb ? jTable(tb) : "",
      href: tb ? null : xhref(t.getElementsByTagName("graphic")[0]) || null,
      foot: foot ? jBlocks(foot, 0) || `<p>${jInline(foot)}</p>` : "" });
  }
  const sections = [];
  const body = doc.getElementsByTagName("body")[0];
  if (body) {
    let loose = "";
    for (const c of body.children) {
      if (c.localName === "sec") {
        const t = txt(kid(c, "title")) || "Texte";
        if (J_DROP_SEC.test(t)) continue;
        const h = jBlocks(c, 1);
        if (h) sections.push({ t, k: secKind(t), h });
      } else {
        loose += jBlocks({ children: [c] }, 0);
      }
    }
    if (loose) sections.unshift({ t: "Texte", k: "", h: loose });
  }
  if (!sections.length && !figs.length && !tables.length) return null;
  return { sections, figs, tables: tables.slice(0, 30) };
}

// ---------- Résumé : conclusion et chiffres ----------
const NUM_ = String.raw`[-−]?\d+(?:[.,·]\d+)?`;
const PCT_ = String.raw`(?:\s*%)?`;
const RANGE_ = String.raw`${NUM_}${PCT_}\s*(?:[-–—]|to|,|;)\s*${NUM_}${PCT_}`;
const CI_ = String.raw`(?:95\s?%\s?(?:CI|confidence interval|CrI|credible interval)|CI)\s*[:=,]?\s*(?:of\s+)?[\[(]?\s*${RANGE_}(?:\s*[\])])?`;
const EFF_ = String.raw`(?:\b(?:[Aa]djusted |[Aa]|s|sub)?(?:HR|OR|RR|IRR|RRR|ARR|NNT|NNH|SMD|MD|RD)\b|\b[Hh]azard ratio|\b[Oo]dds ratio|\b[Rr]isk ratio|\b[Rr]elative risk|\b[Rr]ate ratio|\b(?:[Mm]ean|[Mm]edian|[Aa]bsolute|[Rr]isk) (?:risk )?difference)`;
const UNITS_ = String.raw`(?:adult\s+)?(?:patients|participants|subjects|individuals|adults|cases|procedures|hospitals|centers|centres|sites)\b`;
const STAT_SRC =
  String.raw`(?<st>${EFF_}\s*(?:[\[(][^\])]{0,30}[\])])?\s*[:=,]?\s*(?:of\s+|was\s+)?${NUM_}(?:\s*(?:%|days?|hours?|mm\s?Hg|points?|mL|ml|kg))?(?:\s*(?:[\[(]\s*|[,;]\s*)?(?:${CI_}|${NUM_}${PCT_}\s*(?:[-–—]|to)\s*${NUM_}${PCT_}\s*[\])]))?)` +
  String.raw`|(?<ci>${CI_})` +
  String.raw`|(?<vs>${NUM_}\s*%\s*(?:vs\.?|versus|compared with|compared to)\s*${NUM_}\s*%)` +
  String.raw`|(?<p>\b[Pp]\s*[<=>≤≥]\s*0?[.,]\d+(?:\s*[x×]\s*10\s*[-−]\s*\d+)?)` +
  String.raw`|(?<n>\b\d{1,3}(?:[, ]\d{3})+(?=\s+${UNITS_})|\b\d{2,}(?=\s+${UNITS_}))`;
const STAT_RE = new RegExp(STAT_SRC, "g");
const STAT_TEST = new RegExp(STAT_SRC);
const statKind = (m) => Object.keys(m.groups).find(k => m.groups[k] !== undefined);

/** Texte brut vers HTML, chiffres importants surlignés. */
function markStats(text) {
  let h = "", last = 0;
  for (const m of text.matchAll(STAT_RE)) {
    h += esc(text.slice(last, m.index)) + `<mark class="${statKind(m)}">${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return h + esc(text.slice(last));
}
/** Même chose sur un bloc déjà affiché (texte intégral). */
function markStatsIn(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("mark, a, .cite, h4, table, .math") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) if (STAT_TEST.test(n.nodeValue)) nodes.push(n);
  for (const node of nodes) {
    const t = document.createElement("template");
    t.innerHTML = markStats(node.nodeValue);
    node.replaceWith(t.content);
  }
}
function abstractParts(text) {
  return (text || "").split("\n").filter(Boolean).map(p => {
    const m = p.match(/^([^:]{2,40}) : ([\s\S]*)$/);
    return m ? { label: m[1], text: m[2] } : { label: "", text: p };
  });
}
function abstractMarked(text) {
  if (!text) return `<p class="hint">Pas d'abstract disponible pour cet article.</p>`;
  return abstractParts(text).map(p => `<p>${p.label ? `<b>${esc(p.label)}.</b> ` : ""}${markStats(p.text)}</p>`).join("");
}
/** Conclusion des auteurs, ou à défaut les deux dernières phrases du résumé. */
function conclusionOf(a) {
  const parts = abstractParts(a.abstract);
  const c = parts.filter(p => /conclu|interpr|implication|significance|relevance/i.test(p.label));
  if (c.length) return { text: c.map(p => p.text).join(" "), structured: true };
  if (!parts.length) return null;
  const all = parts.map(p => p.text).join(" ");
  const sents = all.match(/[^.!?]+(?:[.!?]+(?=\s+[A-Z(]|\s*$))/g) || [all];
  if (sents.length < 3) return null;
  return { text: sents.slice(-2).join(" ").trim(), structured: false };
}
function keyNumbers(a) {
  const parts = abstractParts(a.abstract);
  const res = parts.filter(p => /result|finding|outcome|measurement/i.test(p.label));
  const out = [];
  const whole = parts.map(p => p.text).join(" ");
  const ns = [...whole.matchAll(STAT_RE)].filter(m => m.groups.n);
  const nm = ns.find(m => /^\s+(adult\s+)?(patients|participants|subjects|individuals|adults)/.test(whole.slice(m.index + m[0].length))) || ns[0];
  if (nm) out.push(`${nm[0]} ${(whole.slice(nm.index + nm[0].length).match(/^\s+((?:adult\s+)?\w+)/) || [, ""])[1]}`.trim());
  for (const m of (res.length ? res : parts).map(p => p.text).join(" ").matchAll(STAT_RE)) {
    if (!m.groups.st && !m.groups.vs) continue;
    const s = m[0].replace(/\s+/g, " ").trim();
    if (!out.includes(s)) out.push(s);
  }
  return out.slice(0, 7);
}

// ---------- Extraits surlignés ----------
function wrapText(block, start, end, cls) {
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  const jobs = [];
  let pos = 0, n;
  while ((n = walker.nextNode())) {
    const len = n.nodeValue.length, s = Math.max(start, pos), e = Math.min(end, pos + len);
    if (s < e) jobs.push([n, s - pos, e - pos]);
    pos += len;
  }
  for (const [node, s, e] of jobs) {
    const r = document.createRange();
    r.setStart(node, s); r.setEnd(node, e);
    const m = document.createElement("mark");
    m.className = cls;
    r.surroundContents(m);
  }
}
function paintExtracts(root, pmid) {
  const qs = (noteOf(pmid)?.h || []).map(h => h.q).filter(q => q && q.length >= 8);
  if (!qs.length) return;
  for (const blk of $$("[data-src] p, [data-src] li, [data-src] td", root)) {
    for (const q of qs) {
      const i = blk.textContent.indexOf(q);
      if (i >= 0) wrapText(blk, i, i + q.length, "hl");
    }
  }
}

// ---------- Captures (images collées ou prises en photo) ----------
const blobUrls = new Map();
async function storeImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
  cx.drawImage(bmp, 0, 0, w, h);
  let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.85));
  if (!blob || blob.type !== "image/webp") blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.86));
  const buf = await blob.arrayBuffer();
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
  const id = [...digest.slice(0, 16)].map(b => b.toString(16).padStart(2, "0")).join("");
  await IDB.put("blobs", { id, buf, type: blob.type, w, h, up: 0 });
  return { id, w, h };
}
async function addCaptures(pmid, files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return;
  const list = [...(noteOf(pmid)?.img || [])];
  let n = 0;
  for (const f of imgs) {
    try {
      const x = await storeImage(f);
      if (!list.some(i => i.id === x.id)) { list.push({ id: x.id, w: x.w, h: x.h, cap: "" }); n++; }
    } catch (e) { fail(new Error("Image illisible : " + e.message)); }
  }
  if (!n) return;
  flushNote();
  saveNote(pmid, { img: list });
  toast(n > 1 ? `${n} captures ajoutées` : "Capture ajoutée");
  if (drawer.pmid === pmid) { renderPane(); updateTabCounts(); }
}
async function blobUrl(id) {
  if (blobUrls.has(id)) return blobUrls.get(id);
  let rec = await IDB.get("blobs", id).catch(() => null);
  if (!rec && syncConfigured()) {
    const r = await worker(`/v1/blob/${id}`).catch(() => null);
    if (r?.ok) {
      rec = { id, buf: await r.arrayBuffer(), type: r.headers.get("Content-Type") || "image/jpeg", up: 1 };
      await IDB.put("blobs", rec).catch(() => {});
    }
  }
  if (!rec) return null;
  const url = URL.createObjectURL(new Blob([rec.buf], { type: rec.type }));
  blobUrls.set(id, url);
  return url;
}
function hydrateBlobs(root) {
  $$("img[data-blob]", root).forEach(async img => {
    const u = await blobUrl(img.dataset.blob).catch(() => null);
    if (u) img.src = u;
    else (img.closest(".fimg, .lb-stage") || img.parentElement).classList.add("broken");
  });
}
/** Envoie au Worker les captures pas encore sauvegardées. */
async function syncBlobs() {
  const ids = new Set();
  Object.values(DB.notes).forEach(n => (n.img || []).forEach(i => ids.add(i.id)));
  for (const id of ids) {
    const rec = await IDB.get("blobs", id).catch(() => null);
    if (!rec || rec.up) continue;
    const r = await worker(`/v1/blob/${id}`, { method: "PUT", body: rec.buf, headers: { "Content-Type": rec.type } });
    if (r.status === 404) throw new Error("Le Worker ne connaît pas encore les images : redéploie worker.js.");
    if (!r.ok) throw new Error(`Envoi d'une capture impossible (${r.status})`);
    rec.up = 1;
    await IDB.put("blobs", rec);
  }
}

// Une figure qui ne charge pas essaie l'adresse suivante ; celle qui marche est retenue
const srcMemo = new Map();
document.addEventListener("load", (e) => {
  const img = e.target;
  if (img instanceof HTMLImageElement && img.dataset.orig && img.currentSrc && img.currentSrc !== img.dataset.orig) srcMemo.set(img.dataset.orig, img.currentSrc);
}, true);
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || img.dataset.srcs === undefined) return;
  const rest = JSON.parse(img.dataset.srcs || "[]");
  if (rest.length) { img.dataset.srcs = JSON.stringify(rest.slice(1)); img.src = rest[0]; return; }
  delete img.dataset.srcs;
  (img.closest(".fimg, .lb-stage") || img.parentElement).classList.add("broken");
}, true);

function imgHtml(it) {
  if (it.blob) return `<img data-blob="${esc(it.blob)}" alt="${esc(it.label)}">`;
  const known = srcMemo.get(it.srcs[0]);
  const srcs = known ? [known, ...it.srcs.filter(x => x !== known)] : it.srcs;
  return `<img src="${esc(srcs[0])}" data-orig="${esc(it.srcs[0])}" data-srcs="${esc(JSON.stringify(srcs.slice(1)))}" alt="${esc(it.label)}" loading="lazy" referrerpolicy="no-referrer">`;
}
function pinImg(pin) {
  if (!pin) return "";
  return imgHtml(pin.t === "img" ? { blob: pin.id, label: pin.label } : { srcs: figSrcs(pin.pmcid, pin.href), label: pin.label });
}

// ---------- Tiroir de détail ----------
const drawer = { pmid: null, tab: "essentiel", rd: undefined, patch: {}, free: null, edited: false, sel: null };

/** Figures de l'article puis captures, dans l'ordre de lecture. */
function figItems(a) {
  const rd = drawer.rd, n = noteOf(a.pmid) || {};
  const out = [];
  (rd?.ft?.figs || []).forEach(f => out.push({
    key: "f:" + f.id, srcs: figSrcs(rd.pmcid, f.href), label: f.label || "Figure", title: f.title, cap: f.cap,
    pin: { key: "f:" + f.id, t: "f", pmcid: rd.pmcid, href: f.href, label: f.label || "Figure" },
  }));
  (n.img || []).forEach((im, i) => {
    const label = im.cap || `Capture ${i + 1}`;
    out.push({ key: "img:" + im.id, blob: im.id, label, title: "", cap: "", pin: { key: "img:" + im.id, t: "img", id: im.id, label } });
  });
  return out;
}
function readingLinksHtml(a) {
  const rd = drawer.rd;
  const pdf = rd?.pdf || (a.oaUrl && /\.pdf($|[?#])/i.test(a.oaUrl) ? a.oaUrl : null);
  let h = pdf ? `<a class="btn small pdf" href="${esc(pdf)}" target="_blank" rel="noopener">${icon("doc")}PDF</a>` : "";
  h += linksHtml(a);
  if (rd?.pmcid && !a.pmc) h += `<a href="https://europepmc.org/article/PMC/${esc(rd.pmcid)}" target="_blank" rel="noopener">Europe PMC</a>`;
  return h;
}
function statusLine(a) {
  const rd = drawer.rd;
  if (rd === undefined) return `<div class="ft-status"><span class="spin"></span>Recherche des figures et du texte intégral…</div>`;
  if (rd.err) return `<div class="ft-status">Europe PMC injoignable : ${esc(rd.err)} <button class="btn plain small" data-retry>Réessayer</button></div>`;
  return "";
}
function impactChips(imp) {
  return Object.entries(IMPACT).map(([k, l]) => `<button class="chip ${imp === k ? "on" : ""}" data-imp="${k}">${esc(l)}</button>`).join("");
}
function stripHtml(a) {
  const wait = statusLine(a);
  if (wait) return wait;
  const pin = noteOf(a.pmid)?.pin?.key;
  const items = figItems(a).sort((x, y) => (y.key === pin) - (x.key === pin));
  if (!items.length) {
    const why = drawer.rd.ft ? "Texte intégral disponible, sans figure." : "Pas de figures en accès libre pour cet article.";
    return `<div class="ft-status">${why} <button class="btn plain small" data-addcap>Ajouter une capture</button></div>`;
  }
  return `<div class="section"><div class="label-row"><span class="label">Figures</span><button class="btn plain small" data-go="figures">Tout voir</button></div>
    <div class="strip">${items.map(it => `<button class="th ${it.key === pin ? "pinned" : ""}" data-lb="${esc(it.key)}">
      <span class="fimg">${imgHtml(it)}</span><span class="cap-l">${it.key === pin ? icon("pin") : ""}${esc(it.label)}</span></button>`).join("")}</div></div>`;
}

function paneEssentiel(a) {
  const n = noteOf(a.pmid) || {};
  const concl = conclusionOf(a);
  const nums = keyNumbers(a);
  return `${concl ? `<section class="lead" data-src="Résumé"><span class="label">${concl.structured ? "Conclusion des auteurs" : "Fin du résumé"}</span><p>${markStats(concl.text)}</p></section>` : ""}
    ${nums.length ? `<div class="section"><span class="label">Chiffres clés</span><div class="chips keynums">${nums.map(x => `<button class="chip knum" data-num="${esc(x)}" title="Ajouter au résultat principal de ta fiche">${esc(x)}</button>`).join("")}</div></div>` : ""}
    <div data-slot="strip">${stripHtml(a)}</div>
    <div class="field take"><label for="fk">À retenir</label><textarea class="input grow" id="fk" data-f="k" rows="2" placeholder="La phrase que tu veux garder de cet article">${esc(n.k || "")}</textarea></div>
    <div class="chips impact">${impactChips(n.imp)}</div>
    <div class="section"><span class="label">Résumé</span><div class="abstract" data-src="Résumé">${abstractMarked(a.abstract)}</div></div>`;
}

function capsHtml(n) {
  return `<div class="caps" data-drop>${(n.img || []).map((im, i) => `<figure class="cap">
      <button class="capimg" data-lb="img:${esc(im.id)}" aria-label="Agrandir"><span class="fimg">${imgHtml({ blob: im.id, label: im.cap || `Capture ${i + 1}` })}</span></button>
      <input class="capcap" data-cap="${esc(im.id)}" value="${esc(im.cap || "")}" placeholder="Légende" enterkeyhint="done">
      <button class="x" data-del-img="${esc(im.id)}" aria-label="Retirer la capture">${icon("x")}</button></figure>`).join("")}
    <button class="cap add" data-addcap>${icon("image")}<span>Ajouter une capture</span><em>${isMobile() ? "Photo ou image" : "ou colle-la ici (Ctrl+V)"}</em></button></div>`;
}

function paneFigures(a) {
  const n = noteOf(a.pmid) || {}, pin = n.pin?.key, rd = drawer.rd;
  let h = statusLine(a);
  if (!h) {
    const figs = figItems(a).filter(it => !it.blob);
    const tabs = rd.ft?.tables || [];
    if (figs.length) h += `<div class="figgrid">${figs.map(it => `<button class="fcell ${it.key === pin ? "pinned" : ""}" data-lb="${esc(it.key)}">
      <span class="fimg">${imgHtml(it)}</span><b>${it.key === pin ? icon("pin") : ""}${esc(it.label)}</b>${it.title ? `<span class="ft-t">${it.title}</span>` : ""}</button>`).join("")}</div>`;
    if (tabs.length) h += `<div class="section"><span class="label">Tableaux</span>${tabs.map(t => `
      <details class="jt" id="jt-${esc(t.id)}" data-src="${esc(t.label || "Tableau")}"><summary><b>${esc(t.label || "Tableau")}</b> ${t.title}</summary>${t.cap}
      ${t.html ? `<div class="jtable">${t.html}</div>` : t.href ? `<span class="fimg">${imgHtml({ srcs: figSrcs(rd.pmcid, t.href), label: t.label })}</span>` : ""}
      ${t.foot ? `<div class="jfoot">${t.foot}</div>` : ""}</details>`).join("")}</div>`;
    if (!figs.length && !tabs.length) h += `<div class="empty-mini"><h3>Pas de figures en accès libre</h3>
      <p>Europe PMC ne diffuse les figures que des articles en accès libre. Si tu as le PDF, fais une capture de la figure qui compte et ajoute-la ci-dessous${syncConfigured() ? " : elle suivra sur tous tes appareils" : ""}.</p></div>`;
  }
  return h + `<div class="section"><span class="label">Tes captures</span>${capsHtml(n)}</div>`;
}

function paneTexte(a) {
  const wait = statusLine(a);
  if (wait) return wait;
  const rd = drawer.rd, secs = rd.ft?.sections || [];
  const pdf = rd.pdf || (a.oaUrl && /^https?:/.test(a.oaUrl) ? a.oaUrl : null);
  if (!secs.length) return `<div class="empty-mini"><h3>Texte intégral non disponible ici</h3>
    <p>Europe PMC ne diffuse que le texte des articles en accès libre.${pdf ? " Une version libre existe ailleurs :" : " Passe par le lien DOI si ton hôpital a l'abonnement."}</p>
    ${pdf ? `<a class="btn small" href="${esc(pdf)}" target="_blank" rel="noopener">${icon("doc")}Ouvrir la version libre</a>` : ""}</div>`;
  const shortT = (t) => t.replace(/^\d+(\.\d+)*\.?\s*/, "").slice(0, 28);
  return `<div class="jump chips">${secs.map((s, i) => `<button class="chip" data-jump="${i}">${esc(shortT(s.t))}</button>`).join("")}</div>
    <div class="ft">${secs.map((s, i) => `<details class="sec" id="sec-${i}" data-src="${esc(s.t)}" data-kind="${s.k}" ${s.k === "res" || s.k === "concl" ? "open" : ""}>
      <summary>${esc(s.t)}</summary><div class="sec-b">${s.h}</div></details>`).join("")}</div>
    <p class="hint src-note">Texte intégral Europe PMC, ${esc(rd.pmcid)}. Sélectionne une phrase pour la garder dans ta fiche.</p>`;
}

function quotesHtml(n) {
  const h = n.h || [];
  if (!h.length) return `<p class="hint">Sélectionne une phrase dans le résumé ou le texte intégral, puis « Garder l'extrait ».</p>`;
  return `<div class="quotes">${h.map(q => `<div class="quote"><q>${esc(q.q)}</q><span>${esc(q.src || "")}</span>
    <button class="icon-btn" data-del-q="${esc(q.id)}" aria-label="Retirer l'extrait">${icon("x")}</button></div>`).join("")}</div>`;
}

function paneFiche(a) {
  const n = noteOf(a.pmid) || {}, pr = ficheProgress(n), st = stateOf(a.pmid);
  const nums = keyNumbers(a);
  return `<div class="fprog"><span style="--p:${pr.done / pr.total}"></span><em>${pr.done} rubrique${pr.done > 1 ? "s" : ""} sur ${pr.total}</em></div>
    <div class="field take"><label for="ff-k">À retenir</label><textarea class="input grow" id="ff-k" data-f="k" rows="2" placeholder="La phrase que tu veux garder de cet article">${esc(n.k || "")}</textarea></div>
    <div class="field"><span class="label">Pour ma pratique</span><div class="chips impact" style="margin:0">${impactChips(n.imp)}</div></div>
    <div class="pico">${FICHE_FIELDS.map(f => `<div class="field"><div class="frow"><label for="ff-${f.k}">${f.label}</label>
      ${f.k === "r" && nums.length ? `<button class="btn plain small" data-insnums>Insérer les chiffres clés</button>` : ""}</div>
      <textarea class="input grow" id="ff-${f.k}" data-f="${f.k}" rows="2" placeholder="${esc(f.ph)}">${esc(n[f.k] || "")}</textarea></div>`).join("")}</div>
    <div class="field"><label for="ff-m">Ce que ça change pour moi</label><textarea class="input grow" id="ff-m" data-f="m" rows="2" placeholder="Protocole, visite, staff : ce que je ferais autrement">${esc(n.m || "")}</textarea></div>
    <div class="section"><span class="label">Extraits</span>${quotesHtml(n)}</div>
    <div class="section"><span class="label">Captures</span>${capsHtml(n)}</div>
    <div class="field"><label for="dNote">Note libre</label><textarea class="input grow" id="dNote" rows="3" placeholder="Idée pour la visite, lien avec un protocole…">${esc(drawer.free ?? st.n ?? "")}</textarea></div>`;
}

function paneInfos(a, v) {
  const years = (a.cby || []).slice().sort((x, y) => x.y - y.y);
  const max = Math.max(1, ...years.map(y => y.n));
  return `${metricsHtml(v, "clinical")}
    ${years.length ? `<div class="section" style="margin-top:18px"><span class="label">Citations par année (OpenAlex)</span>
      <div class="bars">${years.map(y => `<div><em>${y.n || ""}</em><i style="height:${(y.n / max) * 60}px"></i><span>${String(y.y).slice(2)}</span></div>`).join("")}</div></div>` : ""}
    <div class="section" style="margin-top:18px"><span class="label">Thèmes</span><div class="chips">${themeChips(v.themeIds) || '<span class="hint">Aucun</span>'}</div></div>
    ${a.mesh?.length ? `<div class="section"><span class="label">MeSH</span><div class="chips">${a.mesh.map(m => `<span class="chip">${esc(m)}</span>`).join("")}</div></div>` : ""}
    <div class="section"><span class="label">Détail des scores</span>
      <div class="hint"><b>Mapping score ${Math.round(v.map)}</b> : ressemblance avec la carte d'intérêts${topConceptsOf(a)}.<br>
      Score éditorial ${Math.round(v.score)} — preuve ${Math.round(v.comps.evidence * 100)}, citations ${Math.round(v.comps.velocity * 100)}, fraîcheur ${Math.round(v.comps.freshness * 100)}, journal ${Math.round(v.comps.journal * 100)}, priorité du thème ${Math.round(v.comps.theme * 100)}.</div></div>`;
}

function renderPane() {
  const a = DB.articles.get(drawer.pmid), pane = $("#dPane");
  if (!a || !pane) return;
  const t = drawer.tab;
  pane.innerHTML = t === "essentiel" ? paneEssentiel(a) : t === "figures" ? paneFigures(a)
    : t === "texte" ? paneTexte(a) : t === "fiche" ? paneFiche(a) : paneInfos(a, viewOf(a));
  if (t === "texte") {
    $$('.sec[data-kind="res"] .sec-b, .sec[data-kind="concl"] .sec-b', pane).forEach(markStatsIn);
    const lim = $$(".sec-b h4", pane).find(h => /limitation/i.test(h.textContent));
    if (lim && !$$(".sec", pane).some(s => s.dataset.kind === "lim")) {
      lim.id = "lim-h";
      $(".jump", pane).append(el(`<button class="chip" data-jump="lim">Limites</button>`));
    }
  }
  paintExtracts(pane, a.pmid);
  hydrateBlobs(pane);
  $$("textarea.grow", pane).forEach(autoGrow);
}
function updateTabCounts() {
  const a = DB.articles.get(drawer.pmid);
  if (!a) return;
  const rd = drawer.rd, nf_ = figItems(a).length + (rd?.ft?.tables?.length || 0);
  const fb = $('#dTabs [data-t="figures"]'), tb = $('#dTabs [data-t="texte"]');
  if (fb) fb.innerHTML = `Figures${nf_ ? `<em>${nf_}</em>` : ""}`;
  if (tb) tb.classList.toggle("dim", !!rd && !rd.ft?.sections?.length);
  const pr = ficheProgress(noteOf(a.pmid));
  const fi = $('#dTabs [data-t="fiche"]');
  if (fi) fi.innerHTML = `Fiche${pr.done ? `<em>${pr.done}/${pr.total}</em>` : ""}`;
}
function setTab(t) {
  flushNote();
  drawer.tab = t;
  $$("#dTabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  renderPane();
  const body = $("#dBody"), wrap = $(".d-tabwrap");
  if (body && wrap && body.scrollTop > wrap.offsetTop) body.scrollTop = wrap.offsetTop;
}
function autoGrow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }

const flushNoteSoon = debounce(() => flushNote(), 500);
function queueNote(k, v) { drawer.patch[k] = v; flushNoteSoon(); }
function flushNote() {
  if (drawer.pmid && Object.keys(drawer.patch).length) {
    const p = drawer.patch;
    drawer.patch = {};
    saveNote(drawer.pmid, p);
    if (drawer.tab === "fiche") {
      const pr = ficheProgress(noteOf(drawer.pmid));
      const bar = $("#dPane .fprog");
      if (bar) { $("span", bar).style.setProperty("--p", pr.done / pr.total); $("em", bar).textContent = `${pr.done} rubrique${pr.done > 1 ? "s" : ""} sur ${pr.total}`; }
    }
    updateTabCounts();
  }
  if (drawer.pmid && drawer.free !== null) {
    setState(drawer.pmid, { n: drawer.free });
    drawer.free = null;
    drawer.edited = true;
  }
}
const flushFreeSoon = debounce(() => flushNote(), 600);

function openArticle(pmid, tab = "essentiel") {
  const a = DB.articles.get(pmid);
  if (!a) return;
  const v = viewOf(a);
  closeDrawer();
  Object.assign(drawer, { pmid, tab, rd: undefined, patch: {}, free: null, edited: false, sel: null });
  const root = $("#drawerRoot");
  root.innerHTML = `<div class="drawer-back"></div>
    <aside class="drawer" role="dialog" aria-label="Détail de l'article">
      <header>
        <div class="seg" id="dStatus">${Object.keys(STATUS).map(s => `<button data-s="${s}" class="${v.st.s === s ? "on" : ""}">${STATUS[s]}</button>`).join("")}</div>
        <button class="star ${v.st.f ? "on" : ""}" id="dFav" title="Pépite" aria-label="Pépite" style="margin-left:auto">${icon("star")}</button>
        <button class="icon-btn" id="dClose" title="Fermer" aria-label="Fermer">${icon("x")}</button>
      </header>
      <div class="body" id="dBody">
        <div style="display:flex;gap:16px;align-items:flex-start">
          <div style="flex:1;font-size:13px;color:var(--ink2)"><b style="color:var(--ink)">${esc(a.journal)}</b><br>${fmtDate(a.date)}, PMID ${esc(a.pmid)}</div>
          ${ringHtml(v.map)}
        </div>
        <h2>${esc(a.title)}</h2>
        <div style="color:var(--ink2);font-size:13px;margin-bottom:10px">${esc(authorsShort(a.authors))}</div>
        <div class="chips" style="margin-bottom:10px">${badgesHtml(v)}</div>
        <div class="dlinks" id="dLinks">${readingLinksHtml(a)}</div>
        <div class="d-tabwrap"><div class="seg d-tabs" id="dTabs" role="tablist">${DTABS.map(([k, l]) => `<button role="tab" data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("")}</div></div>
        <div id="dPane"></div>
      </div>
      <button class="grab" id="dGrab" hidden>${icon("quote")}Garder l'extrait</button>
      <input type="file" id="dCapFile" accept="image/*" multiple hidden>
    </aside>`;
  $(".drawer-back", root).onclick = closeDrawer;
  $("#dClose").onclick = closeDrawer;
  $$("#dStatus button").forEach(b => b.onclick = () => {
    setState(pmid, { s: b.dataset.s }, `status_${b.dataset.s}`);
    $$("#dStatus button").forEach(x => x.classList.toggle("on", x === b));
    refreshAfterEdit();
  });
  $("#dFav").onclick = () => {
    const f = stateOf(pmid).f ? 0 : 1;
    setState(pmid, { f }, f ? "fav" : "unfav");
    $("#dFav").classList.toggle("on", !!f);
    refreshAfterEdit();
  };
  $$("#dTabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
  $("#dCapFile").onchange = (e) => { addCaptures(pmid, e.target.files); e.target.value = ""; };
  $("#dGrab").addEventListener("pointerdown", (e) => e.preventDefault());   // garde la sélection
  $("#dGrab").onclick = () => {
    const s = drawer.sel;
    if (!s) return;
    flushNote();
    const h = [...(noteOf(pmid)?.h || [])];
    if (!h.some(x => x.q === s.q)) h.push({ id: uid(), q: s.q, src: s.src, t: Date.now() });
    saveNote(pmid, { h });
    getSelection()?.removeAllRanges();
    drawer.sel = null;
    $("#dGrab").hidden = true;
    paintExtracts($("#dPane"), pmid);
    updateTabCounts();
    toast("Extrait ajouté à ta fiche");
  };

  const pane = $("#dPane");
  pane.addEventListener("input", (e) => {
    const t = e.target;
    if (t.matches("textarea.grow")) autoGrow(t);
    if (t.dataset.f) queueNote(t.dataset.f, t.value);
    else if (t.id === "dNote") { drawer.free = t.value; flushFreeSoon(); }
    else if (t.dataset.cap) {
      const img = (noteOf(pmid)?.img || []).map(i => i.id === t.dataset.cap ? { ...i, cap: t.value } : i);
      queueNote("img", img);
    }
  });
  pane.addEventListener("click", (e) => {
    const b = e.target.closest("[data-lb], a.xref, button");
    if (!b || !pane.contains(b)) return;
    const d = b.dataset;
    if (d.lb) { openLightbox(a, d.lb); return; }
    if (b.matches("a.xref")) { e.preventDefault(); goRef(a, d.ref); return; }
    if (d.imp) {
      flushNote();
      const imp = noteOf(pmid)?.imp === d.imp ? null : d.imp;
      saveNote(pmid, { imp });
      $$("[data-imp]", pane).forEach(x => x.classList.toggle("on", x.dataset.imp === imp));
      updateTabCounts();
      if (drawer.tab === "fiche") renderPane();
      return;
    }
    if (d.num !== undefined) { appendResult(pmid, d.num); return; }
    if ("insnums" in d) { appendResult(pmid, keyNumbers(a).join(" ; ")); renderPane(); return; }
    if (d.delQ) { flushNote(); saveNote(pmid, { h: (noteOf(pmid)?.h || []).filter(q => q.id !== d.delQ) }); renderPane(); updateTabCounts(); return; }
    if (d.delImg) {
      flushNote();
      const n = noteOf(pmid) || {};
      saveNote(pmid, { img: (n.img || []).filter(i => i.id !== d.delImg), ...(n.pin?.key === "img:" + d.delImg ? { pin: null } : {}) });
      renderPane(); updateTabCounts();
      return;
    }
    if ("addcap" in d) { $("#dCapFile").click(); return; }
    if (d.go) { setTab(d.go); return; }
    if ("retry" in d) { loadDrawerReading(a, true); return; }
    if (d.jump !== undefined) {
      const target = d.jump === "lim" ? $("#lim-h") : $(`#sec-${d.jump}`);
      const det = target?.closest("details");
      if (det) det.open = true;
      target?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    }
  });
  // Glisser une image sur la zone des captures
  pane.addEventListener("dragover", (e) => {
    const z = e.target.closest("[data-drop]");
    if (!z || !e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault(); z.classList.add("drop");
  });
  pane.addEventListener("dragleave", (e) => e.target.closest("[data-drop]")?.classList.remove("drop"));
  pane.addEventListener("drop", (e) => {
    const z = e.target.closest("[data-drop]");
    if (!z) return;
    e.preventDefault(); z.classList.remove("drop");
    addCaptures(pmid, e.dataTransfer.files);
  });

  renderPane();
  updateTabCounts();
  loadDrawerReading(a);
}

function loadDrawerReading(a, force = false) {
  const pmid = a.pmid;
  if (force) { drawer.rd = undefined; renderPaneForReading(a); }
  getReading(a, force)
    .then(rd => { if (drawer.pmid === pmid) { drawer.rd = rd; renderPaneForReading(a); } })
    .catch(e => { if (drawer.pmid === pmid) { drawer.rd = { err: e.message || String(e) }; renderPaneForReading(a); } });
}
/** À l'arrivée du texte intégral : ne pas écraser un champ en cours de saisie. */
function renderPaneForReading(a) {
  const links = $("#dLinks");
  if (links) links.innerHTML = readingLinksHtml(a);
  updateTabCounts();
  if (drawer.tab === "essentiel") {
    const slot = $('#dPane [data-slot="strip"]');
    if (slot) { slot.innerHTML = stripHtml(a); hydrateBlobs(slot); }
  } else if (drawer.tab === "figures" || drawer.tab === "texte") renderPane();
}
function appendResult(pmid, text) {
  flushNote();
  const cur = (noteOf(pmid)?.r || "").replace(/\s+$/, "");
  const r = cur ? `${cur}\n${text}` : text;
  saveNote(pmid, { r });
  const ta = $("#ff-r");
  if (ta) { ta.value = r; autoGrow(ta); }
  updateTabCounts();
  toast("Ajouté au résultat principal de ta fiche");
}
function goRef(a, rid) {
  const rd = drawer.rd;
  if ((rd?.ft?.figs || []).some(f => f.id === rid)) { openLightbox(a, "f:" + rid); return; }
  if ((rd?.ft?.tables || []).some(t => t.id === rid)) {
    setTab("figures");
    const det = $(`#jt-${CSS.escape(rid)}`);
    if (det) { det.open = true; det.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); }
  }
}

function closeDrawer() {
  closeLightbox();
  if (!$("#drawerRoot").children.length) return;
  flushNote();
  const edited = drawer.edited;
  drawer.pmid = null;
  drawer.sel = null;
  $("#drawerRoot").innerHTML = "";
  if (edited) refreshAfterEdit();
}
const refreshAfterEdit = debounce(() => {
  refreshStats();
  if (state.view === "library") loadLibrary();
  if (state.view === "board") (board.mode === "fiches" ? loadFiches() : loadBoard());
  if (state.view === "triage") { pruneTriage(); renderDeck(); }
}, 250);

// Sélection de texte dans le tiroir : proposer de garder l'extrait
document.addEventListener("selectionchange", debounce(() => {
  const g = $("#dGrab");
  if (!g) return;
  const sel = getSelection();
  const text = sel && !sel.isCollapsed ? sel.toString().replace(/\s+/g, " ").trim() : "";
  const node = sel?.anchorNode;
  const host = node ? (node.nodeType === 1 ? node : node.parentElement)?.closest("#dPane [data-src]") : null;
  const ok = text.length >= 8 && !!host && !host.closest("textarea, input");
  if (ok) drawer.sel = { q: text.slice(0, 1500), src: host.dataset.src };
  g.hidden = !ok;
}, 120));

// Coller une image pendant qu'un article est ouvert
document.addEventListener("paste", (e) => {
  if (!drawer.pmid || !$("#drawerRoot").children.length) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  addCaptures(drawer.pmid, files);
});

// Touches 1 à 5 : onglets du tiroir
document.addEventListener("keydown", (e) => {
  if (!drawer.pmid || !$("#drawerRoot").children.length || $(".lb")) return;
  if (e.target.closest?.("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = +e.key;
  if (i >= 1 && i <= DTABS.length) { e.preventDefault(); setTab(DTABS[i - 1][0]); }
});

// ---------- Visionneuse ----------
const lb = { items: [], i: 0, a: null };
function openLightbox(a, key) {
  const items = figItems(a);
  const i = Math.max(0, items.findIndex(it => it.key === key));
  if (!items.length) return;
  closeLightbox();
  Object.assign(lb, { items, i, a });
  const node = el(`<div class="lb" role="dialog" aria-modal="true" aria-label="Figure">
    <div class="lb-bar"><span class="lb-n"></span><span class="grow"></span>
      <button class="lb-btn" data-lbx="pin">${icon("pin")}<span class="lbl">Figure clé</span></button>
      <a class="lb-btn" data-lbx="open" target="_blank" rel="noopener">${icon("expand")}<span class="lbl">Original</span></a>
      <button class="lb-btn ic" data-lbx="close" aria-label="Fermer">${icon("x")}</button></div>
    <div class="lb-stage"></div>
    <div class="lb-cap"></div>
    <button class="lb-nav prev" data-lbx="prev" aria-label="Figure précédente">${icon("chev")}</button>
    <button class="lb-nav next" data-lbx="next" aria-label="Figure suivante">${icon("chev")}</button>
  </div>`);
  document.body.append(node);
  node.addEventListener("click", (e) => {
    const b = e.target.closest("[data-lbx]");
    if (!b) return;
    const k = b.dataset.lbx;
    if (k === "close") closeLightbox();
    else if (k === "prev") lbShow(lb.i - 1);
    else if (k === "next") lbShow(lb.i + 1);
    else if (k === "pin") {
      const it = lb.items[lb.i], cur = noteOf(lb.a.pmid)?.pin?.key;
      flushNote();
      saveNote(lb.a.pmid, { pin: cur === it.key ? null : it.pin });
      toast(cur === it.key ? "Figure clé retirée" : `${it.label} devient la figure clé`);
      lbShow(lb.i);
      if (drawer.pmid === lb.a.pmid) { if (drawer.tab === "essentiel") renderPaneForReading(lb.a); else if (drawer.tab === "figures") renderPane(); }
    }
  });
  // Balayage horizontal pour changer de figure, toucher pour zoomer
  const stage = $(".lb-stage", node);
  let sx = null;
  stage.addEventListener("pointerdown", (e) => { sx = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener("pointerup", (e) => {
    if (!sx) return;
    const dx = e.clientX - sx.x, dy = e.clientY - sx.y;
    sx = null;
    if (node.classList.contains("zoom")) { if (Math.hypot(dx, dy) < 6) lbZoom(false); return; }
    if (Math.abs(dx) > 50 && Math.abs(dy) < 80) lbShow(lb.i + (dx < 0 ? 1 : -1));
    else if (Math.hypot(dx, dy) < 6 && e.target.tagName === "IMG") lbZoom(true, e);
  });
  lbShow(i);
}
function lbShow(i) {
  const node = $(".lb");
  if (!node) return;
  lb.i = (i + lb.items.length) % lb.items.length;
  const it = lb.items[lb.i];
  node.classList.remove("zoom");
  const stage = $(".lb-stage", node);
  stage.classList.remove("broken");
  stage.innerHTML = imgHtml(it).replace(' loading="lazy"', "");
  hydrateBlobs(stage);
  $(".lb-n", node).textContent = lb.items.length > 1 ? `${lb.i + 1} / ${lb.items.length}` : "";
  $(".lb-cap", node).innerHTML = `<b>${esc(it.label)}.</b> ${it.title || ""}${it.cap || ""}`;
  const pinned = noteOf(lb.a.pmid)?.pin?.key === it.key;
  $('[data-lbx="pin"]', node).classList.toggle("on", pinned);
  const img = $("img", stage);
  const open = $('[data-lbx="open"]', node);
  open.removeAttribute("href");
  const setHref = () => { if (img.currentSrc || img.src) open.href = img.currentSrc || img.src; };
  img.addEventListener("load", setHref);
  setHref();
  $$(".lb-nav", node).forEach(b => b.hidden = lb.items.length < 2);
}
function lbZoom(on, e) {
  const node = $(".lb"), stage = $(".lb-stage", node), img = $("img", stage);
  if (!img) return;
  if (!on) { node.classList.remove("zoom"); img.style.width = ""; return; }
  const r = img.getBoundingClientRect();
  const fx = e ? (e.clientX - r.left) / r.width : 0.5, fy = e ? (e.clientY - r.top) / r.height : 0.5;
  node.classList.add("zoom");
  const w = Math.max(stage.clientWidth * 2, img.naturalWidth || 0);
  img.style.width = w + "px";
  requestAnimationFrame(() => {
    stage.scrollLeft = fx * img.offsetWidth - stage.clientWidth / 2;
    stage.scrollTop = fy * img.offsetHeight - stage.clientHeight / 2;
  });
}
function closeLightbox() { $(".lb")?.remove(); }
window.addEventListener("keydown", (e) => {
  if (!$(".lb")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowRight") lbShow(lb.i + 1);
  else if (e.key === "ArrowLeft") lbShow(lb.i - 1);
  else return;
  e.preventDefault();
  e.stopImmediatePropagation();
}, true);

// ---------- Vue Fiches (dans l'onglet Lecture) ----------
function ficheList() {
  const themeSet = board.theme ? descendants([board.theme]) : null;
  const words = (board.q || "").toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const [pmid, n] of Object.entries(DB.notes)) {
    const a = DB.articles.get(pmid);
    if (!a || !hasFiche(pmid)) continue;
    if (themeSet && !(a.th || []).some(id => themeSet.has(id))) continue;
    if (board.fav && !stateOf(pmid).f) continue;
    if (words.length) { const h = noteText(pmid) + " " + haystack(a); if (!words.every(w => h.includes(w))) continue; }
    out.push({ a, n });
  }
  return out.sort((x, y) => (y.n.u || 0) - (x.n.u || 0));
}
function renderFiches(root) {
  root.innerHTML = `<div class="fiches-wrap">
    <div class="triage-bar">
      ${boardModeSeg()}
      <select class="input" id="bTheme" style="width:auto" aria-label="Thème"><option value="">Tous les thèmes</option>${themeOptions(board.theme)}</select>
      <input class="input fq" id="fQ" type="search" placeholder="Chercher dans tes fiches" value="${esc(board.q)}" enterkeyhint="search">
      <span class="left"></span>
      <button class="btn ghost small" id="fMd">${icon("down")}Exporter en Markdown</button>
    </div>

  bindBoardModeSeg();

  $("#fQ").oninput = debounce((e) => { board.q = e.target.value; loadFiches(); }, 200);
  $("#fMd").onclick = () => {
    const list = ficheList();
    if (!list.length) { toast("Aucune fiche à exporter"); return; }
    download(`fiches_lecture_${todayISO()}.md`, fichesMarkdown(list), "text/markdown");
    toast(`${plural(list.length, "fiche exportée", "fiches exportées")}`);
  };
  loadFiches();
}
function loadFiches() {
  const box = $("#fList");
  if (!box) return;
  const list = ficheList();
  const total = Object.keys(DB.notes).filter(hasFiche).length;
  if (!list.length) {
    box.innerHTML = total
      ? `<div class="empty"><div><h3>Aucune fiche ne correspond</h3><p>Change le thème ou la recherche.</p></div></div>`
      : `<div class="empty"><div><h3>Pas encore de fiche de lecture</h3><p>Ouvre un article et écris ce que tu en retiens : la phrase à garder, le PICO, un extrait surligné, une capture de figure. Tes fiches se rassemblent ici.</p></div></div>`;
    return;
  }
  box.innerHTML = "";
  list.slice(0, 300).forEach(({ a, n }) => {
    const thumb = n.pin || (n.img?.[0] ? { t: "img", id: n.img[0].id, label: "Capture" } : null);
    const pico = FICHE_FIELDS.filter(f => filled(n[f.k]));
    const card = el(`<article class="fcard" tabindex="0" data-pmid="${esc(a.pmid)}">
      <div style="min-width:0">
        <p class="fk ${filled(n.k) ? "" : "none"}">${filled(n.k) ? esc(n.k) : "Pas encore de phrase à retenir"}</p>
        ${pico.length ? `<dl class="fpico">${pico.map(f => `<dt>${f.label}</dt><dd>${esc(n[f.k])}</dd>`).join("")}</dl>` : ""}
        ${filled(n.m) ? `<p class="fsrc" style="margin:0 0 8px;color:var(--ink)"><b>Pour moi :</b> ${esc(n.m)}</p>` : ""}
        <div class="fsrc"><b>${esc(a.title)}</b><br>${esc(a.ja || a.journal)}, ${(a.date || "").slice(0, 4)}</div>
        <div class="fmeta">
          ${n.imp ? `<span class="pill imp-${n.imp}">${esc(IMPACT[n.imp])}</span>` : ""}
          <span class="status-tag">${STATUS[stateOf(a.pmid).s]}</span>
          ${(n.h || []).length ? `<span class="hint">${plural(n.h.length, "extrait", "extraits")}</span>` : ""}
          ${(n.img || []).length ? `<span class="hint">${plural(n.img.length, "capture", "captures")}</span>` : ""}
        </div>
      </div>
      ${thumb ? `<div class="fthumb"><span class="fimg">${pinImg(thumb)}</span></div>` : ""}
    </article>`);
    card.onclick = () => openArticle(a.pmid, "fiche");
    card.onkeydown = (e) => { if (e.key === "Enter") openArticle(a.pmid, "fiche"); };
    box.append(card);
  });
  hydrateBlobs(box);
}
function fichesMarkdown(list) {
  const line = (s) => String(s || "").replace(/\s*\n\s*/g, " ").trim();
  const out = [`# Fiches de lecture`, ``, `Exportées le ${fmtDate(todayISO())}, ${plural(list.length, "fiche", "fiches")}.`, ``];
  for (const { a, n } of list) {
    out.push(`## ${line(a.title)}`, ``);
    out.push(`${a.journal || a.ja || ""}, ${(a.date || "").slice(0, 4)}. [PubMed ${a.pmid}](https://pubmed.ncbi.nlm.nih.gov/${a.pmid}/)${a.doi ? `, [DOI](https://doi.org/${a.doi})` : ""}`, ``);
    if (filled(n.k)) out.push(`**À retenir.** ${line(n.k)}`, ``);
    if (n.imp) out.push(`**Pour ma pratique.** ${IMPACT[n.imp]}`, ``);
    const pico = FICHE_FIELDS.filter(f => filled(n[f.k]));
    if (pico.length) { pico.forEach(f => out.push(`- **${f.label}** : ${line(n[f.k])}`)); out.push(``); }
    if (filled(n.m)) out.push(`**Ce que ça change pour moi.** ${line(n.m)}`, ``);
    (n.h || []).forEach(h => out.push(`> ${line(h.q)}${h.src ? ` (${h.src})` : ""}`, ``));
    const free = stateOf(a.pmid).n;
    if (filled(free)) out.push(`Note : ${line(free)}`, ``);
    const themes = liveThemeIds(a).map(getTheme).filter(Boolean).map(t => "#" + t.name.replace(/\s+/g, "_"));
    if (themes.length) out.push(themes.join(" "), ``);
  }
  return out.join("\n");
}

function loadBoard() {
  $$("#view-board .col").forEach(col => {
    const s = col.dataset.s;
    const all = queryArticles({ status: [s], sort: s === "toread" ? "map" : "changed", themes: board.theme ? [board.theme] : [], fav: board.fav });
    const items = all.slice(0, 200);
    const box = $(".cards", col);
    box.innerHTML = items.length ? "" : `<p class="hint" style="text-align:center;padding:20px 8px">Dépose un article ici</p>`;
    items.forEach(v => box.append(kanbanCard(v)));
    $(".n", col).textContent = all.length > items.length ? `${nf(items.length)} sur ${nf(all.length)}` : nf(all.length);
  });
}

function kanbanCard(v) {
  const a = v.a;
  const k = el(`<div class="kcard" data-pmid="${esc(a.pmid)}">
    <div class="t">${v.st.f ? `<span style="color:var(--red)">★ </span>` : ""}${esc(a.title)}</div>
    <div class="m"><span>${esc(a.ja || a.journal)}</span><span>${(a.date || "").slice(0, 4)}</span>
    ${hasFiche(a.pmid) ? `<span class="fpip" title="Fiche de lecture">${icon("pen")}</span>` : ""}<span class="score ${scoreClass(v.map)}" title="Mapping score">${Math.round(v.map)}</span></div></div>`);
  let start = null, timer = null, suppressClick = false;

  const begin = (e) => {
    clearTimeout(timer);
    const r = k.getBoundingClientRect();
    const ghost = k.cloneNode(true);
    ghost.classList.add("kghost");
    ghost.style.width = r.width + "px";
    document.body.append(ghost);
    kdrag = { pmid: a.pmid, card: k, ghost, ox: e.clientX - r.left, oy: e.clientY - r.top, over: null };
    k.classList.remove("pressing");
    k.classList.add("dragging");
    if (navigator.vibrate) navigator.vibrate(10);
    move(e);
  };
  const move = (e) => {
    if (!kdrag) return;
    kdrag.ghost.style.left = (e.clientX - kdrag.ox) + "px";
    kdrag.ghost.style.top = (e.clientY - kdrag.oy) + "px";
    const col = document.elementFromPoint(e.clientX, e.clientY)?.closest(".col");
    $$("#board .col").forEach(c => c.classList.toggle("over", c === col && c !== k.closest(".col")));
    kdrag.over = col;
    const b = $("#board");
    const br = b.getBoundingClientRect();
    if (e.clientX < br.left + 40) b.scrollLeft -= 14;
    else if (e.clientX > br.right - 40) b.scrollLeft += 14;
  };
  const finish = (e) => {
    clearTimeout(timer);
    k.classList.remove("pressing");
    start = null;
    if (!kdrag) return;
    if (e?.type === "pointerup") move(e);   // position exacte au relâchement
    const { ghost, over } = kdrag;
    ghost.remove();
    k.classList.remove("dragging");
    $$("#board .col").forEach(c => c.classList.remove("over"));
    kdrag = null;
    suppressClick = true;
    setTimeout(() => suppressClick = false, 50);
    if (over && over !== k.closest(".col")) {
      $("p.hint", over)?.remove();
      $(".cards", over).prepend(k);
      setState(a.pmid, { s: over.dataset.s }, `status_${over.dataset.s}`);
      $$("#board .col").forEach(c => { $(".n", c).textContent = nf($$(".kcard", c).length); });
      refreshStatsSoon();
    }
  };

  k.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY, type: e.pointerType };
    if (e.pointerType !== "mouse") {
      k.classList.add("pressing");
      timer = setTimeout(() => { k.setPointerCapture(e.pointerId); begin({ clientX: start.x, clientY: start.y }); }, 350);
    }
  });
  k.addEventListener("pointermove", (e) => {
    if (kdrag?.card === k) { move(e); return; }
    if (!start) return;
    const d = Math.hypot(e.clientX - start.x, e.clientY - start.y);
    if (start.type === "mouse" && d > 5) { k.setPointerCapture(e.pointerId); begin(e); }
    else if (start.type !== "mouse" && d > 8) { clearTimeout(timer); k.classList.remove("pressing"); start = null; }
  });
  k.addEventListener("pointerup", finish);
  k.addEventListener("pointercancel", finish);
  k.addEventListener("contextmenu", (e) => e.preventDefault());
  k.addEventListener("click", () => { if (!suppressClick) openArticle(a.pmid); });
  return k;
}

/** Import : format web, ou export de la version Python (veille-urcv/1). */
async function importData(data) {
  let incoming;
  if (data.format === "veille-urcv-web/1") {
    incoming = data;
  } else if (data.format === "veille-urcv/1") {
    incoming = convertPythonExport(data);
  } else throw new Error("Ce fichier n'est pas un export de cette application.");
  await applyCore(incoming);
  const bySh = {};
  (incoming.articles || []).forEach(a => (bySh[shardOf(a.pmid)] ||= []).push(a));
  for (const [name, list] of Object.entries(bySh)) { await applyShard(name, list); markDirty(name); }
  markDirty("core");
  return { articles: (incoming.articles || []).length };
}

function convertPythonExport(d) {
  const J = (v, def) => { try { return typeof v === "string" ? JSON.parse(v) : (v ?? def); } catch { return def; } };
  const ms = (iso) => iso ? Date.parse(iso) || 0 : 0;
  const tid = (id) => "py-" + id;
  const now = Date.now();
  const themes = {}, exclusions = {}, states = {}, scans = {}, sources = {};
  (d.themes || []).forEach(t => {
    themes[tid(t.id)] = { id: tid(t.id), name: t.name, terms: J(t.terms, []), parent: t.parent_id ? tid(t.parent_id) : null,
      weight: t.weight, color: t.color, x: t.x, y: t.y, enabled: !!t.enabled, ctx: !!t.use_context, u: now, del: false };
    if (t.last_scan) scans[tid(t.id)] = { last: t.last_scan, hash: termsHash(themes[tid(t.id)]), n: t.last_new || 0, u: now };
  });
  (d.exclusions || []).forEach(e => {
    exclusions["py-x" + e.id] = { id: "py-x" + e.id, term: e.term, field: e.field, theme: e.theme_id ? tid(e.theme_id) : null,
      enabled: !!e.enabled, label: e.label, u: now, del: false };
  });
  const links = {};
  (d.article_themes || []).forEach(l => (links[l.pmid] ||= []).push(tid(l.theme_id)));
  const articles = (d.articles || []).map(a => {
    if (a.status !== "inbox" || a.favorite || a.note) {
      states[a.pmid] = { s: a.status, f: a.favorite ? 1 : 0, d: a.dislike ? 1 : 0, n: a.note || "", t: ms(a.status_changed_at) || ms(a.first_seen) };
    }
    return {
      pmid: a.pmid, doi: a.doi, pmc: a.pmc, title: a.title, abstract: a.abstract, journal: a.journal, ja: a.journal_abbr,
      date: a.pub_date, edat: a.entrez_date, authors: J(a.authors, []), types: J(a.pub_types, []), mesh: J(a.mesh, []),
      kw: J(a.keywords, []), lang: a.lang, pre: a.is_preprint, ret: a.is_retracted, oa: a.is_oa, oaUrl: a.oa_url,
      ci: a.citations_icite, co: a.citations_oa, rcr: a.rcr, apt: a.apt, cc: a.clinical_cites, fwci: a.fwci,
      cby: J(a.counts_by_year, []).map(c => ({ y: c.year, n: c.cited_by_count })), src: a.source_id,
      mu: ms(a.metrics_updated_at), fs: ms(a.first_seen), th: links[a.pmid] || [],
    };
  });
  (d.sources || []).forEach(s => { sources[s.id] = { name: s.name, impact: s.impact, h: s.h_index, t: ms(s.fetched_at) }; });
  const events = (d.events || []).map(e => ({ id: "py-" + hashStr(e.ts + e.kind + e.pmid), ts: ms(e.ts), k: e.kind, p: e.pmid }));
  return { themes, exclusions, states, scans, sources, events, settings: {}, articles };
}

/* =====================================================================
   15. Démarrage
   ===================================================================== */
(async function boot() {
  try {
    await loadDB();
  } catch (e) {
    document.body.innerHTML = `<div class="empty" style="height:100vh"><div><h3>Stockage indisponible</h3><p>${esc(e.message)}. En navigation privée, certains navigateurs bloquent le stockage local.</p></div></div>`;
    return;
  }
  navigator.storage?.persist?.();
  trainModel();
  triage.baseline = new Set(MODEL.concepts.map(c => c.key));
  refreshStats();
  renderSync();
  go("triage");

  if (syncConfigured() && secrets().auto_sync) await syncNow({ quiet: true });
  const s = DB.settings;
  if (s.auto_scan_enabled && Date.now() - (state.stats?.lastScan || 0) > (+s.auto_scan_hours || 20) * 3600e3) {
    toast("Scan automatique lancé");
    startScan();
  }
  setInterval(() => {
    renderSync();
    if (document.visibilityState === "visible" && syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true });
  }, 5 * 60e3);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true });
  });
  window.addEventListener("beforeunload", (e) => { if (SCAN.running) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("resize", debounce(() => { if (state.view === "library") $("#fOpen") && ($("#fOpen").hidden = !isMobile()); }, 200));
})();
