<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille</title>
<meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Veille">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* =====================================================================
   Jetons de design
   Rouge artériel / bleu oxygéné : la dualité d'un circuit d'assistance.
   ===================================================================== */
:root {
  --bg: #F2F2F5;
  --panel: rgba(255, 255, 255, 0.78);
  --card: #FFFFFF;
  --sunk: #EBEBF0;
  --ink: #1D1D1F;
  --ink2: #6E6E73;
  --ink3: #A1A1A6;
  --line: rgba(0, 0, 0, 0.08);
  --line2: rgba(0, 0, 0, 0.14);
  --blue: #0A6CFF;
  --blue-soft: rgba(10, 108, 255, 0.10);
  --red: #D7263D;
  --red-soft: rgba(215, 38, 61, 0.10);
  --violet: #5E5CE6;
  --violet-soft: rgba(94, 92, 230, 0.12);
  --green: #1F9D55;
  --green-soft: rgba(31, 157, 85, 0.12);
  --amber: #E08600;
  --amber-soft: rgba(224, 134, 0, 0.12);
  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --shadow-2: 0 8px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.05);
  --shadow-3: 0 24px 60px rgba(20,20,40,.18), 0 4px 14px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --tabbar-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --panel: rgba(28, 28, 30, 0.78);
    --card: #1C1C1E;
    --sunk: #2C2C2E;
    --ink: #F5F5F7;
    --ink2: #A1A1A6;
    --ink3: #6E6E73;
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.16);
    --blue: #3D8BFF;
    --blue-soft: rgba(61, 139, 255, 0.16);
    --red: #FF4D5E;
    --red-soft: rgba(255, 77, 94, 0.16);
    --violet: #8583FF;
    --violet-soft: rgba(133, 131, 255, 0.18);
    --green: #3DD68C;
    --green-soft: rgba(61, 214, 140, 0.15);
    --amber: #FFB340;
    --amber-soft: rgba(255, 179, 64, 0.16);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 8px 30px rgba(0,0,0,.5);
    --shadow-3: 0 24px 60px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; }
.sidebar {
  background: var(--panel);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 12px 14px;
  gap: 4px;
  min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 26px; height: 14px; }
.brand strong { display: block; font-family: var(--font-display); font-size: 15px; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 12px; color: var(--ink2); }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
  background: transparent; text-align: left; color: var(--ink);
  font-size: 14px;
}
.nav-item:hover { background: var(--line); }
.nav-item.active { background: var(--blue); color: #fff; }
.count {
  margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px;
  background: var(--red); color: #fff; font-size: 12px; font-weight: 600; text-align: center;
  font-variant-numeric: tabular-nums;
}
.nav-item.active .count { background: rgba(255,255,255,.25); }
.nav-spacer { flex: 1; }

.side-stats { margin: 10px 4px 10px; padding: 14px 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-1); }
.side-stats .row { display: flex; justify-content: space-between; align-items: baseline; }
.side-stats .big { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.side-stats .small { font-size: 12px; color: var(--ink2); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 12px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--sunk); }
.heat i[data-l="1"] { background: color-mix(in srgb, var(--red) 30%, var(--sunk)); }
.heat i[data-l="2"] { background: color-mix(in srgb, var(--red) 55%, var(--sunk)); }
.heat i[data-l="3"] { background: color-mix(in srgb, var(--red) 80%, var(--sunk)); }
.heat i[data-l="4"] { background: var(--red); }

.sync-line { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--ink2); border: 0; background: none; border-radius: 9px; width: 100%; text-align: left; }
.sync-line:hover { background: var(--line); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); flex: none; }
.sync-dot.ok { background: var(--green); }
.sync-dot.busy { background: var(--blue); animation: blink 1s ease-in-out infinite; }
.sync-dot.error { background: var(--red); }
@keyframes blink { 50% { opacity: .3; } }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px; min-height: 64px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  position: relative; z-index: 20;
}
.topbar h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
.topbar .grow { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; width: min(340px, 30vw);
  padding: 7px 12px; border-radius: 10px; background: var(--sunk); color: var(--ink2);
}
.search input { border: 0; background: transparent; outline: none; width: 100%; color: var(--ink); }

.view { flex: 1; min-height: 0; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }

.tabbar { display: none; }

/* ---------- Boutons, champs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 7px 13px; border-radius: 9px; border: 1px solid transparent;
  background: var(--blue); color: #fff; font-weight: 500; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line2); box-shadow: var(--shadow-1); }
.btn.plain { background: transparent; color: var(--blue); padding: 6px 8px; }
.btn.danger { background: var(--red); }
.btn.small { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink2); flex: none;
}
.icon-btn:hover { background: var(--line); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .label { font-size: 12px; font-weight: 600; color: var(--ink2); }
.input, select.input, textarea.input {
  width: 100%; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--line2); background: var(--card); outline: none;
  font-size: 16px; /* évite le zoom automatique sur iOS */
}
@media (min-width: 761px) { .input, select.input, textarea.input { font-size: 14px; } }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
textarea.input { resize: vertical; min-height: 80px; }
textarea.code { font-family: var(--mono); font-size: 12px; }
.hint { font-size: 12px; color: var(--ink2); }

.switch { position: relative; width: 42px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line2); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line2);
  background: var(--card); font-size: 13px; color: var(--ink); white-space: nowrap;
}
button.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .x { border: 0; background: none; padding: 0; color: var(--ink3); display: grid; }
.chip .x:hover { color: var(--red); }
.chip svg.i { width: 13px; height: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ev { background: var(--violet-soft); color: var(--violet); }
.pill.hot { background: var(--red-soft); color: var(--red); }
.pill.clinical { background: var(--green-soft); color: var(--green); }
.pill.oa { background: var(--blue-soft); color: var(--blue); }
.pill.new { background: var(--amber-soft); color: var(--amber); }
.pill.retracted { background: var(--red); color: #fff; }
.pill.preprint { background: var(--sunk); color: var(--ink2); }
.pill.aff { background: var(--blue-soft); color: var(--blue); }
.pill.pick { background: var(--violet); color: #fff; }

.score {
  display: inline-grid; place-items: center; min-width: 38px; height: 26px; padding: 0 8px;
  border-radius: 8px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
  background: var(--sunk); color: var(--ink2);
}
.score.s2 { background: var(--violet-soft); color: var(--violet); }
.score.s3 { background: var(--red); color: #fff; }

.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--sunk); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }

.empty { display: grid; place-items: center; text-align: center; padding: 60px 20px; color: var(--ink2); }
.empty h3 { font-family: var(--font-display); color: var(--ink); font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 42ch; }
.empty .btn { margin: 4px; }

/* ---------- Pilule de scan (le « pouls » de la veille) ---------- */
.scan {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 4px 4px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow-1);
  cursor: pointer; min-height: 38px; min-width: 0;
}
.scan .meta { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.scan .go { border-radius: 999px; padding: 6px 14px; }
.scan .icon-btn { color: var(--red); }
.scan.running { padding-left: 8px; border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.ecg { width: 86px; height: 26px; flex: none; }
.ecg path { fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 60 200; animation: ecg 1.6s linear infinite; }
@keyframes ecg { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
.scan .txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; width: 170px; }
.scan .txt strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scan .txt span { font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan .bar { height: 3px; border-radius: 3px; background: var(--sunk); margin-top: 3px; overflow: hidden; }
.scan .bar i { display: block; height: 100%; background: var(--red); transition: width .4s; }

.popover {
  position: absolute; right: 22px; top: 60px; width: min(420px, calc(100vw - 24px)); max-height: 70vh; overflow: auto;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-3); border: 1px solid var(--line);
  padding: 16px; z-index: 40;
}
.popover h4 { margin: 0 0 10px; font-size: 13px; }
.log { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); background: var(--sunk); border-radius: 10px; padding: 10px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
.qlist { list-style: none; margin: 0 0 12px; padding: 0; }
.qlist li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.qlist li:last-child { border: 0; }

/* =====================================================================
   Triage : le paquet de cartes
   ===================================================================== */
.triage { display: grid; grid-template-rows: auto 1fr auto; height: 100%; padding: 16px 24px 20px; gap: 12px; }
.triage-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.triage-bar .left { font-size: 13px; color: var(--ink2); margin-left: auto; font-variant-numeric: tabular-nums; }
.deck { position: relative; width: min(720px, 100%); margin: 0 auto 26px; height: calc(100% - 26px); min-height: 320px; }
.card {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--card); border-radius: 26px;
  box-shadow: var(--shadow-2); border: 1px solid var(--line);
  padding: 26px 30px 20px;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transform-origin: 50% 90%;
  will-change: transform;
}
.card.behind { pointer-events: none; }
.card.top { cursor: grab; box-shadow: var(--shadow-3); }
.card.dragging { cursor: grabbing; }
.card.leaving { transition: transform .32s cubic-bezier(.4,.1,.6,1), opacity .32s; }
.card.snap { transition: transform .35s cubic-bezier(.2,1.4,.4,1); }
.card-head { display: flex; align-items: flex-start; gap: 16px; }
.card-head .src { flex: 1; min-width: 0; font-size: 13px; color: var(--ink2); }
.card-head .src b { color: var(--ink); font-weight: 600; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .track { stroke: var(--sunk); }
.ring .val { stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.card h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.22; letter-spacing: -0.015em; margin: 10px 0 8px; font-weight: 650; max-width: 60ch; }
.card .authors { font-size: 13px; color: var(--ink2); margin-bottom: 12px; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; flex: none; }
.metrics div { background: var(--card); padding: 8px 12px; min-width: 0; }
.metrics b { display: block; font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.metrics span { font-size: 11.5px; color: var(--ink2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abstract { flex: 1; min-height: 0; overflow: auto; font-size: 14px; line-height: 1.55; color: var(--ink); padding-right: 6px; max-width: 75ch; touch-action: pan-y; -webkit-user-select: text; user-select: text; cursor: auto; }
.abstract p { margin: 0 0 8px; }
.abstract b { color: var(--ink2); font-weight: 600; }
.card-foot { display: flex; gap: 14px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; font-size: 13px; min-width: 0; }
.card-foot .links { display: flex; gap: 14px; flex: none; }
.card-foot .themes { margin-left: auto; flex-wrap: nowrap; overflow: hidden; min-width: 0; }

.stamp {
  position: absolute; padding: 6px 14px; border-radius: 10px;
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  border: 3px solid currentColor; opacity: 0; pointer-events: none; background: var(--card); z-index: 2;
}
.stamp.right { left: 30px; top: 40%; color: var(--green); transform: rotate(-10deg); }
.stamp.left { right: 30px; top: 40%; color: var(--ink2); transform: rotate(10deg); }
.stamp.up { left: 50%; bottom: 90px; color: var(--red); transform: translateX(-50%); }
.stamp.down { left: 50%; top: 70px; color: var(--amber); transform: translateX(-50%); }

.actions { display: flex; justify-content: center; align-items: center; gap: 18px; }
.act {
  width: 58px; height: 58px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow-2);
  transition: transform .15s;
}
.act svg.i { width: 24px; height: 24px; stroke-width: 2.2; }
.act:hover { transform: scale(1.07); }
.act:active { transform: scale(.95); }
.act.left { color: var(--ink2); }
.act.down { color: var(--amber); width: 46px; height: 46px; }
.act.up { color: var(--red); width: 66px; height: 66px; }
.act.up svg.i { width: 28px; height: 28px; }
.act.right { color: var(--green); }
.act.train { color: var(--violet); width: 46px; height: 46px; }
.act.undo { color: var(--ink3); width: 40px; height: 40px; box-shadow: var(--shadow-1); }
.act.undo svg.i { width: 18px; height: 18px; }
.keys { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 6px; }
kbd { font-family: var(--font); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line2); background: var(--card); color: var(--ink2); }

/* =====================================================================
   Graphe de thèmes
   ===================================================================== */
.graph-wrap { position: absolute; inset: 0; overflow: hidden;
  background-image: radial-gradient(circle, var(--line2) 1px, transparent 1.2px);
  background-size: 24px 24px; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.panning { cursor: grabbing; }
.gtools { position: absolute; left: 18px; top: 16px; display: flex; gap: 8px; z-index: 5; flex-wrap: wrap; }
.ghelp { position: absolute; left: 18px; bottom: 14px; font-size: 12px; color: var(--ink3); z-index: 5; }
.edge { stroke: var(--line2); stroke-width: 1.6; }
.node { cursor: pointer; }
.node .core { stroke: var(--card); stroke-width: 3; }
.node.folder .core { fill: var(--card) !important; stroke-width: 2.5; stroke-dasharray: 4 3; }
.node .halo { fill: none; stroke: var(--blue); stroke-width: 3; opacity: 0; }
.node.selected .halo { opacity: 1; }
.node.target .halo { opacity: 1; stroke: var(--green); stroke-dasharray: 5 4; }
.node.disabled { opacity: .35; }
.node text { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node .sub { font-size: 11px; font-weight: 400; fill: var(--ink2); }
.node .nb circle { fill: var(--red); stroke: var(--card); stroke-width: 2; }
.node .nb text { fill: #fff; stroke: none; font-size: 10.5px; font-weight: 700; }
.node .initial { fill: #fff; stroke: none; font-size: 13px; }
.node.folder .initial { fill: var(--ink2); }
.node.neg .core { opacity: .45; stroke-dasharray: 5 4; }
.graph-wrap.focused .node { transition: opacity .18s; }
.node.dim { opacity: .16; }
.node.near .core { stroke: var(--ink); stroke-width: 2.5; }
.edge.dim { opacity: .12; }
.edge.hl { stroke: var(--blue); opacity: .9; }
.node.weak .core { opacity: .7; }
.map-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 24px; }
.map-empty > div { pointer-events: auto; max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow-2); padding: 22px 24px; }
.map-empty h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 6px; }
.map-empty p { color: var(--ink2); margin: 0 0 12px; font-size: 13.5px; }
.wbar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; display: flex; }
.wbar i { display: block; height: 100%; }
.node .pulse { fill: none; stroke: var(--red); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.scanning .pulse { animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }

.inspector {
  position: absolute; right: 16px; top: 16px; bottom: 16px; width: 370px;
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow-3); border: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 6;
}
.inspector header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--line); }
.inspector header input { font-family: var(--font-display); font-size: 19px; font-weight: 650; border: 0; background: transparent; outline: none; flex: 1; min-width: 0; padding: 2px 4px; border-radius: 6px; }
.inspector header input:focus { background: var(--sunk); }
.inspector .body { padding: 16px 20px; overflow: auto; flex: 1; }
.inspector footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.statline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.statline div { background: var(--sunk); border-radius: 12px; padding: 8px 10px; }
.statline b { display: block; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.statline span { font-size: 11.5px; color: var(--ink2); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line2); }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
.prio { display: flex; gap: 6px; }
.prio button { width: 34px; height: 18px; border-radius: 6px; border: 0; background: transparent; padding: 5px 0; position: relative; }
.prio button::before { content: ""; position: absolute; inset: 5px 0; border-radius: 4px; background: var(--sunk); }
.prio button.on::before { background: var(--red); }
.term { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 9px; background: var(--sunk); margin-bottom: 5px; }
.term span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.term select { border: 0; background: var(--card); border-radius: 6px; padding: 2px 4px; font-size: 12px; }
.addrow { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.addrow .input { flex: 1 1 160px; min-width: 0; }
.addrow select.input { width: auto; flex: none; }
pre.query { font-family: var(--mono); font-size: 11.5px; background: var(--sunk); padding: 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; margin: 0 0 6px; max-height: 160px; overflow: auto; user-select: text; }
.mesh-item { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 6px; }
.mesh-item .chips { margin-top: 6px; }
.section { margin-bottom: 18px; }
.section > .label { display: block; margin-bottom: 8px; }

/* =====================================================================
   Bibliothèque
   ===================================================================== */
.lib { display: grid; grid-template-columns: 270px 1fr; min-height: 100%; }
.filters { border-right: 1px solid var(--line); padding: 18px 16px 40px; position: sticky; top: 0; align-self: start; max-height: calc(100dvh - 64px); overflow: auto; }
.filters .section { margin-bottom: 20px; }
.filters .seg button { padding: 4px 7px; font-size: 12.5px; }
.filters-head { display: none; }
.theme-check { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
.theme-check input { accent-color: var(--blue); width: 16px; height: 16px; }
.range-row { display: flex; gap: 6px; align-items: center; }
.range-row .input { padding: 5px 8px; }
input[type=range] { width: 100%; accent-color: var(--red); }
.results { padding: 14px 22px 40px; min-width: 0; }
.results-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 3; }
.results-bar .rcount { font-size: 13px; color: var(--ink2); margin-right: auto; font-variant-numeric: tabular-nums; }
.lib-search { display: none; }
.bulk { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); flex-wrap: wrap; }
.bulk .btn { background: rgba(127,127,127,.22); color: inherit; }
.list { background: var(--card); border-radius: 16px; box-shadow: var(--shadow-1); border: 1px solid var(--line); overflow: hidden; }
.item { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 12px; align-items: start; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--sunk) 50%, transparent); }
.item input[type=checkbox] { margin-top: 5px; accent-color: var(--blue); width: 16px; height: 16px; }
.item .t { font-weight: 600; line-height: 1.3; margin-bottom: 3px; max-width: 90ch; }
.item .m { font-size: 12.5px; color: var(--ink2); margin-bottom: 5px; }
.item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.star { border: 0; background: none; padding: 4px; color: var(--ink3); display: grid; }
.star.on { color: var(--red); }
.star.on svg { fill: currentColor; }
.status-tag { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink2); }
.saved-view { display: flex; align-items: center; }
.more { display: flex; justify-content: center; padding: 16px; }

/* =====================================================================
   Tableau de lecture (Kanban)
   ===================================================================== */
.board-wrap { display: flex; flex-direction: column; height: 100%; padding: 14px 22px 18px; gap: 12px; }
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; }
.col { display: flex; flex-direction: column; min-height: 0; background: var(--sunk); border-radius: 18px; padding: 10px; transition: background .15s, box-shadow .15s; }
.col.over { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue); }
.col header { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
.col header h3 { margin: 0; font-size: 14px; }
.col header .n { margin-left: auto; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.col header .bullet { width: 10px; height: 10px; border-radius: 3px; }
.col .cards { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.kcard { background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow-1); cursor: grab; border: 1px solid var(--line); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.kcard.dragging { opacity: .35; }
.kcard.pressing { transform: scale(.98); transition: transform .3s; }
.kcard .t { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
.kcard .m { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink2); min-width: 0; }
.kcard .m span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kcard .m .score { min-width: 30px; height: 20px; font-size: 11.5px; margin-left: auto; }
.kcard .m .fpip { margin-left: auto; }
.kcard .m .fpip + .score { margin-left: 0; }
.kghost { position: fixed; z-index: 90; pointer-events: none; width: 240px; box-shadow: var(--shadow-3); transform: rotate(3deg); opacity: .95; }

/* =====================================================================
   Réglages
   ===================================================================== */
.settings { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }
.group { background: var(--card); border-radius: 16px; box-shadow: var(--shadow-1); border: 1px solid var(--line); padding: 18px 20px 6px; margin-bottom: 18px; }
.group h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 17px; }
.group > p { margin: 0 0 14px; color: var(--ink2); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.weight { display: grid; grid-template-columns: 150px 1fr 40px; align-items: center; gap: 12px; margin-bottom: 10px; }
.weight b { text-align: right; font-variant-numeric: tabular-nums; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.save-bar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 0; background: linear-gradient(transparent, var(--bg) 40%); }

/* =====================================================================
   Tiroir de détail, modales, toasts
   ===================================================================== */
.drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 50; }
.drawer {
  position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(620px, 94vw);
  background: var(--card); border-radius: 22px; box-shadow: var(--shadow-3); z-index: 51;
  display: flex; flex-direction: column; animation: slidein .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.drawer .body { padding: 20px 26px 30px; overflow: auto; flex: 1; }
.drawer h2 { font-family: var(--font-display); font-size: 22px; line-height: 1.25; margin: 6px 0 8px; letter-spacing: -0.01em; }
.drawer .abstract { overflow: visible; max-width: none; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
.bars i { flex: none; width: 100%; max-width: 28px; background: var(--red); border-radius: 5px 5px 2px 2px; min-height: 2px; }
.bars span { font-size: 10.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.bars em { font-style: normal; font-size: 10.5px; color: var(--ink); font-weight: 600; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 60; display: grid; place-items: center; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: 88dvh; display: flex; flex-direction: column; background: var(--card); border-radius: 20px; box-shadow: var(--shadow-3); animation: pop .2s cubic-bezier(.2,1.2,.4,1); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal header { padding: 18px 22px 6px; }
.modal header h3 { margin: 0; font-family: var(--font-display); font-size: 19px; }
.modal header p { margin: 4px 0 0; color: var(--ink2); font-size: 13px; }
.modal .body { padding: 12px 22px; overflow: auto; }
.modal footer { padding: 12px 22px 18px; display: flex; justify-content: flex-end; gap: 8px; }
.excl { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.excl:last-child { border: 0; }
.excl .what { flex: 1; min-width: 0; }
.excl .what b { display: block; font-weight: 600; }
.excl .what code { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); word-break: break-all; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--sunk); color: var(--ink2); white-space: nowrap; }

#toasts { position: fixed; left: 50%; bottom: calc(22px + var(--tabbar-h)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; align-items: center; width: max-content; max-width: calc(100vw - 24px); }
.toast { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-3); font-size: 13.5px; animation: pop .2s; }
.toast button { border: 0; background: rgba(127,127,127,.25); color: inherit; padding: 4px 10px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.toast.error { background: var(--red); color: #fff; }

/* =====================================================================
   Lecture approfondie : onglets du tiroir, figures, texte, fiche
   ===================================================================== */
.dlinks { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 2px 0 6px; font-size: 14px; }
.dlinks .btn.pdf, .dlinks .btn.pdf:hover { color: #fff; text-decoration: none; }
.d-tabwrap { position: sticky; top: -20px; z-index: 5; background: var(--card); padding: 10px 0; margin: 4px 0 10px; }
.d-tabs { display: flex; width: 100%; }
.d-tabs button { flex: 1; padding: 6px 4px; }
.d-tabs button em { font-style: normal; font-size: 11px; color: var(--ink3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.d-tabs button.dim { color: var(--ink3); }
.label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }

/* Conclusion en tête, chiffres surlignés */
.lead { background: var(--sunk); border-radius: 16px; padding: 13px 16px 15px; margin-bottom: 16px; }
.lead p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; letter-spacing: -0.005em; -webkit-user-select: text; user-select: text; }
mark { background: none; color: inherit; }
mark.st, mark.ci, mark.vs { background: var(--blue-soft); color: var(--blue); font-weight: 600; border-radius: 4px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.p { background: var(--violet-soft); color: var(--violet); font-weight: 600; border-radius: 4px; padding: 0 2px; }
mark.n { font-weight: 650; }
mark.hl { background: var(--amber-soft); color: inherit; border-bottom: 2px solid color-mix(in srgb, var(--amber) 60%, transparent); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.keynums { margin-top: 6px; }
.chip.knum { background: var(--blue-soft); border-color: transparent; color: var(--blue); font-weight: 600; font-variant-numeric: tabular-nums; white-space: normal; text-align: left; }
.chip.knum:hover { border-color: var(--blue); }

/* Figures : bandeau, grille, vignettes */
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -26px; padding: 0 26px 4px; scroll-padding: 26px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.th { flex: none; width: 176px; border: 0; background: none; padding: 0; text-align: left; scroll-snap-align: start; color: var(--ink); }
.fimg { display: grid; place-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; position: relative; }
.fimg img { width: 100%; height: 100%; object-fit: contain; display: block; }
.fimg.broken img { display: none; }
.fimg.broken::after { content: "Image indisponible"; font-size: 12px; color: #86868B; padding: 8px; text-align: center; }
.th .cap-l { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-top: 6px; color: var(--ink2); }
.th.pinned .fimg, .fcell.pinned .fimg { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.th.pinned .cap-l, .fcell.pinned b { color: var(--red); }
.cap-l svg.i, .fcell b svg.i { width: 13px; height: 13px; }
.figgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; margin-bottom: 20px; }
.fcell { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fcell b { font-size: 13px; display: flex; gap: 4px; align-items: center; }
.fcell .ft-t { font-size: 12.5px; color: var(--ink2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ft-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); padding: 4px 0 16px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--blue); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-mini { padding: 18px 0 8px; color: var(--ink2); }
.empty-mini h3 { font-family: var(--font-display); font-size: 17px; color: var(--ink); margin: 0 0 6px; }
.empty-mini p { margin: 0 0 12px; max-width: 52ch; }

/* Tableaux de l'article */
.jt { border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: var(--card); }
.jt summary { padding: 10px 12px; cursor: pointer; font-size: 13.5px; line-height: 1.35; list-style: none; }
.jt summary::-webkit-details-marker { display: none; }
.jt[open] summary { border-bottom: 1px solid var(--line); }
.jt > p { margin: 8px 12px; font-size: 12.5px; color: var(--ink2); }
.jt .fimg { margin: 10px 12px; aspect-ratio: auto; }
.jtable { overflow-x: auto; padding: 4px 0; -webkit-user-select: text; user-select: text; }
.jtable table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; font-variant-numeric: tabular-nums; }
.jtable th, .jtable td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.jtable th { background: var(--sunk); font-weight: 600; }
.jfoot { font-size: 11.5px; color: var(--ink2); padding: 4px 12px 10px; }
.jfoot p { margin: 4px 0; }

/* Texte intégral */
.jump { margin-bottom: 8px; }
.ft .sec { border-bottom: 1px solid var(--line); }
.ft .sec summary { display: flex; align-items: center; gap: 8px; padding: 13px 2px; font-family: var(--font-display); font-size: 16px; font-weight: 600; cursor: pointer; list-style: none; }
.ft .sec summary::-webkit-details-marker { display: none; }
.ft .sec summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .2s; flex: none; }
.ft .sec[open] summary::after { transform: rotate(45deg); }
.sec-b { font-size: 15px; line-height: 1.62; padding-bottom: 16px; -webkit-user-select: text; user-select: text; }
.sec-b p { margin: 0 0 12px; }
.sec-b h4 { font-size: 14px; margin: 18px 0 6px; }
.sec-b ul, .sec-b ol { margin: 0 0 12px; padding-left: 22px; }
.sec-b blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--line2); color: var(--ink2); }
.sec-b .cite { font-size: .82em; color: var(--ink3); }
.xref { cursor: pointer; font-weight: 500; }
.figref { margin: -4px 0 12px; }
.figref a { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--blue-soft); }
.figref a:hover { text-decoration: none; }
.figref svg.i { width: 14px; height: 14px; }
.math { font-family: var(--mono); font-size: .86em; }
.src-note { margin-top: 14px; }

/* Fiche de lecture */
.take textarea { background: var(--sunk); border-color: transparent; font-size: 16px; font-weight: 500; line-height: 1.45; padding: 12px 14px; border-radius: 12px; }
.take textarea:focus { background: var(--card); }
textarea.grow { resize: none; overflow: hidden; min-height: 0; }
.impact { margin: -4px 0 20px; }
.impact .chip.on[data-imp="change"] { background: var(--green); border-color: var(--green); color: #fff; }
.impact .chip.on[data-imp="conforte"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.impact .chip.on[data-imp="staff"] { background: var(--violet); border-color: var(--violet); color: #fff; }
.fprog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.fprog span { flex: 1; height: 4px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.fprog span::before { content: ""; display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--green); border-radius: 4px; transition: width .3s; }
.fprog em { font-style: normal; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pico { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.frow label { font-size: 12px; font-weight: 600; color: var(--ink2); }
.frow .btn.plain { padding: 0 2px; font-size: 12px; }
.quotes { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.quote { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; padding: 8px 4px 8px 12px; border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 10px 10px 0; }
.quote q { quotes: none; font-size: 13.5px; line-height: 1.45; }
.quote span { grid-column: 1; font-size: 11.5px; color: var(--ink2); }
.quote .icon-btn { grid-row: 1 / span 2; grid-column: 2; width: 28px; height: 28px; }
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px 10px; margin-top: 6px; }
.cap { position: relative; margin: 0; min-width: 0; }
.capimg { display: block; width: 100%; padding: 0; border: 0; background: none; }
.capcap { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 12.5px; padding: 6px 2px; outline: none; color: var(--ink); }

const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const debounce = (fn, ms = 400) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/** Petite empreinte de chaîne (cyrb53), pour détecter un changement de termes. */
function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

async function gzip(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
  return new Response(stream).arrayBuffer();
}
async function gunzip(buf) {
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}

const ICONS = {

function toast(text, { action, error = false, timeout = 4500 } = {}) {
  const t = el(`<div class="toast ${error ? "error" : ""}"><span>${esc(text)}</span></div>`);

const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

function ago(ts) {
  if (!ts) return "jamais";
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  const d = Math.round(s / 86400);
  return d === 1 ? "hier" : `il y a ${d} j`;

/* =====================================================================
   2. Stockage local (IndexedDB) et données en mémoire
   Tout est chargé en mémoire au démarrage ; chaque modification est
   écrite dans IndexedDB et marque le document de synchro concerné.
   ===================================================================== */
const IDB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("veille-urcv", 2);
      req.onupgradeneeded = () => {
        const d = req.result, has = (n) => d.objectStoreNames.contains(n);
        if (!has("articles")) d.createObjectStore("articles", { keyPath: "pmid" });
        if (!has("docs")) d.createObjectStore("docs");
        if (!has("fulltext")) d.createObjectStore("fulltext", { keyPath: "pmid" });   // cache local, jamais synchronisé
        if (!has("blobs")) d.createObjectStore("blobs", { keyPath: "id" });           // captures d'écran des fiches
      };
      req.onblocked = () => reject(new Error("Ferme les autres onglets de l'application pour terminer la mise à jour."));
      req.onsuccess = () => { this.db = req.result; this.db.onversionchange = () => this.db.close(); resolve(); };
      req.onerror = () => reject(req.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => resolve(out && "result" in out ? out.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error("Écriture annulée (stockage plein ?)"));
    });
  },
  getAll(store) { return this.tx(store, "readonly", s => s.getAll()); },
  getDoc(key) { return this.tx("docs", "readonly", s => s.get(key)); },
  get(store, key) { return this.tx(store, "readonly", s => s.get(key)); },
  put(store, value) { return this.tx(store, "readwrite", s => { s.put(value); }); },
  putDoc(key, value) { return this.tx("docs", "readwrite", s => { s.put(value, key); }); },
  putArticles(list) { return this.tx("articles", "readwrite", s => { list.forEach(a => s.put(a)); }); },

/**
 * Un article déjà en bibliothèque correspond-il à ce thème ?
 * Vérification locale, sur le titre, l'abstract, les MeSH et les mots-clés.
 * Les termes en syntaxe PubMed brute ne sont pas évaluables ici : seul le scan les tranche.
 */
function matchesTheme(a, t) {
  const hay = `${a.title || ""} ${a.abstract || ""}`.toLowerCase();
  const mesh = (a.mesh || []).map(m => m.toLowerCase());
  const kw = (a.kw || []).map(m => m.toLowerCase());
  return (t.terms || []).some(term => {
    const q = (term.t || "").toLowerCase().replace(/"/g, "").trim();
    if (!q || term.f === "raw") return false;
    if (term.f === "mesh") return mesh.some(m => m === q || m.includes(q));
    return hay.includes(q) || mesh.some(m => m.includes(q)) || kw.some(k => k.includes(q));
  });
}

/** Étiquette les articles déjà présents qui correspondent au thème. */
async function labelExisting(themeId) {
  const t = getTheme(themeId);
  if (!t || !t.terms?.length) return 0;
  const touched = [];
  for (const a of DB.articles.values()) {
    if ((a.th || []).includes(t.id)) continue;
    if (!matchesTheme(a, t)) continue;
    a.th = [...(a.th || []), t.id];
    touched.push(a);
  }
  if (touched.length) { await saveArticles(touched); retrainSoon(); }
  return touched.length;
}

function descendants(ids) {
  const children = {};
  themesList().forEach(t => { if (t.parent) (children[t.parent] ||= []).push(t.id); });
  const out = new Set(ids), stack = [...ids];
  while (stack.length) (children[stack.pop()] || []).forEach(c => { if (!out.has(c)) { out.add(c); stack.push(c); } });
  return out;
}

const EVIDENCE_LEVEL = {
  "Meta-Analysis": 1.0, "Systematic Review": 0.95, "Practice Guideline": 0.95, "Guideline": 0.95,
  "Consensus Development Conference": 0.85, "Randomized Controlled Trial": 0.9, "Clinical Trial, Phase III": 0.85,
  "Equivalence Trial": 0.8, "Pragmatic Clinical Trial": 0.8, "Controlled Clinical Trial": 0.75,
  "Multicenter Study": 0.65, "Clinical Trial, Phase II": 0.65, "Clinical Trial": 0.6,
  "Observational Study": 0.55, "Comparative Study": 0.5, "Review": 0.5, "Journal Article": 0.4,
  "Preprint": 0.3, "Case Reports": 0.15, "Letter": 0.1, "Comment": 0.1, "Editorial": 0.12,
};
const EVIDENCE_GROUPS = {
  meta: ["Meta-Analysis", "Systematic Review"],
  guideline: ["Practice Guideline", "Guideline", "Consensus Development Conference"],
  rct: ["Randomized Controlled Trial", "Clinical Trial, Phase III", "Equivalence Trial", "Pragmatic Clinical Trial", "Controlled Clinical Trial"],
  trial: ["Clinical Trial", "Clinical Trial, Phase II", "Multicenter Study"],
  observational: ["Observational Study", "Comparative Study"],
  review: ["Review"],
  case: ["Case Reports"],
  opinion: ["Letter", "Comment", "Editorial"],
  preprint: ["Preprint"],
};
const EVIDENCE_LABEL = {
  meta: "Méta-analyse", guideline: "Recommandation", rct: "Essai randomisé", trial: "Essai clinique",
  observational: "Observationnelle", review: "Revue", case: "Cas clinique", opinion: "Opinion",
  preprint: "Preprint", other: "Article",
};

function ageDays(a) {
  const t = Date.parse(a.date || a.edat || "");
  return Number.isNaN(t) ? 365 : Math.max(0, (Date.now() - t) / 864e5);
}
const cites = (a) => Math.max(a.co || 0, a.ci || 0);
const velocity = (a) => cites(a) / Math.max(ageDays(a) / 30.44, 3);
const evidenceLevel = (types) => Math.max(0.35, ...(types || []).map(t => EVIDENCE_LEVEL[t] || 0));
function evidenceGroup(types) {
  const set = new Set(types || []);
  for (const [k, members] of Object.entries(EVIDENCE_GROUPS)) if (members.some(m => set.has(m))) return k;
  return "other";
}

function computeScore(a, st) {
  const s = DB.settings;
  const w = s.weights;
  const half = Math.max(7, +s.half_life_days || 180);
  const vel = velocity(a);
  const themeW = Math.max(0, ...liveThemeIds(a).map(id => DB.themes[id].weight || 3));
  const impact = DB.sources[a.src]?.impact || 0;
  const comps = {
    evidence: evidenceLevel(a.types),
    velocity: Math.min(1, Math.max(Math.log1p(vel) / Math.log1p(6), Math.log1p(a.rcr || 0) / Math.log1p(12))),
    freshness: Math.exp(-ageDays(a) * Math.LN2 / half),
    journal: Math.min(1, Math.log1p(impact) / Math.log1p(20)),
    theme: Math.min(1, themeW / 5),
  };
  let total = 0, sum = 0;
  for (const k of Object.keys(comps)) { const ww = Math.max(0, +w[k] || 0); total += ww; sum += comps[k] * ww; }
  let score = sum / (total || 1) * 100;
  if (a.ret) score *= 0.1;
  if (st.d) score *= 0.6;
  return { score: Math.round(score * 10) / 10, comps, vel, impact: impact || null };
}

function badgesOf(a) {
  const b = [];
  const types = new Set(a.types || []);
  const age = ageDays(a);
  if (a.ret) b.push("retracted");
  if (a.pre) b.push("preprint");
  if (velocity(a) >= 1.5 && age <= 730) b.push("hot");
  if ((a.cc || 0) > 0) b.push("clinical");
  if (a.oa || a.pmc) b.push("oa");
  if (age <= 14) b.push("new");
  if (EVIDENCE_GROUPS.rct.some(t => types.has(t))) b.push("rct");
  return b;
}

/** Vue calculée d'un article (score, badges, état) pour l'affichage. */
function viewOf(a) {
  const st = stateOf(a.pmid);
  const sc = computeScore(a, st);
  return { a, st, ...sc, map: mappingScore(a), cites: cites(a), ev: evidenceGroup(a.types),
    badges: badgesOf(a), themeIds: liveThemeIds(a) };
}

const haystacks = new WeakMap();
function haystack(a) {
  let h = haystacks.get(a);
  if (!h) {
    h = [a.title, a.abstract, (a.mesh || []).join(" "), a.journal, (a.authors || []).join(" "), a.pmid, a.doi].join(" ").toLowerCase();
    haystacks.set(a, h);
  }
  return h;
}

const SORTS = {
  map: v => v.map, score: v => v.score, date: v => v.a.date || "", citations: v => v.cites, velocity: v => v.vel,
  rcr: v => v.a.rcr || 0, journal: v => v.impact || 0, added: v => v.a.fs || 0, changed: v => v.st.t || 0,
};

/** Filtrage + tri en mémoire. */
function queryArticles(f = {}) {
  const statuses = f.status ? new Set(f.status) : null;
  const themeSet = f.themes?.length ? descendants(f.themes) : null;
  const words = (f.q || "").toLowerCase().split(/\s+/).filter(Boolean);
  const types = f.types?.length ? new Set(f.types) : null;
  const need = f.badges || [];
  const since = f.since ? new Date(Date.now() - f.since * 864e5).toISOString().slice(0, 10) : null;
  const out = [];
  for (const a of DB.articles.values()) {
    if (isOrphan(a)) continue;
    const st = stateOf(a.pmid);
    if (statuses && !statuses.has(st.s)) continue;
    if (f.fav && !st.f) continue;
    if (f.hide_retracted !== false && a.ret) continue;
    if (themeSet && !(a.th || []).some(id => themeSet.has(id))) continue;
    if (since && (a.date || "") < since) continue;
    if (f.year_min && (a.date || "") < `${f.year_min}-01-01`) continue;
    if (f.year_max && (a.date || "9999") > `${f.year_max}-12-31`) continue;
    if (f.min_cites && cites(a) < f.min_cites) continue;
    if (f.oa && !(a.oa || a.pmc)) continue;
    if (f.fiche && !hasFiche(a.pmid)) continue;
    if (words.length) { const h = haystack(a) + " " + noteText(a.pmid); if (!words.every(w => h.includes(w))) continue; }
    const v = viewOf(a);
    if (types && !types.has(v.ev)) continue;
    if (need.length && !need.every(b => v.badges.includes(b))) continue;
    out.push(v);
  }
  const key = SORTS[f.sort] || SORTS.score;
  const dir = f.order === "asc" ? 1 : -1;
  out.sort((x, y) => { const a = key(x), b = key(y); return a < b ? -dir : a > b ? dir : 0; });
  return out;
}

function computeStats() {
  const by = { inbox: 0, toread: 0, read: 0, club: 0, archive: 0, ignored: 0 };
  let favs = 0, total = 0;
  for (const a of DB.articles.values()) {
    if (isOrphan(a)) continue;
    const st = stateOf(a.pmid);
    by[st.s] = (by[st.s] || 0) + 1;
    if (st.f) favs++;
    total++;
  }
  const perDay = {};
  DB.events.forEach(e => { const k = dayKey(e.ts); perDay[k] = (perDay[k] || 0) + 1; });
  let streak = 0;
  const d = new Date();
  if (!perDay[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (perDay[dayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
  const lastScan = Math.max(0, ...Object.values(DB.scans).map(s => s.u || 0));
  return { by, favs, total, streak, today: perDay[todayISO()] || 0, perDay, lastScan };
}

function themeCounts() {
  const out = {};
  for (const a of DB.articles.values()) {
    const st = stateOf(a.pmid);
    for (const id of a.th || []) {
      const c = out[id] ||= { total: 0, inbox: 0, favs: 0 };
      c.total++;
      if (st.s === "inbox") c.inbox++;
      if (st.f) c.favs++;
    }
  }
  return out;
}


/* =====================================================================
   3 bis. Modèle d'affinité et carte des concepts
   Régression logistique entraînée dans le navigateur sur les swipes.
   La carte des thèmes appris n'est rien d'autre que l'affichage des
   traits de ce modèle : un point par concept, taille = nombre
   d'articles validés, couleur = poids appris.
   ===================================================================== */
const STOPWORDS = new Set(("the of and in for with a an to on by from as at is are was were be been that this these those it its" +
  " we our their effect effects study trial patients patient outcome outcomes results result after before during versus" +
  " between among associated association risk analysis review using use based data cohort retrospective prospective" +
  " single multicenter center centre case series report reports randomized randomised controlled clinical care unit new" +
  " impact role comparison evaluation assessment management therapy treatment").split(" "));
const FEATURE_KINDS = { mesh: "MeSH", kw: "Mot-clé", th: "Thème", type: "Type d'étude", jr: "Journal", ti: "Terme du titre" };
const MAP_KINDS = ["mesh", "kw", "th", "type", "jr", "ti"];
const MAP_KINDS_DEFAULT = ["mesh", "kw", "th"];

/**
 * Descripteurs de routine : présents sur presque tout PubMed, ils n'apprennent rien
 * et noieraient la carte (humans, female, retrospective studies…).
 * Masqués par défaut, réaffichables par le bouton « Génériques ».
 */
const GENERIC_CONCEPTS = new Set([
  "humans", "male", "female", "adult", "aged", "aged, 80 and over", "middle aged", "young adult",
  "child", "child, preschool", "infant", "infant, newborn", "adolescent", "animals", "mice", "rats",
  "retrospective studies", "prospective studies", "cohort studies", "case-control studies",
  "follow-up studies", "cross-sectional studies", "longitudinal studies", "feasibility studies",
  "time factors", "age factors", "sex factors", "comorbidity", "incidence", "prevalence",
  "risk factors", "risk assessment", "treatment outcome", "severity of illness index",
  "predictive value of tests", "reproducibility of results", "sensitivity and specificity",
  "survival rate", "survival analysis", "kaplan-meier estimate", "logistic models",
  "proportional hazards models", "multivariate analysis", "odds ratio", "chi-square distribution",
  "statistics, nonparametric", "databases, factual", "registries", "quality of life",
  "united states", "europe", "france", "germany", "japan", "china",
  "double-blind method", "single-blind method", "reference values", "hospital mortality",
  "length of stay", "intensive care units", "critical care", "hospitalization", "aftercare",
]);
const isGeneric = (c) => GENERIC_CONCEPTS.has(c.label.toLowerCase());
const POSITIVE_STATUS = new Set(["toread", "read", "club", "archive"]);
const CONCEPT_MIN_SUPPORT = 2;   // deux validations avant d'apparaître sur la carte

/** Traits binaires d'un article : concepts (MeSH, mots-clés, type, journal) et mots du titre. */
function featuresOf(a) {
  const out = new Set();
  (a.mesh || []).slice(0, 25).forEach(m => { const t = m.toLowerCase().trim(); if (t) out.add("mesh:" + t); });
  (a.kw || []).slice(0, 15).forEach(k => { const t = k.toLowerCase().trim(); if (t && t.length > 2) out.add("kw:" + t); });
  (a.types || []).forEach(t => { if (t !== "Journal Article" && t !== "English Abstract") out.add("type:" + t.toLowerCase()); });
  const jr = (a.ja || a.journal || "").toLowerCase().trim();
  if (jr) out.add("jr:" + jr);
  liveThemeIds(a).forEach(id => out.add("th:" + id));   // les thèmes de recherche sont aussi des traits
  (a.title || "").toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/)
    .filter(w => w.length > 3 && !STOPWORDS.has(w)).slice(0, 20).forEach(w => out.add("ti:" + w));
  return [...out];
}

/** Étiquette tirée du triage. Gardé = positif, ignoré = négatif faible, « moins de ça » = négatif fort. */
function labelOf(st, pmid) {
  if (pmid && hasFiche(pmid)) return { y: 1, w: 2 };   // fiche de lecture : le signal le plus fort
  if (!st || !st.t) return null;                       // jamais trié
  if (st.tr) return { y: 1, w: 1 };                    // « intéressant, mais pas à lire »
  if (st.f || POSITIVE_STATUS.has(st.s)) return { y: 1, w: st.f ? 1.6 : 1 };
  if (st.s === "ignored") return { y: 0, w: st.d ? 2.5 : 0.6 };
  return null;                                          // resté dans l'inbox
}

const MODEL = { ready: false, w: new Map(), b: 0, n: 0, pos: 0, neg: 0, dis: 0, acc: null,
  concepts: [], byKey: new Map(), edges: [], version: 0, trainedAt: 0, topWeights: 1 };
const affCache = new Map();

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

/** Probabilité que l'article soit gardé, ou null tant que le modèle n'est pas prêt. */
function affinity(a) {
  if (!MODEL.ready) return null;
  let v = affCache.get(a.pmid);
  if (v === undefined) {
    let z = MODEL.b;
    for (const f of featuresOf(a)) z += MODEL.w.get(f) || 0;
    v = sigmoid(z);
    affCache.set(a.pmid, v);
  }
  return v;
}

/** Descente de gradient sur les traits présents, avec rééquilibrage des deux classes. */
function fitLogistic(data) {
  const w = new Map();
  let b = 0;
  const nPos = data.reduce((n, e) => n + (e.y === 1 ? 1 : 0), 0);
  const cw = { 1: data.length / (2 * Math.max(1, nPos)), 0: data.length / (2 * Math.max(1, data.length - nPos)) };
  const lr = 0.2, l2 = 0.004, epochs = 90;
  for (let ep = 0; ep < epochs; ep++) {
    for (const e of data) {
      let z = b;
      for (const f of e.fi) z += w.get(f) || 0;
      const g = (e.y - sigmoid(z)) * e.sw * cw[e.y] * lr;
      b += g;
      for (const f of e.fi) w.set(f, (w.get(f) || 0) * (1 - lr * l2) + g);
    }
  }
  return { w, b };
}

function trainModel() {
  const ex = [];
  for (const a of DB.articles.values()) {
    const st = DB.states[a.pmid];
    const lab = labelOf(st, a.pmid);
    if (!lab) continue;
    ex.push({ pmid: a.pmid, t: st?.t || DB.notes[a.pmid]?.u || 0, f: featuresOf(a), y: lab.y, sw: lab.w });
  }
  // Les 3000 décisions les plus récentes suffisent, et l'ordre est fixe :
  // deux appareils avec les mêmes swipes obtiennent exactement le même modèle.
  ex.sort((x, y) => y.t - x.t);
  ex.length = Math.min(ex.length, 3000);
  ex.sort((x, y) => (x.pmid < y.pmid ? -1 : 1));

  MODEL.n = ex.length;
  MODEL.pos = ex.filter(e => e.y === 1).length;
  MODEL.neg = ex.length - MODEL.pos;
  MODEL.dis = ex.filter(e => e.y === 0 && e.sw >= 2).length;
  MODEL.trainedAt = Date.now();
  MODEL.version++;
  affCache.clear();
  mapCache.clear();
  buildConcepts(ex);

  const min = Math.max(20, +DB.settings.model_min_labels || 60);
  MODEL.ready = ex.length >= min && MODEL.pos >= 10 && MODEL.neg >= 10;
  if (!MODEL.ready) { MODEL.w = new Map(); MODEL.b = 0; MODEL.acc = null; attachWeights(); return; }

  // Vocabulaire : traits vus au moins deux fois, pour ne pas apprendre par cœur
  const df = new Map();
  ex.forEach(e => e.f.forEach(f => df.set(f, (df.get(f) || 0) + 1)));
  const vocab = new Set([...df].filter(([, c]) => c >= 2).map(([f]) => f));
  ex.forEach(e => e.fi = e.f.filter(f => vocab.has(f)));

  // Découpage entraînement / test déterministe, pour mesurer la justesse
  const isTest = (e) => parseInt(e.pmid.slice(-2), 10) % 5 === 0;
  const train = ex.filter(e => !isTest(e)), test = ex.filter(isTest);
  MODEL.acc = null;
  if (train.length >= 30 && test.length >= 10 && test.some(e => e.y === 1) && test.some(e => e.y === 0)) {
    const probe = fitLogistic(train);
    let ok = 0;
    for (const e of test) {
      let z = probe.b;
      for (const f of e.fi) z += probe.w.get(f) || 0;
      if ((z >= 0 ? 1 : 0) === e.y) ok++;
    }
    MODEL.acc = ok / test.length;
  }
  const full = fitLogistic(ex);
  MODEL.w = full.w; MODEL.b = full.b;
  MODEL.version++;
  affCache.clear();
  attachWeights();
}

/** Un concept naît d'un article validé ; un article ignoré ne peut que faire maigrir un concept existant. */
function buildConcepts(ex) {
  const stat = new Map();
  for (const e of ex) {
    for (const f of e.f) {
      const i = f.indexOf(":");
      const kind = f.slice(0, i);
      if (!MAP_KINDS.includes(kind)) continue;
      let c = stat.get(f);
      if (!c) {
        if (e.y !== 1) continue;                       // pas de création par un swipe « ignoré »
        const raw = f.slice(i + 1);
        const label = kind === "th" ? (getTheme(raw)?.name || null) : raw;
        if (!label) continue;                          // thème supprimé depuis
        stat.set(f, c = { key: f, kind, label, pos: 0, neg: 0, dis: 0, w: 0, pmids: [] });
      }
      if (e.y === 1) { c.pos++; if (c.pmids.length < 60) c.pmids.push(e.pmid); }
      else { c.neg++; if (e.sw >= 2) c.dis++; }
    }
  }
  MODEL.concepts = [...stat.values()].filter(c => c.pos >= CONCEPT_MIN_SUPPORT)
    .sort((a, b) => b.pos - a.pos || a.label.localeCompare(b.label));
  MODEL.byKey = new Map(MODEL.concepts.map(c => [c.key, c]));
  buildEdges(ex);
}

/** Arêtes : deux concepts reliés quand ils apparaissent ensemble dans des articles validés. */
function buildEdges(ex) {
  const keep = MODEL.byKey;
  const pairs = new Map();
  for (const e of ex) {
    if (e.y !== 1) continue;
    const fs = e.f.filter(f => keep.has(f)).sort();
    for (let i = 0; i < fs.length; i++)
      for (let j = i + 1; j < fs.length; j++) {
        const k = fs[i] + "|" + fs[j];
        pairs.set(k, (pairs.get(k) || 0) + 1);
      }
  }
  MODEL.edges = [...pairs].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 400)
    .map(([k, n]) => { const [a, b] = k.split("|"); return { a, b, n }; });
}

function attachWeights() {
  MODEL.concepts.forEach(c => c.w = MODEL.w.get(c.key) || 0);
  const tops = MODEL.concepts.filter(c => !isGeneric(c)).map(c => MODEL.ready ? Math.max(0, c.w) : Math.min(0.6, c.pos / 15))
    .sort((a, b) => b - a).slice(0, 5);
  MODEL.topWeights = tops.reduce((x, y) => x + y, 0) || 1;
  mapCache.clear();
}

/**
 * Mapping score : à quel point l'article ressemble à la carte d'intérêts.
 * Recouvrement pondéré des concepts, complété par la probabilité du modèle
 * une fois celui-ci entraîné. Zéro tant que la carte est vide.
 */
const mapCache = new Map();
function mappingScore(a) {
  let v = mapCache.get(a.pmid);
  if (v !== undefined) return v;
  let hit = 0;
  for (const f of featuresOf(a)) {
    const c = MODEL.byKey.get(f);
    if (!c || isGeneric(c)) continue;
    hit += MODEL.ready ? Math.max(0, c.w) : Math.min(0.6, c.pos / 15);
  }
  const overlap = Math.min(1, hit / (MODEL.topWeights || 1));
  const p = affinity(a);
  v = p == null ? overlap : 0.6 * p + 0.4 * overlap;
  const st = stateOf(a.pmid);
  if (a.ret) v *= 0.1;
  if (st.d) v *= 0.6;
  v = Math.round(v * 1000) / 10;
  mapCache.set(a.pmid, v);
  return v;
}

const retrainSoon = debounce(() => { trainModel(); if (state.view === "graph" && graph.mode === "interests") drawGraph(); }, 1500);

/** Concepts d'un article, tels qu'ils figurent sur la carte. */
function conceptsOf(a) { return featuresOf(a).map(f => MODEL.byKey.get(f)).filter(Boolean); }

/** Les concepts de la carte qui tirent le mapping score de cet article vers le haut. */
function topConceptsOf(a) {
  const list = conceptsOf(a).filter(c => !isGeneric(c) && (MODEL.ready ? c.w > 0.05 : c.pos >= 2))
    .sort((x, y) => (y.w - x.w) || (y.pos - x.pos)).slice(0, 4).map(c => c.label);
  return list.length ? ` (${list.map(esc).join(", ")})` : " (aucun concept commun pour l'instant)";
}

function modelStatus() {
  if (MODEL.ready) return `Affinité active${MODEL.acc != null ? `, ${Math.round(MODEL.acc * 100)} % de justesse` : ""}`;
  const min = Math.max(20, +DB.settings.model_min_labels || 60);
  return `Modèle : ${MODEL.n} / ${min} décisions`;
}

/* =====================================================================
   4. Requêtes PubMed
   ===================================================================== */
function termQuery(term, field) {
  term = (term || "").trim();
  if (!term) return "";
  if (field === "raw") return `(${term})`;
  const safe = term.replace(/"/g, "");
  if (field === "tiab") return `"${safe}"[tiab]`;
  if (field === "mesh") return `"${safe}"[mh]`;
  return safe.includes(" ") ? `"${safe}"` : safe;   // auto : mapping automatique PubMed
}
const orJoin = (parts) => { parts = parts.filter(Boolean); return !parts.length ? "" : parts.length === 1 ? parts[0] : `(${parts.join(" OR ")})`; };

function buildQuery(t) {
  const core = orJoin((t.terms || []).map(x => termQuery(x.t, x.f)));
  if (!core) return "";   // dossier
  let q = core;
  const s = DB.settings;
  if (s.context_enabled && t.ctx !== false && s.context_query) q = `${q} AND (${s.context_query})`;
  const excl = Object.values(DB.exclusions).filter(e => !e.del && e.enabled && (!e.theme || e.theme === t.id));
  const ex = orJoin(excl.map(e => termQuery(e.term, e.field)));
  if (ex) q = `(${q}) NOT ${ex}`;
  return q;
}
const termsHash = (t) => hashStr(JSON.stringify(t.terms || []) + "|" + (t.ctx !== false));

/* =====================================================================
   5. Réseau : limitation de débit, relais Worker si accès direct impossible
   ===================================================================== */
class Limiter {
  constructor(rps) { this.gap = 1000 / rps; this.last = 0; this.chain = Promise.resolve(); }
  setRate(rps) { this.gap = 1000 / rps; }
  wait() {
    this.chain = this.chain.then(async () => {
      const d = Date.now() - this.last;
      if (d < this.gap) await sleep(this.gap - d);
      this.last = Date.now();
    });
    return this.chain;
  }
}
const LIMIT = { ncbi: new Limiter(2.8), icite: new Limiter(3), openalex: new Limiter(8), epmc: new Limiter(5) };
const SERVICE_NAME = { ncbi: "PubMed", icite: "iCite", openalex: "OpenAlex", epmc: "Europe PMC" };
const viaProxy = {};

async function http(service, url, { method = "GET", params = {}, form = null, retries = 4, allow404 = false } = {}) {
  const u = new URL(url);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") u.searchParams.set(k, v); });
  const body = form ? new URLSearchParams(form) : undefined;
  let lastErr;
  for (let i = 0; i < retries; i++) {
    await LIMIT[service].wait();
    const sec = secrets();
    const proxied = viaProxy[service];
    let r;
    try {
      if (proxied) {
        r = await fetch(`${sec.worker_url.replace(/\/+$/, "")}/v1/proxy?url=${encodeURIComponent(u)}`, {
          method, body, headers: { Authorization: `Bearer ${sec.sync_token}` },
        });
      } else {
        r = await fetch(u, { method, body });
      }
    } catch (e) {
      lastErr = e;
      if (!proxied && sec.worker_url && sec.sync_token) {
        viaProxy[service] = true;
        if (service !== "epmc") scanLog(`${SERVICE_NAME[service]} : accès direct bloqué, passage par le Worker`);
        i--; continue;
      }
      if (!proxied) throw new Error(`${SERVICE_NAME[service]} injoignable depuis ce navigateur. Configure le Worker dans Réglages pour passer par le relais.`);
      await sleep(1500 * 2 ** i);
      continue;
    }
    if (allow404 && r.status === 404) return null;
    if (r.status === 429 || r.status >= 500) { lastErr = new Error(`${SERVICE_NAME[service]} : erreur ${r.status}`); await sleep(1500 * 2 ** i); continue; }
    if (r.status === 401 && proxied) throw new Error("Le Worker refuse le jeton : vérifie-le dans Réglages.");
    if (!r.ok) throw new Error(`${SERVICE_NAME[service]} : erreur ${r.status}`);
    return r;
  }
  throw lastErr;
}

const EUTILS = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
function ncbiCommon() {

const ymd = (d) => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;

async function pubmedSearch(term, mindate, maxdate, retmax) {

async function* pubmedFetch(ids) {
  for (let i = 0; i < ids.length; i += 200) {
    const r = await http("ncbi", EUTILS + "efetch.fcgi", {
      method: "POST", form: { ...ncbiCommon(), db: "pubmed", id: ids.slice(i, i + 200).join(","), retmode: "xml" },
    });
    yield parsePubmed(await r.text());
  }

const kid = (e, n) => e ? [...e.children].find(c => c.tagName === n) || null : null;
const kids = (e, n) => e ? [...e.children].filter(c => c.tagName === n) : [];
const path = (e, ...ns) => ns.reduce((x, n) => kid(x, n), e);
const txt = (e) => e ? e.textContent.replace(/\s+/g, " ").trim() : "";
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function dateFrom(e) {
  if (!e) return null;
  let y = txt(kid(e, "Year"));
  let m, d;
  if (!y) {
    const md = txt(kid(e, "MedlineDate")).match(/(\d{4})(?:\s+([A-Za-z]{3}))?/);
    if (!md) return null;
    y = md[1]; m = MON[(md[2] || "jan").toLowerCase()] || 1; d = 1;
  } else {
    const mo = txt(kid(e, "Month")) || "1";
    m = /^\d+$/.test(mo) ? +mo : (MON[mo.slice(0, 3).toLowerCase()] || 1);
    d = +(txt(kid(e, "Day")) || 1);
  }
  const dt = new Date(Date.UTC(+y, m - 1, d));
  return Number.isNaN(dt.getTime()) ? `${y}-01-01` : dt.toISOString().slice(0, 10);
}

function parsePubmed(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("PubMed : réponse XML illisible");
  const out = [];
  for (const pa of doc.getElementsByTagName("PubmedArticle")) {
    const mc = kid(pa, "MedlineCitation");
    const art = kid(mc, "Article");
    if (!mc || !art) continue;
    const abstract = kids(kid(art, "Abstract"), "AbstractText").map(ab => {
      const label = ab.getAttribute("Label");
      const t = txt(ab);
      return label ? `${label.charAt(0) + label.slice(1).toLowerCase()} : ${t}` : t;
    }).filter(Boolean).join("\n");
    const authors = kids(kid(art, "AuthorList"), "Author").map(au => {
      const coll = txt(kid(au, "CollectiveName"));
      if (coll) return coll;
      const last = txt(kid(au, "LastName"));
      return last ? `${last} ${txt(kid(au, "Initials"))}`.trim() : "";
    }).filter(Boolean);
    const types = kids(kid(art, "PublicationTypeList"), "PublicationType").map(txt);
    let doi = null, pmc = null;
    for (const id of kids(path(pa, "PubmedData", "ArticleIdList"), "ArticleId")) {
      if (id.getAttribute("IdType") === "doi") doi = txt(id).toLowerCase();
      if (id.getAttribute("IdType") === "pmc") pmc = txt(id);
    }
    if (!doi) for (const e of kids(art, "ELocationID")) if (e.getAttribute("EIdType") === "doi") doi = txt(e).toLowerCase();
    let edat = null;
    for (const d of kids(path(pa, "PubmedData", "History"), "PubMedPubDate")) {
      if (["entrez", "pubmed"].includes(d.getAttribute("PubStatus"))) { edat = dateFrom(d); break; }
    }
    const dates = [dateFrom(kid(art, "ArticleDate")), dateFrom(path(art, "Journal", "JournalIssue", "PubDate"))].filter(Boolean).sort();
    const retracted = types.includes("Retracted Publication") ||
      kids(kid(mc, "CommentsCorrectionsList"), "CommentsCorrections").some(c => c.getAttribute("RefType") === "RetractionIn");
    out.push({
      pmid: txt(kid(mc, "PMID")),
      doi, pmc,
      title: txt(kid(art, "ArticleTitle")),
      abstract,
      journal: txt(path(art, "Journal", "Title")),
      ja: txt(path(art, "Journal", "ISOAbbreviation")),
      date: dates[0] || edat,
      edat,
      authors, types,
      mesh: kids(kid(mc, "MeshHeadingList"), "MeshHeading").map(m => txt(kid(m, "DescriptorName"))),
      kw: kids(kid(mc, "KeywordList"), "Keyword").map(txt),
      lang: txt(kid(art, "Language")),
      pre: types.includes("Preprint") ? 1 : 0,
      ret: retracted ? 1 : 0,
    });
  }
  return out;
}

async function meshSuggest(term) {

const OA_FIELDS = "id,doi,cited_by_count,counts_by_year,open_access,primary_location,is_retracted,fwci";
const normDoi = (d) => (d || "").toLowerCase().trim().replace(/^(https?:\/\/(dx\.)?doi\.org\/|doi:)/, "");
function oaParams(extra) {

function oaExtract(w) {

async function openalexByDoi(dois) {

      { params: oaParams({ select: OA_FIELDS }), retries: 2, allow404: true });

}
