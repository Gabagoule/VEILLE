/* =====================================================================
   6. Scanner : un thème après l'autre, incrémental
   ===================================================================== */
const SCAN = { running: false, phase: "idle", queue: [], done: [], current: null, progress: 0, newTotal: 0, log: [], errors: [], cancel: false };
let wakeLock = null;

function scanLog(msg) {
  const stamp = new Date().toLocaleTimeString("fr-FR");
  SCAN.log = [...SCAN.log, `${stamp}  ${msg}`].slice(-80);
  renderScanUI();
}

function startScan(themeIds) {
  if (SCAN.running) return toast("Un scan est déjà en cours.");
  let list = themesList().filter(t => themeIds ? themeIds.includes(t.id) : t.enabled);
  list.sort((a, b) => (b.weight - a.weight) || a.name.localeCompare(b.name));
  Object.assign(SCAN, { running: true, phase: "scan", queue: list.map(t => ({ id: t.id, name: t.name })), done: [], current: null,
    progress: 0, newTotal: 0, log: [], errors: [], cancel: false });
  renderScanUI();
  runScan();
}

async function runScan() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { /* non disponible */ }
  const total = Math.max(1, SCAN.queue.length);
  try {
    const queue = [...SCAN.queue];
    for (let i = 0; i < queue.length; i++) {
      if (SCAN.cancel) { scanLog("Scan interrompu."); break; }
      SCAN.current = queue[i];
      SCAN.queue = queue.slice(i + 1);
      renderScanUI();
      try {
        const n = await scanTheme(queue[i].id);
        SCAN.done.push({ ...queue[i], n });
      } catch (e) {
        console.error(e);
        SCAN.errors.push(`${queue[i].name} : ${e.message}`);
        scanLog(`⚠ ${queue[i].name} : ${e.message}`);
        SCAN.done.push({ ...queue[i], n: 0, error: true });
      }
      SCAN.progress = (i + 1) / total;
    }
    SCAN.current = null;
    if (!SCAN.cancel) { SCAN.phase = "metrics"; renderScanUI(); await refreshMetrics(); }
  } catch (e) {
    SCAN.errors.push(e.message);
    scanLog(`⚠ ${e.message}`);
  } finally {
    SCAN.running = false; SCAN.phase = "idle"; SCAN.current = null;
    try { await wakeLock?.release(); } catch { /* déjà relâché */ }
    scanLog(`Terminé : ${plural(SCAN.newTotal, "nouvel article", "nouveaux articles")}.`);
    onScanFinished();
  }
}

async function scanTheme(themeId) {
  const t = getTheme(themeId);
  if (!t) return 0;
  const q = buildQuery(t);
  if (!q) { scanLog(`${t.name} : dossier sans terme, ignoré`); return 0; }
  const h = termsHash(t);
  const prev = DB.scans[t.id];
  const today = new Date();
  const deep = !prev || prev.hash !== h;
  const mindate = deep
    ? new Date(Date.now() - (+DB.settings.lookback_days || 365) * 864e5)
    : new Date(Date.parse(prev.last) - 3 * 864e5);
  scanLog(`${t.name} : recherche depuis le ${mindate.toLocaleDateString("fr-FR")}${deep ? " (scan profond)" : ""}`);

  const { count, ids } = await pubmedSearch(q, mindate, new Date(Date.now() + 864e5), +DB.settings.max_per_theme || 1000);
  if (count > ids.length) scanLog(`${t.name} : ${nf(count)} résultats, plafonnés à ${nf(ids.length)} (réglable)`);

  // Articles déjà connus : simple rattachement au thème
  const linked = [];
  const fresh = [];
  for (const pmid of ids) {
    const a = DB.articles.get(pmid);
    if (!a) { fresh.push(pmid); continue; }
    if (!(a.th || []).includes(t.id)) { a.th = [...(a.th || []), t.id]; linked.push(a); }
  }
  await saveArticles(linked);

  const inserted = [];
  let fetched = 0;
  for await (const batch of pubmedFetch(fresh)) {
    const now = Date.now();
    const toSave = [];
    for (const a of batch) {
      if (!a.pmid) continue;
      const existing = DB.articles.get(a.pmid);
      if (existing) { existing.th ||= []; if (!existing.th.includes(t.id)) { existing.th.push(t.id); toSave.push(existing); } continue; }
      const rec = { ...a, th: [t.id], fs: now, mu: 0 };
      DB.articles.set(a.pmid, rec);
      toSave.push(rec);
      inserted.push(rec);
    }
    await saveArticles(toSave);
    fetched += batch.length;
    scanLog(`${t.name} : ${nf(fetched)} sur ${nf(fresh.length)} téléchargés`);
    if (SCAN.cancel) break;
  }
  if (inserted.length) await enrich(inserted);

  DB.scans[t.id] = { last: today.toISOString().slice(0, 10), hash: h, n: inserted.length, u: Date.now() };
  touch("scans");
  // Un article déjà trié sur un autre appareil ne compte pas comme nouveau
  const newCount = inserted.filter(a => stateOf(a.pmid).s === "inbox").length;
  SCAN.newTotal += newCount;
  scanLog(`${t.name} : ${plural(newCount, "nouveau", "nouveaux")}, ${plural(ids.length - fresh.length, "déjà connu", "déjà connus")}`);
  return newCount;
}

async function enrich(articles) {
  const pmids = articles.map(a => a.pmid);
  let ic = {}, ox = {};
  try { ic = await iciteMetrics(pmids); } catch (e) { scanLog(`iCite indisponible : ${e.message}`); }
  try { ox = await openalexByDoi(articles.filter(a => a.doi).map(a => a.doi)); } catch (e) { scanLog(`OpenAlex indisponible : ${e.message}`); }
  const now = Date.now();
  const srcNames = {};
  for (const a of articles) {
    const m = ic[a.pmid] || {};
    const o = a.doi ? ox[normDoi(a.doi)] || {} : {};
    for (const k of ["ci", "rcr", "apt", "cc"]) if (m[k] !== null && m[k] !== undefined) a[k] = m[k];
    for (const k of ["co", "fwci", "src", "oaUrl"]) if (o[k] !== null && o[k] !== undefined) a[k] = o[k];
    if (o.cby?.length) a.cby = o.cby;
    if (o.oa) a.oa = 1;
    if (o.ret) a.ret = 1;
    if (o.src) srcNames[o.src] = o.srcName;
    a.mu = now;
  }
  await saveArticles(articles);

  // Impact des journaux, gardé 90 jours
  let changed = false;
  for (const [id, name] of Object.entries(srcNames)) {
    const s = DB.sources[id];
    if (s && s.t > now - 90 * 864e5) continue;
    if (SCAN.cancel) break;
    try {
      const info = await openalexSource(id);
      if (info) { DB.sources[id] = { ...info, name: info.name || name, t: now }; changed = true; }
    } catch { /* on réessaiera au prochain scan */ }
  }
  if (changed) touch("sources");
}

async function refreshMetrics() {
  const stale = Date.now() - (+DB.settings.metrics_refresh_days || 7) * 864e5;
  const horizon = new Date(Date.now() - 730 * 864e5).toISOString().slice(0, 10);
  const list = [...DB.articles.values()]
    .filter(a => !isOrphan(a) && stateOf(a.pmid).s !== "ignored" && (a.date || "") >= horizon && (a.mu || 0) < stale)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 2000);
  if (!list.length) return;
  scanLog(`Mise à jour des citations de ${plural(list.length, "article récent", "articles récents")}…`);
  for (let i = 0; i < list.length; i += 200) {
    if (SCAN.cancel) return;
    await enrich(list.slice(i, i + 200));
    SCAN.progress = Math.min(1, (i + 200) / list.length);
    renderScanUI();
  }
}

/* =====================================================================
   7. Synchronisation (Cloudflare Worker + KV)
   Documents : core (tout sauf les articles) + a00..a31 (articles).
   Fusion : la version la plus récente de chaque élément l'emporte.
   ===================================================================== */
const SHARDS = Array.from({ length: 32 }, (_, i) => "a" + String(i).padStart(2, "0"));
const DOC_NAMES = ["core", ...SHARDS];
const shardOf = (pmid) => SHARDS[(parseInt(pmid, 10) || 0) % 32];
const SYNC = { busy: false, again: false, status: "off", error: "", last: +localStorage.getItem("veille.lastSync") || 0 };
const dirty = new Set(JSON.parse(localStorage.getItem("veille.dirty") || "[]"));
const dirtyGen = {};

function markDirty(name) {
  dirty.add(name);
  dirtyGen[name] = (dirtyGen[name] || 0) + 1;
  localStorage.setItem("veille.dirty", JSON.stringify([...dirty]));
  scheduleSync();
}
const syncConfigured = () => { const s = secrets(); return !!(s.worker_url && s.sync_token); };
const scheduleSync = debounce(() => { if (syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true }); }, 8000);

async function worker(pathname, init = {}) {
  const s = secrets();
  const r = await fetch(s.worker_url.replace(/\/+$/, "") + pathname, {
    ...init, headers: { Authorization: `Bearer ${s.sync_token}`, ...(init.headers || {}) },
  });
  if (r.status === 401) throw new Error("Jeton de synchronisation refusé par le Worker.");
  return r;
}

function mergeMap(local, remote, key) {
  const out = { ...local };
  let changed = false, ahead = false;
  for (const [k, r] of Object.entries(remote || {})) {
    const l = out[k];
    if (!l || (r[key] || 0) > (l[key] || 0)) { out[k] = r; changed = true; }
    else if ((l[key] || 0) > (r[key] || 0)) ahead = true;
  }
  if (Object.keys(out).some(k => !(k in (remote || {})))) ahead = true;
  return { out, changed, ahead };
}

function exportCore() {
  const o = {};
  CORE_KEYS.forEach(k => o[k] = DB[k]);
  return o;
}
function exportShard(name) {
  return [...DB.articles.values()].filter(a => shardOf(a.pmid) === name);
}

async function applyCore(remote) {
  let changed = false, ahead = false;
  for (const [k, key] of [["themes", "u"], ["exclusions", "u"], ["states", "t"], ["scans", "u"], ["sources", "t"], ["notes", "u"]]) {
    const m = mergeMap(DB[k], remote[k], key);
    if (m.changed) { DB[k] = m.out; changed = true; pendingDocs.add(k); }
    if (m.ahead) ahead = true;
  }
  const rs = remote.settings || {};
  if ((rs.u || 0) > (DB.settings.u || 0)) {
    DB.settings = { ...DEFAULT_SETTINGS, ...rs, weights: { ...DEFAULT_SETTINGS.weights, ...(rs.weights || {}) } };
    changed = true; pendingDocs.add("settings");
  } else if ((DB.settings.u || 0) > (rs.u || 0)) ahead = true;
  const rsess = remote.session;
  if (rsess && (rsess.u || 0) > (DB.session.u || 0)) { DB.session = rsess; changed = true; pendingDocs.add("session"); }
  else if ((DB.session.u || 0) > (rsess?.u || 0)) ahead = true;
  const ids = new Set(DB.events.map(e => e.id));
  const incoming = (remote.events || []).filter(e => !ids.has(e.id));
  if (incoming.length) { DB.events = [...DB.events, ...incoming].sort((a, b) => a.ts - b.ts); changed = true; pendingDocs.add("events"); }
  const rids = new Set((remote.events || []).map(e => e.id));
  if (DB.events.some(e => !rids.has(e.id))) ahead = true;
  flushDocs();
  return { changed, ahead };
}

async function applyShard(name, remoteList) {
  const toSave = [];
  let ahead = false;
  const remoteIds = new Set();
  for (const r of remoteList) {
    remoteIds.add(r.pmid);
    const l = DB.articles.get(r.pmid);
    if (!l) { DB.articles.set(r.pmid, r); toSave.push(r); continue; }
    const th = [...new Set([...(l.th || []), ...(r.th || [])])];
    const newer = (r.mu || 0) > (l.mu || 0);
    if ((l.mu || 0) > (r.mu || 0) || th.length > (r.th || []).length) ahead = true;
    if (newer || th.length > (l.th || []).length) {
      const merged = newer ? { ...l, ...r } : { ...l };
      merged.th = th;
      merged.fs = Math.min(l.fs || Infinity, r.fs || Infinity);
      DB.articles.set(r.pmid, merged);
      toSave.push(merged);
    }
  }
  if (exportShard(name).some(a => !remoteIds.has(a.pmid))) ahead = true;
  if (toSave.length) await IDB.putArticles(toSave);
  return { changed: toSave.length > 0, ahead };
}

async function syncDoc(name, remoteRev, revs) {
  let rev = remoteRev;
  let pull = !!remoteRev && remoteRev !== revs[name];
  let push = dirty.has(name) || (!remoteRev && (name === "core" || exportShard(name).length > 0));
  let changed = false;
  for (let attempt = 0; attempt < 4; attempt++) {
    if (pull) {
      const r = await worker(`/v1/doc/${name}`);
      if (r.status === 404) rev = null;
      else {
        if (!r.ok) throw new Error(`Lecture de ${name} impossible (${r.status})`);
        rev = r.headers.get("X-Rev");
        const data = JSON.parse(await gunzip(await r.arrayBuffer()));
        const res = name === "core" ? await applyCore(data) : await applyShard(name, data);
        changed ||= res.changed;
        if (res.ahead) push = true;
      }
    }
    if (!push) { revs[name] = rev; return changed; }
    const gen = dirtyGen[name] || 0;
    const body = await gzip(JSON.stringify(name === "core" ? exportCore() : exportShard(name)));
    const r = await worker(`/v1/doc/${name}`, { method: "PUT", body, headers: rev ? { "If-Match": rev } : {} });
    if (r.status === 409) { pull = true; continue; }
    if (!r.ok) throw new Error(`Envoi de ${name} impossible (${r.status})`);
    revs[name] = (await r.json()).rev;
    if ((dirtyGen[name] || 0) === gen) dirty.delete(name);
    localStorage.setItem("veille.dirty", JSON.stringify([...dirty]));
    return changed;
  }
  throw new Error("Conflit de synchronisation répété, réessaie dans un instant.");
}

async function syncNow({ quiet = false } = {}) {
  if (!syncConfigured()) { if (!quiet) toast("Renseigne l'adresse du Worker et le jeton dans Réglages."); return false; }
  if (SYNC.busy) { SYNC.again = true; return false; }
  SYNC.busy = true; SYNC.status = "busy"; renderSync();
  let changed = false;
  try {
    const r = await worker("/v1/revs");
    if (!r.ok) throw new Error(`Worker : erreur ${r.status}`);
    const remote = (await r.json()).revs || {};
    const revs = JSON.parse(localStorage.getItem("veille.revs") || "{}");
    for (const name of DOC_NAMES) {
      changed = (await syncDoc(name, remote[name]?.rev || null, revs)) || changed;
      localStorage.setItem("veille.revs", JSON.stringify(revs));
    }
    await syncBlobs();
    SYNC.last = Date.now();
    localStorage.setItem("veille.lastSync", String(SYNC.last));
    SYNC.status = "ok"; SYNC.error = "";
    if (!quiet) toast(changed ? "Synchronisé, données mises à jour" : "Synchronisé");
  } catch (e) {
    SYNC.status = "error";
    SYNC.error = e instanceof TypeError ? "Worker injoignable (adresse, réseau ou CORS)." : e.message;
    if (!quiet) toast(SYNC.error, { error: true });
  } finally {
    SYNC.busy = false;
    renderSync();
    if (changed) refreshAfterSync();
    if (SYNC.again) { SYNC.again = false; setTimeout(() => syncNow({ quiet: true }), 500); }
  }
  return SYNC.status === "ok";
}

function refreshAfterSync() {
  trainModel();
  refreshStats();
  const typing = document.activeElement?.matches("input, textarea, select");
  if (state.view === "triage") reloadTriage({ keepTop: true });
  else if (!typing && !$("#drawerRoot").children.length) RENDER[state.view]();
}

      : `<div><b>${v.impact != null ? nf(v.impact, 1) : "–"}</b><span>impact journal</span></div>`}
  </div>`;
}
function themeOptions(selected, excludeId) {
  const byParent = {};
  themesList().forEach(t => (byParent[t.parent && getTheme(t.parent) ? t.parent : 0] ||= []).push(t));
  Object.values(byParent).forEach(l => l.sort((a, b) => a.name.localeCompare(b.name)));
  let out = "";
  const walk = (pid, depth) => (byParent[pid] || []).forEach(t => {
    if (t.id === excludeId) return;
    out += `<option value="${esc(t.id)}" ${selected === t.id ? "selected" : ""}>${"\u2003".repeat(depth)}${esc(t.name)}</option>`;
    walk(t.id, depth + 1);
  });
  walk(0, 0);
  return out;
}

/* =====================================================================
   9. Vue TRIAGE : paquet de cartes à glisser
   ===================================================================== */
const triage = { queue: [], picks: new Set(), undo: [], theme: "", sort: "map", session: [], baseline: new Set() };
let countdownTimer = null;

const sessionCfg = () => ({
  size: Math.max(5, +DB.settings.session_size || 20),
  cooldown: Math.max(0, +DB.settings.session_cooldown_h || 2) * 3600e3,
  picks: Math.max(0, +DB.settings.session_model_picks || 0),
});
const sessionDone = () => DB.session?.n || 0;
function sessionPhase() {
  const { size, cooldown } = sessionCfg();
  const s = DB.session || {};
  if (s.ended && Date.now() - s.ended < cooldown) return "pause";
  if (!s.ended && sessionDone() >= size) return "pause";
  return s.ended ? "ready" : "active";
}
function setSession(patch) { DB.session = { ...DB.session, ...patch, u: Date.now() }; touch("session"); }

/** Nouvelle session : remet le compteur à zéro et compose un nouveau paquet. */
function startSession() {
  setSession({ n: 0, started: Date.now(), ended: 0 });
  triage.session = [];
  triage.baseline = new Set(MODEL.concepts.map(c => c.key));
  buildQueue();
  renderDeck();
}

/**
 * Compose le paquet de la session : quelques cartes choisies par le modèle,
 * le reste selon le tri courant, les deux entremêlés.
 */
function buildQueue() {
  const { size, picks } = sessionCfg();
  const remaining = Math.max(0, size - sessionDone());
  const base = queryArticles({ status: ["inbox"], sort: triage.sort, themes: triage.theme ? [triage.theme] : [] });
  triage.picks = new Set();
  const chosen = [], seen = new Set();
  const wanted = Math.min(picks, Math.max(0, remaining - 1));
  if (MODEL.ready && wanted) {
    for (const v of base.slice().sort((x, y) => (affinity(y.a) || 0) - (affinity(x.a) || 0))) {
      if (triage.picks.size >= wanted) break;
      seen.add(v.a.pmid);
      triage.picks.add(v.a.pmid);
    }
  }
  for (const v of base) {
    if (chosen.length >= remaining - triage.picks.size) break;
    if (seen.has(v.a.pmid)) continue;
    chosen.push(v.a.pmid);
  }
  // Les cartes du modèle sont réparties dans le paquet plutôt que groupées en tête
  const modelPicks = [...triage.picks];
  const out = [];
  const step = modelPicks.length ? Math.max(2, Math.floor(remaining / (modelPicks.length + 1))) : 0;
  let mi = 0;
  chosen.forEach((pmid, i) => {
    out.push(pmid);
    if (mi < modelPicks.length && (i + 1) % step === 0) out.push(modelPicks[mi++]);
  });
  while (mi < modelPicks.length) out.push(modelPicks[mi++]);
  triage.queue = out.slice(0, remaining);
}

function fmtLeft(ms) {
  const m = Math.max(0, Math.ceil(ms / 60000));
  return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
}

}

/** Fin de session : bilan, concepts qui ont bougé, compte à rebours. */
function renderPause(deck) {
  const { cooldown } = sessionCfg();
  const s = DB.session || {};
  const wait = s.ended ? s.ended + cooldown - Date.now() : 0;
  const kept = triage.session.filter(p => { const st = stateOf(p); return st.f || POSITIVE_STATUS.has(st.s); }).length;

  // Concepts renforcés pendant la session, sinon les plus solides de la carte
  const grown = new Map();
  triage.session.forEach(pmid => {
    const a = DB.articles.get(pmid);
    if (a) conceptsOf(a).forEach(c => grown.set(c.key, (grown.get(c.key) || 0) + 1));
  });
  const top = grown.size
    ? [...grown].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => MODEL.byKey.get(k)).filter(Boolean)
    : MODEL.concepts.filter(c => c.w > 0).slice(0, 6);
  const chips = top.map(c => `<span class="chip">${triage.baseline.size && !triage.baseline.has(c.key) ? `<span class="pill new">nouveau</span>` : ""}${esc(c.label)}<span class="hint">${c.pos}</span></span>`);

  deck.innerHTML = `<div class="empty" style="height:100%"><div>
    <h3>${wait > 0 ? "Session terminée" : "Prêt pour une session"}</h3>
    <p>${triage.session.length
      ? `${plural(triage.session.length, "carte triée", "cartes triées")}, dont ${plural(kept, "gardée", "gardées")}.`
      : "Le triage se fait par sessions courtes : un paquet, une pause, puis un paquet affiné par le modèle."}
      ${wait > 0 ? `<br>Prochaine session dans <b id="cdown">${fmtLeft(wait)}</b>.` : ""}</p>
    ${chips.length ? `<div class="chips" style="justify-content:center;max-width:520px;margin:0 auto 16px">${chips.join("")}</div>` : ""}
    <button class="btn ghost" id="pauseMap">${icon("graph")}Voir la carte d'intérêts</button>
    <button class="btn ${wait > 0 ? "plain" : ""}" id="pauseNow">${wait > 0 ? "Reprendre maintenant" : "Lancer la session"}</button>
  </div></div>`;
  $("#pauseMap").onclick = () => { graph.mode = "interests"; go("graph"); };
  $("#pauseNow").onclick = () => startSession();
  if (wait > 0) countdownTimer = setInterval(() => {
    const box = $("#cdown");
    if (!box) return clearInterval(countdownTimer);
    const ms = s.ended + cooldown - Date.now();
    if (ms <= 0) { clearInterval(countdownTimer); renderDeck(); return; }
    box.textContent = fmtLeft(ms);
  }, 20000);
}

/* Glisser la carte. Sur l'abstract (zone qui défile) : glissement horizontal seulement. */
function attachSwipe(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, horizOnly = false;
  const TH = isMobile() ? 90 : 120;
  const stamps = Object.fromEntries(["right", "left", "up", "down"].map(k => [k, $(`.stamp.${k}`, card)]));
  const dirOf = () => (horizOnly || Math.abs(dx) > Math.abs(dy)) ? (dx > 0 ? "right" : "left") : (dy < 0 ? "up" : "down");
  const power = () => (horizOnly ? Math.abs(dx) : Math.max(Math.abs(dx), Math.abs(dy))) / TH;
  const reset = () => {
    card.classList.add("snap");
    card.style.transform = "";
    Object.values(stamps).forEach(s => s.style.opacity = 0);
  };

  card.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest("a, button")) return;
    const onAbstract = !!e.target.closest(".abstract");
    if (onAbstract && e.pointerType === "mouse") return;   // sélection de texte à la souris
    horizOnly = onAbstract;
    active = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    if (!horizOnly) card.setPointerCapture(e.pointerId);
    card.classList.add("dragging");
    card.classList.remove("snap");
  });
  card.addEventListener("pointermove", (e) => {
    if (!active) return;
    dx = e.clientX - sx; dy = horizOnly ? 0 : e.clientY - sy;
    if (horizOnly && Math.abs(dx) < 10) return;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
    const d = dirOf(), p = Math.min(1, power());
    for (const k in stamps) stamps[k].style.opacity = k === d ? p : 0;
  });
  const end = (e) => {
    if (!active) return;
    active = false;
    card.classList.remove("dragging");
    if (e.type !== "pointercancel" && power() >= 1) commitSwipe(dirOf(), { dx, dy });
    else reset();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("lostpointercapture", (e) => { if (active && !horizOnly) end(e); });
}

const SWIPE = {
  right: { patch: { s: "toread" }, event: "swipe_right", msg: "Ajouté à « À lire »" },
  train: { patch: { s: "ignored", tr: 1 }, event: "train", msg: "Pas à lire, mais retenu comme intéressant" },
  left: { patch: { s: "ignored" }, event: "swipe_left", msg: "Ignoré" },
  up: { patch: { s: "toread", f: 1 }, event: "swipe_up", msg: "Pépite ajoutée" },
  down: { patch: { s: "ignored", d: 1 }, event: "swipe_down", msg: "Noté : moins de ce genre" },
};

let swipeLock = false;
async function commitSwipe(dir, from) {
  if (swipeLock || !triage.queue.length) return;
  swipeLock = true;
  const pmid = triage.queue[0];
  const card = $("#deck .card.top");
  const cfg = SWIPE[dir];
  if (card && !reduceMotion && dir !== "train") {
    const W = window.innerWidth + 200, H = window.innerHeight + 200;
    const far = { right: [W, (from?.dy || 0) + 60], left: [-W, (from?.dy || 0) + 60], up: [from?.dx || 0, -H], down: [from?.dx || 0, H] }[dir];
    $$(".stamp", card).forEach(s => s.style.opacity = s.classList.contains(dir) ? 1 : 0);
    card.classList.add("leaving");
    card.style.transform = `translate(${far[0]}px, ${far[1]}px) rotate(${far[0] / 40}deg)`;
    card.style.opacity = "0";
    await sleep(260);
  }
  if (card && dir === "train" && !reduceMotion) {
    card.classList.add("leaving");
    card.style.transform = "scale(.86)";
    card.style.opacity = "0";
    await sleep(200);
  }
  if (navigator.vibrate && (dir === "up" || dir === "train")) navigator.vibrate(12);
  const prev = setState(pmid, cfg.patch, cfg.event);
  triage.undo.push({ pmid, prev });
  if (triage.undo.length > 30) triage.undo.shift();
  triage.session.push(pmid);
  triage.queue.shift();
  const { size } = sessionCfg();
  const n = sessionDone() + 1;
  const over = n >= size || !triage.queue.length;
  setSession(over ? { n, ended: Date.now() } : { n });
  if (over) trainModel();          // le bilan de session montre la carte à jour
  else retrainSoon();
  renderDeck();
  swipeLock = false;
  if (!over) toast(cfg.msg, { action: { label: "Annuler", fn: undoSwipe }, timeout: 2600 });
  refreshStatsSoon();
}

function undoSwipe() {
  const last = triage.undo.pop();
  if (!last) return toast("Rien à annuler.");
  DB.states[last.pmid] = { ...last.prev, t: Date.now() };
  touch("states");
  if (triage.session.at(-1) === last.pmid) triage.session.pop();
  setSession({ n: Math.max(0, sessionDone() - 1), ended: 0 });
  triage.queue.unshift(last.pmid);
  retrainSoon();
  renderDeck();
  refreshStatsSoon();
}

  if (map[e.key]) { e.preventDefault(); commitSwipe(map[e.key]); }

  else if (e.key.toLowerCase() === "o" && top) window.open(`https://pubmed.ncbi.nlm.nih.gov/${top}/`, "_blank");

});

function nodeRadius(t) {

function setupGraphInteractions() {
  const svg = $("#graph");
  const pointers = new Map();
  let mode = null, start = null, node = null, moved = 0, target = null, pinch = null, lastTap = 0;

  const zoomAt = (cx, cy, k2) => {
    k2 = Math.min(2.5, Math.max(0.3, k2));
    const r = svg.getBoundingClientRect();
    const mx = cx - r.left, my = cy - r.top;
    graph.tx = mx - (mx - graph.tx) * (k2 / graph.k);
    graph.ty = my - (my - graph.ty) * (k2 / graph.k);
    graph.k = k2;
    applyView();
  };

  svg.addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svg.setPointerCapture(e.pointerId);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: graph.k };
      mode = "pinch";
      return;
    }
    start = { x: e.clientX, y: e.clientY, tx: graph.tx, ty: graph.ty };
    moved = 0;
    const g = e.target.closest(".node");
    if (g && graph.mode === "interests") {
      mode = "pan";
      start.tap = g.dataset.key;
      svg.classList.add("panning");
    } else if (g) {
      mode = "node";
      node = getTheme(g.dataset.id);
      const p = toGraph(e.clientX, e.clientY);
      start.ox = p.x - node.x; start.oy = p.y - node.y;
    } else {
      mode = "pan";
      svg.classList.add("panning");
    }
  });

  svg.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === "pinch" && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
      return;
    }
    if (!mode || mode === "pinch") return;
    moved = Math.max(moved, Math.hypot(e.clientX - start.x, e.clientY - start.y));
    if (mode === "pan") {
      graph.tx = start.tx + e.clientX - start.x;
      graph.ty = start.ty + e.clientY - start.y;
      applyView();
    } else if (moved > 4) {
      const p = toGraph(e.clientX, e.clientY);
      node.x = p.x - start.ox; node.y = p.y - start.oy;
      target = themesList().find(t => t.id !== node.id && Math.hypot(t.x - node.x, t.y - node.y) < nodeRadius(t) + 8) || null;
      const gEl = $(`#gNodes .node[data-id="${CSS.escape(node.id)}"]`);
      gEl.setAttribute("transform", `translate(${node.x},${node.y})`);
      $("#gNodes").append(gEl);
      $$("#gNodes .node").forEach(n => n.classList.toggle("target", !!target && n.dataset.id === target.id));
      $("#gEdges").innerHTML = edgesHtml();
    }
  });

  const end = (e) => {
    pointers.delete(e.pointerId);
    if (mode === "pinch") { if (pointers.size === 0) mode = null; return; }
    if (!mode) return;
    svg.classList.remove("panning");
    const m = mode; mode = null;
    if (m === "pan") {
      if (moved < 6 && start.tap) { openConcept(start.tap); return; }
      if (graph.mode === "interests") return;
      // double tap tactile dans le vide = nouveau thème
      if (moved < 6 && e.pointerType !== "mouse") {
        const now = Date.now();
        if (now - lastTap < 350) newThemeModal(toGraph(e.clientX, e.clientY));
        lastTap = now;
      }
      return;
    }
    if (moved <= 4) { openInspector(node.id); return; }
    if (target) {
      const child = node, parent = target;
      target = null;
      if (descendants([child.id]).has(parent.id)) toast("Ce rattachement créerait une boucle.", { error: true });
      else {
        child.parent = parent.id;
        child.x = parent.x + 90; child.y = parent.y + 70;
        toast(`« ${child.name} » rattaché à « ${parent.name} »`);
      }
    }
    saveTheme(node);
    drawGraph();
    if (graph.selected === node.id) openInspector(node.id);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, graph.k * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  svg.addEventListener("dblclick", (e) => {
    if (e.target.closest(".node") || graph.mode === "interests") return;
    newThemeModal(toGraph(e.clientX, e.clientY));
  });
}

/* Disposition par forces : répulsion, ressort parent-enfant, gravité centrale */
function autoLayout(iterations = 220) {
  const ts = themesList();
  if (!ts.length) return;
  const sim = ts.map(t => ({ t, vx: 0, vy: 0 }));
  const byId = Object.fromEntries(sim.map(s => [s.t.id, s]));
  let it = 0;
  const step = () => {
    for (let i = 0; i < sim.length; i++) {
      for (let j = i + 1; j < sim.length; j++) {
        const a = sim[i], b = sim[j];
        let dx = a.t.x - b.t.x, dy = a.t.y - b.t.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        const d = Math.sqrt(d2), f = 26000 / d2;
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
    }
    sim.forEach(s => {
      const p = byId[s.t.parent];
      if (p) {
        const dx = p.t.x - s.t.x, dy = p.t.y - s.t.y, d = Math.hypot(dx, dy) || 1;
        const f = (d - 150) * 0.05;
        s.vx += dx / d * f; s.vy += dy / d * f;
        p.vx -= dx / d * f; p.vy -= dy / d * f;
      }
      s.vx -= s.t.x * 0.012; s.vy -= s.t.y * 0.012;
    });
    const cool = 1 - it / iterations;
    sim.forEach(s => {
      s.vx *= 0.6; s.vy *= 0.6;
      s.t.x += Math.max(-30, Math.min(30, s.vx)) * cool;
      s.t.y += Math.max(-30, Math.min(30, s.vy)) * cool;
    });
    it++;
    if (it % 2 === 0 || it >= iterations) drawGraph();
    if (it < iterations) { if (reduceMotion) step(); else requestAnimationFrame(step); }
    else { ts.forEach(t => { t.x = Math.round(t.x); t.y = Math.round(t.y); t.u = Date.now(); }); touch("themes"); }
  };
  step();
}

  $$("#iColor button").forEach(b => b.onclick = () => { update({ color: b.dataset.c }); refresh(); });
  $("#iParent").onchange = (e) => {
    const p = e.target.value || null;
    if (p && descendants([id]).has(p)) { toast("Ce rattachement créerait une boucle.", { error: true }); return refresh(); }
    update({ parent: p }); refresh();
  };

  const termsBox = $("#iTerms");
  t.terms.forEach((term, i) => {
    const row = el(`<div class="term"><span title="${esc(term.t)}">${esc(term.t)}</span>

  });
  const addTerm = (text, field) => {
    text = text.trim();
    if (!text) return;
    if (t.terms.some(x => x.t.toLowerCase() === text.toLowerCase())) return toast("Ce terme est déjà présent.");
    update({ terms: [...t.terms, { t: text, f: field }] });
    refresh();
  };
  $("#iTermNew").onkeydown = (e) => { if (e.key === "Enter") addTerm(e.target.value, $("#iTermField").value); };
  $("#iTermAdd").onclick = () => addTerm($("#iTermNew").value, $("#iTermField").value);

  $("#iMesh").onclick = async () => {
    const seed = t.terms[0]?.t || t.name;
    const mbox = $("#iMeshBox");
    mbox.innerHTML = `<p class="hint">Recherche MeSH pour « ${esc(seed)} »…</p>`;
    try {
      const res = await meshSuggest(seed);
      if (!res.length) { mbox.innerHTML = `<p class="hint">Aucun descripteur MeSH trouvé. Essaie un terme anglais plus général.</p>`; return; }
      mbox.innerHTML = "";
      res.forEach(m => {
        const item = el(`<div class="mesh-item"><div style="display:flex;align-items:center;gap:8px">
          <b style="flex:1">${esc(m.heading)}</b><button class="btn small">${icon("plus")}MeSH</button></div>
          ${m.scope ? `<div class="hint">${esc(m.scope)}</div>` : ""}
          <div class="chips">${m.entries.map(x => `<button class="chip" data-t="${esc(x)}">${icon("plus")}${esc(x)}</button>`).join("")}</div></div>`);
        $(".btn", item).onclick = () => addTerm(m.heading, "mesh");
        $$(".chip", item).forEach(ch => ch.onclick = () => addTerm(ch.dataset.t, "tiab"));
        mbox.append(item);

  $$("#iExcl .x").forEach(b => b.onclick = () => {
    const e = DB.exclusions[b.dataset.id];
    e.del = true; saveExclusion(e); refresh();
  });
  $("#iExclNew").onkeydown = (e) => {
    const term = e.target.value.trim();
    if (e.key !== "Enter" || !term) return;
    saveExclusion({ id: uid(), term, field: term.includes("[") ? "raw" : "tiab", theme: id, enabled: true, label: null, del: false });
    refresh();
  };

  $("#iRelink").onclick = async () => {
    const n = await labelExisting(id);
    refreshStats(); drawGraph(); refresh();
    toast(n ? `${plural(n, "article rattaché", "articles rattachés")} à « ${t.name} »` : "Aucun article déjà présent ne correspond.");
  };
  $("#iScan").onclick = () => startScan([id]);
  $("#iSee").onclick = () => { lib.f = { ...DEFAULT_FILTERS(), themes: [id] }; lib.limit = 50; go("library"); };
  $("#iDel").onclick = () => deleteThemeModal(t);
}

function newThemeModal(pos, preset) {
  const body = el(`<div>
    ${preset ? `<p class="hint" style="margin:0 0 14px">Créé depuis la carte d'intérêts : ce concept revient dans les articles que tu gardes, mais rien ne le cherche pour l'instant.</p>` : ""}
    <div class="field"><label for="ntName">Nom du thème</label><input class="input" id="ntName" placeholder="ex. Vasoplégie" value="${esc(preset?.name || "")}"></div>
    <div class="field"><label for="ntTerm">Terme de recherche en anglais</label><input class="input" id="ntTerm" placeholder="ex. vasoplegia (par défaut : le nom)" value="${esc(preset?.term || "")}">
      <span class="hint">Tu pourras ajouter des synonymes et des termes MeSH ensuite.</span></div>
    <div class="field"><label for="ntParent">Rattaché à</label><select class="input" id="ntParent"><option value="">Aucun (racine)</option>${themeOptions(graph.selected || "")}</select></div>
    <div class="toggle-row"><span>Dossier<br><span class="hint">Regroupe d'autres thèmes sans être scanné lui-même</span></span><label class="switch"><input type="checkbox" id="ntFolder"><span></span></label></div>
  </div>`);
  openModal({
    title: "Nouveau thème", body,
    actions: [{ label: "Annuler" }, {
      label: "Créer le thème", primary: true, fn: () => {
        const name = $("#ntName").value.trim();
        if (!name) { toast("Donne un nom au thème.", { error: true }); return false; }
        if (themesList().some(x => x.name.toLowerCase() === name.toLowerCase())) { toast(`Le thème « ${name} » existe déjà.`, { error: true }); return false; }
        const term = $("#ntTerm").value.trim() || name;
        const parent = $("#ntParent").value || null;
        const pt = getTheme(parent);
        const p = pos || (pt ? { x: pt.x + 110, y: pt.y + 80 } : { x: Math.random() * 60 - 30, y: Math.random() * 60 - 30 });
        const t = { id: uid(), name, terms: $("#ntFolder").checked ? [] : [{ t: term, f: preset?.field || "auto" }], parent, weight: 3,
          color: pt?.color || "#0A6CFF", x: Math.round(p.x), y: Math.round(p.y), enabled: true, ctx: true, del: false };
        saveTheme(t);
        graph.selected = t.id;
        if (state.view === "graph") { drawGraph(); if (!pos) autoLayout(80); openInspector(t.id); }
        // Les articles déjà en bibliothèque qui correspondent prennent l'étiquette tout de suite
        labelExisting(t.id).then(n => {
          refreshStats();
          if (state.view === "graph") drawGraph();
          if (state.view === "triage") reloadTriage({ keepTop: true });
          toast(n
            ? `Thème « ${name} » créé, ${plural(n, "article déjà en bibliothèque rattaché", "articles déjà en bibliothèque rattachés")}`
            : `Thème « ${name} » créé`,
            { action: { label: "Le scanner", fn: () => startScan([t.id]) } });
        });
      },
    }],
  });
  setTimeout(() => $("#ntName")?.focus(), 50);
}

function deleteThemeModal(t) {
  const body = el(`<p style="margin-top:0">Les articles déjà triés restent dans la bibliothèque s'ils appartiennent à d'autres thèmes. Les sous-thèmes remontent à la racine.</p>`);
  openModal({
    title: `Supprimer « ${t.name} » ?`, body,
    actions: [{ label: "Annuler" }, {
      label: "Supprimer", danger: true, fn: () => {
        themesList().filter(x => x.parent === t.id).forEach(x => { x.parent = null; saveTheme(x); });
        t.del = true; saveTheme(t);
        graph.selected = null;
        $("#inspector").hidden = true;
        drawGraph(); refreshStats();
        triage.queue = [];
        toast("Thème supprimé");
      },
    }],
  });
}


/* =====================================================================
   10 bis. Carte d'intérêts : les traits du modèle, en nœuds
   Un point par concept issu des articles gardés. Taille = nombre de
   validations, couleur = poids appris, liens = cooccurrences.
   ===================================================================== */
function renderInterestView() {
  const root = $("#view-graph");
  root.innerHTML = `
    <div class="graph-wrap">
      <div class="gtools">
        ${gModeHtml()}
        <div class="seg" id="gKinds">${MAP_KINDS.map(k => `<button data-k="${k}" class="${MAP.kinds.has(k) ? "on" : ""}">${FEATURE_KINDS[k]}</button>`).join("")}</div>
        <button class="chip ${MAP.generic ? "on" : ""}" id="gGeneric" title="Descripteurs de routine (humans, female, retrospective studies…)">Génériques</button>
        <button class="btn ghost" id="gRelayout" title="Réorganiser">${icon("spark")}<span class="lbl-desk">Réorganiser</span></button>
      </div>
      <svg id="graph"><g id="gView"><g id="gEdges"></g><g id="gNodes"></g></g></svg>
      <div class="ghelp">Taille : articles gardés portant ce concept. Rouge : signal fort pour le modèle. Gris pointillé : concept devenu négatif.</div>
      <div class="map-empty" id="mapEmpty" hidden></div>
      <aside class="inspector" id="inspector" hidden></aside>
    </div>`;
  bindGMode();
  $$("#gKinds button").forEach(b => b.onclick = () => {
    MAP.kinds.has(b.dataset.k) ? MAP.kinds.delete(b.dataset.k) : MAP.kinds.add(b.dataset.k);
    if (!MAP.kinds.size) MAP.kinds.add(b.dataset.k);
    MAP.version = -1;
    RENDER.graph();
  });
  $("#gGeneric").onclick = () => { MAP.generic = !MAP.generic; MAP.version = -1; RENDER.graph(); };
  $("#gRelayout").onclick = () => { MAP.version = -1; drawInterestMap(); };
  setupGraphInteractions();
  centerGraphOnce();
  drawInterestMap();
  if (MAP.selected && MODEL.byKey.has(MAP.selected)) openConcept(MAP.selected);
}

let mapMaxPos = 1;
const conceptRadius = (c) => 11 + 37 * Math.pow(Math.min(1, c.pos / Math.max(2, mapMaxPos)), 0.85);
function conceptColor(c) {
  if (c.w >= 0.45) return "var(--red)";
  if (c.w >= 0.12) return "var(--violet)";
  if (c.w > -0.12) return "var(--blue)";
  return "var(--ink3)";
}

function visibleConcepts() {
  return MODEL.concepts.filter(c => MAP.kinds.has(c.kind) && (MAP.generic || !isGeneric(c))).slice(0, 60);
}

/** Disposition par forces, amorcée par une empreinte du concept : stable d'un affichage à l'autre. */
function layoutMap(nodes) {
  if (MAP.version === MODEL.version && nodes.every(n => MAP.pos.has(n.key))) return;
  const P = new Map();
  nodes.forEach((n, i) => {
    const h = parseInt(hashStr(n.key).slice(0, 5), 36) || i * 97;
    const ang = (h % 628) / 100, rad = 110 + (h % 240);
    P.set(n.key, { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, vx: 0, vy: 0, r: conceptRadius(n) });
  });
  const edges = MODEL.edges.filter(e => P.has(e.a) && P.has(e.b));
  const arr = [...P.values()];
  for (let it = 0; it < 140; it++) {
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (i - j) * 0.7; dy = 0.9; d2 = 1; }
        const d = Math.sqrt(d2);
        const f = (16000 + (a.r + b.r) * 340) / d2;
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
    }
    for (const e of edges) {
      const a = P.get(e.a), b = P.get(e.b);
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const target = a.r + b.r + 120;
      const f = (d - target) * 0.016 * Math.min(3, e.n);
      a.vx += dx / d * f; a.vy += dy / d * f;
      b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
    const cool = 1 - it / 140;
    for (const pt of arr) {
      pt.vx -= pt.x * 0.009; pt.vy -= pt.y * 0.009;
      pt.vx *= 0.58; pt.vy *= 0.58;
      pt.x += Math.max(-26, Math.min(26, pt.vx)) * cool;
      pt.y += Math.max(-26, Math.min(26, pt.vy)) * cool;
    }
  }
  // Dernière passe : on écarte les paires qui se touchent encore, étiquette comprise
  for (let pass = 0; pass < 80; pass++) {
    let moved = false;
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], c = arr[j];
        const need = a.r + c.r + 78;
        let dx = c.x - a.x, dy = (c.y - a.y) * 0.8;      // l'étiquette occupe le dessous du nœud
        const d = Math.hypot(dx, dy) || 1;
        if (d >= need) continue;
        const push = (need - d) / 2;
        a.x -= dx / d * push; a.y -= dy / d * push;
        c.x += dx / d * push; c.y += dy / d * push;
        moved = true;
      }
    }
    if (!moved) break;
  }
  MAP.pos = new Map([...P].map(([k, v]) => [k, { x: Math.round(v.x), y: Math.round(v.y) }]));
  MAP.version = MODEL.version;
}

/** Met en avant le concept choisi, ses voisins directs et les liens qui les relient. */
function applyHighlight() {
  const on = !!MAP.selected;
  const wrap = $(".graph-wrap");
  if (wrap) wrap.classList.toggle("focused", on);
  $$("#gNodes .node").forEach(n => {
    const k = n.dataset.key;
    n.classList.toggle("dim", on && k !== MAP.selected && !MAP.neighbors.has(k));
    n.classList.toggle("near", on && MAP.neighbors.has(k));
  });
  $$("#gEdges line").forEach(l => {
    const linked = on && (l.dataset.a === MAP.selected || l.dataset.b === MAP.selected);
    l.classList.toggle("hl", linked);
    l.classList.toggle("dim", on && !linked);
  });
}

/** Concepts qui accompagnent le plus souvent celui-ci dans les articles gardés. */
function neighborsOf(key) {
  return MODEL.edges.filter(e => e.a === key || e.b === key)
    .map(e => ({ c: MODEL.byKey.get(e.a === key ? e.b : e.a), n: e.n }))
    .filter(x => x.c).sort((a, b) => b.n - a.n);
}

/** Traduction d'un concept en terme PubMed utilisable. */
function conceptPreset(c) {
  if (c.kind === "mesh") return { name: c.label, term: c.label, field: "mesh" };
  if (c.kind === "type") return { name: c.label, term: `"${c.label}"[pt]`, field: "raw" };
  if (c.kind === "jr") return { name: c.label, term: `"${c.label}"[ta]`, field: "raw" };
  return { name: c.label, term: c.label, field: "tiab" };
}

const FICHE_FIELDS = [
  { k: "p", label: "Population", ph: "Qui, combien, quel contexte" },
  { k: "i", label: "Intervention", ph: "Ce qui est testé" },
  { k: "c", label: "Comparateur", ph: "Contre quoi" },

  { k: "r", label: "Résultat principal", ph: "Effet, IC 95 %, p" },
  { k: "l", label: "Limites", ph: "Biais, puissance, validité externe" },
];
