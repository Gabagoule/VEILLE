<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille Reacoeur</title>
<meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Veille URCV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* =====================================================================
   Jetons de design
   Rouge artériel / bleu oxygéné : la dualité d'un circuit d'assistance.
   ===================================================================== */
:root {
  --bg: #F2F2F5;
  --panel: rgba(255, 255, 255, 0.78);
  --card: #FFFFFF;
  --sunk: #EBEBF0;
  --ink: #1D1D1F;
  --ink2: #6E6E73;
  --ink3: #A1A1A6;
  --line: rgba(0, 0, 0, 0.08);
  --line2: rgba(0, 0, 0, 0.14);
  --blue: #0A6CFF;
  --blue-soft: rgba(10, 108, 255, 0.10);
  --red: #D7263D;
  --red-soft: rgba(215, 38, 61, 0.10);
  --violet: #5E5CE6;
  --violet-soft: rgba(94, 92, 230, 0.12);
  --green: #1F9D55;
  --green-soft: rgba(31, 157, 85, 0.12);
  --amber: #E08600;
  --amber-soft: rgba(224, 134, 0, 0.12);
  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --shadow-2: 0 8px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.05);
  --shadow-3: 0 24px 60px rgba(20,20,40,.18), 0 4px 14px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --tabbar-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --panel: rgba(28, 28, 30, 0.78);
    --card: #1C1C1E;
    --sunk: #2C2C2E;
    --ink: #F5F5F7;
    --ink2: #A1A1A6;
    --ink3: #6E6E73;
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.16);
    --blue: #3D8BFF;
    --blue-soft: rgba(61, 139, 255, 0.16);
    --red: #FF4D5E;
    --red-soft: rgba(255, 77, 94, 0.16);
    --violet: #8583FF;
    --violet-soft: rgba(133, 131, 255, 0.18);
    --green: #3DD68C;
    --green-soft: rgba(61, 214, 140, 0.15);
    --amber: #FFB340;
    --amber-soft: rgba(255, 179, 64, 0.16);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 8px 30px rgba(0,0,0,.5);
    --shadow-3: 0 24px 60px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- Structure ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; }
.sidebar {
  background: var(--panel);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 12px 14px;
  gap: 4px;
  min-height: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 26px; height: 14px; }
.brand strong { display: block; font-family: var(--font-display); font-size: 15px; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 12px; color: var(--ink2); }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
  background: transparent; text-align: left; color: var(--ink);
  font-size: 14px;
}
.nav-item:hover { background: var(--line); }
.nav-item.active { background: var(--blue); color: #fff; }
.count {
  margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px;
  background: var(--red); color: #fff; font-size: 12px; font-weight: 600; text-align: center;
  font-variant-numeric: tabular-nums;
}
.nav-item.active .count { background: rgba(255,255,255,.25); }
.nav-spacer { flex: 1; }

.side-stats { margin: 10px 4px 10px; padding: 14px 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-1); }
.side-stats .row { display: flex; justify-content: space-between; align-items: baseline; }
.side-stats .big { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.side-stats .small { font-size: 12px; color: var(--ink2); }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 12px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--sunk); }
.heat i[data-l="1"] { background: color-mix(in srgb, var(--red) 30%, var(--sunk)); }
.heat i[data-l="2"] { background: color-mix(in srgb, var(--red) 55%, var(--sunk)); }
.heat i[data-l="3"] { background: color-mix(in srgb, var(--red) 80%, var(--sunk)); }
.heat i[data-l="4"] { background: var(--red); }

.sync-line { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--ink2); border: 0; background: none; border-radius: 9px; width: 100%; text-align: left; }
.sync-line:hover { background: var(--line); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); flex: none; }
.sync-dot.ok { background: var(--green); }
.sync-dot.busy { background: var(--blue); animation: blink 1s ease-in-out infinite; }
.sync-dot.error { background: var(--red); }
@keyframes blink { 50% { opacity: .3; } }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px; min-height: 64px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  position: relative; z-index: 20;
}
.topbar h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
.topbar .grow { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; width: min(340px, 30vw);
  padding: 7px 12px; border-radius: 10px; background: var(--sunk); color: var(--ink2);
}
.search input { border: 0; background: transparent; outline: none; width: 100%; color: var(--ink); }

.view { flex: 1; min-height: 0; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }

.tabbar { display: none; }

/* ---------- Boutons, champs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 7px 13px; border-radius: 9px; border: 1px solid transparent;
  background: var(--blue); color: #fff; font-weight: 500; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line2); box-shadow: var(--shadow-1); }
.btn.plain { background: transparent; color: var(--blue); padding: 6px 8px; }
.btn.danger { background: var(--red); }
.btn.small { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
  border: 0; background: transparent; color: var(--ink2); flex: none;
}
.icon-btn:hover { background: var(--line); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label, .label { font-size: 12px; font-weight: 600; color: var(--ink2); }
.input, select.input, textarea.input {
  width: 100%; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--line2); background: var(--card); outline: none;
  font-size: 16px; /* évite le zoom automatique sur iOS */
}
@media (min-width: 761px) { .input, select.input, textarea.input { font-size: 14px; } }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
textarea.input { resize: vertical; min-height: 80px; }
textarea.code { font-family: var(--mono); font-size: 12px; }
.hint { font-size: 12px; color: var(--ink2); }

.switch { position: relative; width: 42px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line2); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line2);
  background: var(--card); font-size: 13px; color: var(--ink); white-space: nowrap;
}
button.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .x { border: 0; background: none; padding: 0; color: var(--ink3); display: grid; }
.chip .x:hover { color: var(--red); }
.chip svg.i { width: 13px; height: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ev { background: var(--violet-soft); color: var(--violet); }
.pill.hot { background: var(--red-soft); color: var(--red); }
.pill.clinical { background: var(--green-soft); color: var(--green); }
.pill.oa { background: var(--blue-soft); color: var(--blue); }
.pill.new { background: var(--amber-soft); color: var(--amber); }
.pill.retracted { background: var(--red); color: #fff; }
.pill.preprint { background: var(--sunk); color: var(--ink2); }

.score {
  display: inline-grid; place-items: center; min-width: 38px; height: 26px; padding: 0 8px;
  border-radius: 8px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
  background: var(--sunk); color: var(--ink2);
}
.score.s2 { background: var(--violet-soft); color: var(--violet); }
.score.s3 { background: var(--red); color: #fff; }

.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--sunk); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }

.empty { display: grid; place-items: center; text-align: center; padding: 60px 20px; color: var(--ink2); }
.empty h3 { font-family: var(--font-display); color: var(--ink); font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 42ch; }
.empty .btn { margin: 4px; }

/* ---------- Pilule de scan (le « pouls » de la veille) ---------- */
.scan {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 4px 4px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow-1);
  cursor: pointer; min-height: 38px; min-width: 0;
}
.scan .meta { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.scan .go { border-radius: 999px; padding: 6px 14px; }
.scan .icon-btn { color: var(--red); }
.scan.running { padding-left: 8px; border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.ecg { width: 86px; height: 26px; flex: none; }
.ecg path { fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 60 200; animation: ecg 1.6s linear infinite; }
@keyframes ecg { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
.scan .txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; width: 170px; }
.scan .txt strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scan .txt span { font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scan .bar { height: 3px; border-radius: 3px; background: var(--sunk); margin-top: 3px; overflow: hidden; }
.scan .bar i { display: block; height: 100%; background: var(--red); transition: width .4s; }

.popover {
  position: absolute; right: 22px; top: 60px; width: min(420px, calc(100vw - 24px)); max-height: 70vh; overflow: auto;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-3); border: 1px solid var(--line);
  padding: 16px; z-index: 40;
}
.popover h4 { margin: 0 0 10px; font-size: 13px; }
.log { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); background: var(--sunk); border-radius: 10px; padding: 10px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
.qlist { list-style: none; margin: 0 0 12px; padding: 0; }
.qlist li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.qlist li:last-child { border: 0; }

/* =====================================================================
   Triage : le paquet de cartes
   ===================================================================== */
.triage { display: grid; grid-template-rows: auto 1fr auto; height: 100%; padding: 16px 24px 20px; gap: 12px; }
.triage-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.triage-bar .left { font-size: 13px; color: var(--ink2); margin-left: auto; font-variant-numeric: tabular-nums; }
.deck { position: relative; width: min(720px, 100%); margin: 0 auto 26px; height: calc(100% - 26px); min-height: 320px; }
.card {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--card); border-radius: 26px;
  box-shadow: var(--shadow-2); border: 1px solid var(--line);
  padding: 26px 30px 20px;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transform-origin: 50% 90%;
  will-change: transform;
}
.card.behind { pointer-events: none; }
.card.top { cursor: grab; box-shadow: var(--shadow-3); }
.card.dragging { cursor: grabbing; }
.card.leaving { transition: transform .32s cubic-bezier(.4,.1,.6,1), opacity .32s; }
.card.snap { transition: transform .35s cubic-bezier(.2,1.4,.4,1); }
.card-head { display: flex; align-items: flex-start; gap: 16px; }
.card-head .src { flex: 1; min-width: 0; font-size: 13px; color: var(--ink2); }
.card-head .src b { color: var(--ink); font-weight: 600; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .track { stroke: var(--sunk); }
.ring .val { stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.card h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.22; letter-spacing: -0.015em; margin: 10px 0 8px; font-weight: 650; max-width: 60ch; }
.card .authors { font-size: 13px; color: var(--ink2); margin-bottom: 12px; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; flex: none; }
.metrics div { background: var(--card); padding: 8px 12px; min-width: 0; }
.metrics b { display: block; font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.metrics span { font-size: 11.5px; color: var(--ink2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abstract { flex: 1; min-height: 0; overflow: auto; font-size: 14px; line-height: 1.55; color: var(--ink); padding-right: 6px; max-width: 75ch; touch-action: pan-y; -webkit-user-select: text; user-select: text; cursor: auto; }
.abstract p { margin: 0 0 8px; }
.abstract b { color: var(--ink2); font-weight: 600; }
.card-foot { display: flex; gap: 14px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; font-size: 13px; min-width: 0; }
.card-foot .links { display: flex; gap: 14px; flex: none; }
.card-foot .themes { margin-left: auto; flex-wrap: nowrap; overflow: hidden; min-width: 0; }

.stamp {
  position: absolute; padding: 6px 14px; border-radius: 10px;
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  border: 3px solid currentColor; opacity: 0; pointer-events: none; background: var(--card); z-index: 2;
}
.stamp.right { left: 30px; top: 40%; color: var(--green); transform: rotate(-10deg); }
.stamp.left { right: 30px; top: 40%; color: var(--ink2); transform: rotate(10deg); }
.stamp.up { left: 50%; bottom: 90px; color: var(--red); transform: translateX(-50%); }
.stamp.down { left: 50%; top: 70px; color: var(--amber); transform: translateX(-50%); }

.actions { display: flex; justify-content: center; align-items: center; gap: 18px; }
.act {
  width: 58px; height: 58px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow-2);
  transition: transform .15s;
}
.act svg.i { width: 24px; height: 24px; stroke-width: 2.2; }
.act:hover { transform: scale(1.07); }
.act:active { transform: scale(.95); }
.act.left { color: var(--ink2); }
.act.down { color: var(--amber); width: 46px; height: 46px; }
.act.up { color: var(--red); width: 66px; height: 66px; }
.act.up svg.i { width: 28px; height: 28px; }
.act.right { color: var(--green); }
.act.undo { color: var(--ink3); width: 40px; height: 40px; box-shadow: var(--shadow-1); }
.act.undo svg.i { width: 18px; height: 18px; }
.keys { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 6px; }
kbd { font-family: var(--font); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line2); background: var(--card); color: var(--ink2); }

/* =====================================================================
   Graphe de thèmes
   ===================================================================== */
.graph-wrap { position: absolute; inset: 0; overflow: hidden;
  background-image: radial-gradient(circle, var(--line2) 1px, transparent 1.2px);
  background-size: 24px 24px; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph.panning { cursor: grabbing; }
.gtools { position: absolute; left: 18px; top: 16px; display: flex; gap: 8px; z-index: 5; flex-wrap: wrap; }
.ghelp { position: absolute; left: 18px; bottom: 14px; font-size: 12px; color: var(--ink3); z-index: 5; }
.edge { stroke: var(--line2); stroke-width: 1.6; }
.node { cursor: pointer; }
.node .core { stroke: var(--card); stroke-width: 3; }
.node.folder .core { fill: var(--card) !important; stroke-width: 2.5; stroke-dasharray: 4 3; }
.node .halo { fill: none; stroke: var(--blue); stroke-width: 3; opacity: 0; }
.node.selected .halo { opacity: 1; }
.node.target .halo { opacity: 1; stroke: var(--green); stroke-dasharray: 5 4; }
.node.disabled { opacity: .35; }
.node text { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node .sub { font-size: 11px; font-weight: 400; fill: var(--ink2); }
.node .nb circle { fill: var(--red); stroke: var(--card); stroke-width: 2; }
.node .nb text { fill: #fff; stroke: none; font-size: 10.5px; font-weight: 700; }
.node .initial { fill: #fff; stroke: none; font-size: 13px; }
.node.folder .initial { fill: var(--ink2); }
.node .pulse { fill: none; stroke: var(--red); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.node.scanning .pulse { animation: pulse 1.2s ease-out infinite; }

function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);

function toast(text, { action, error = false, timeout = 4500 } = {}) {
  const t = el(`<div class="toast ${error ? "error" : ""}"><span>${esc(text)}</span></div>`);

const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function fmtDate(d) {
  if (!d) return "date inconnue";
  const [y, m, day] = d.split("-").map(Number);
  return `${day} ${MONTHS[(m || 1) - 1]} ${y}`;
}
function ago(ts) {
  if (!ts) return "jamais";
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  const d = Math.round(s / 86400);
  return d === 1 ? "hier" : `il y a ${d} j`;
}

function download(filename, text) {

/* =====================================================================
   2. Stockage local (IndexedDB) et données en mémoire
   Tout est chargé en mémoire au démarrage ; chaque modification est
   écrite dans IndexedDB et marque le document de synchro concerné.
   ===================================================================== */
const IDB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("veille-urcv", 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore("articles", { keyPath: "pmid" });
        d.createObjectStore("docs");
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => resolve(out && "result" in out ? out.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error("Écriture annulée (stockage plein ?)"));
    });
  },
  getAll(store) { return this.tx(store, "readonly", s => s.getAll()); },
  getDoc(key) { return this.tx("docs", "readonly", s => s.get(key)); },
  putDoc(key, value) { return this.tx("docs", "readwrite", s => { s.put(value, key); }); },
  putArticles(list) { return this.tx("articles", "readwrite", s => { list.forEach(a => s.put(a)); }); },
  clearAll() { return Promise.all([this.tx("articles", "readwrite", s => { s.clear(); }), this.tx("docs", "readwrite", s => { s.clear(); })]); },
};

function descendants(ids) {
  const children = {};
  themesList().forEach(t => { if (t.parent) (children[t.parent] ||= []).push(t.id); });
  const out = new Set(ids), stack = [...ids];
  while (stack.length) (children[stack.pop()] || []).forEach(c => { if (!out.has(c)) { out.add(c); stack.push(c); } });
  return out;
}

   3. Score URCV et badges
   ===================================================================== */
const EVIDENCE_LEVEL = {
  "Meta-Analysis": 1.0, "Systematic Review": 0.95, "Practice Guideline": 0.95, "Guideline": 0.95,
  "Consensus Development Conference": 0.85, "Randomized Controlled Trial": 0.9, "Clinical Trial, Phase III": 0.85,
  "Equivalence Trial": 0.8, "Pragmatic Clinical Trial": 0.8, "Controlled Clinical Trial": 0.75,
  "Multicenter Study": 0.65, "Clinical Trial, Phase II": 0.65, "Clinical Trial": 0.6,
  "Observational Study": 0.55, "Comparative Study": 0.5, "Review": 0.5, "Journal Article": 0.4,
  "Preprint": 0.3, "Case Reports": 0.15, "Letter": 0.1, "Comment": 0.1, "Editorial": 0.12,
};
const EVIDENCE_GROUPS = {
  meta: ["Meta-Analysis", "Systematic Review"],
  guideline: ["Practice Guideline", "Guideline", "Consensus Development Conference"],
  rct: ["Randomized Controlled Trial", "Clinical Trial, Phase III", "Equivalence Trial", "Pragmatic Clinical Trial", "Controlled Clinical Trial"],
  trial: ["Clinical Trial", "Clinical Trial, Phase II", "Multicenter Study"],
  observational: ["Observational Study", "Comparative Study"],
  review: ["Review"],
  case: ["Case Reports"],
  opinion: ["Letter", "Comment", "Editorial"],
  preprint: ["Preprint"],
};
const EVIDENCE_LABEL = {
  meta: "Méta-analyse", guideline: "Recommandation", rct: "Essai randomisé", trial: "Essai clinique",
  observational: "Observationnelle", review: "Revue", case: "Cas clinique", opinion: "Opinion",
  preprint: "Preprint", other: "Article",
};

function ageDays(a) {
  const t = Date.parse(a.date || a.edat || "");
  return Number.isNaN(t) ? 365 : Math.max(0, (Date.now() - t) / 864e5);
}
const cites = (a) => Math.max(a.co || 0, a.ci || 0);
const velocity = (a) => cites(a) / Math.max(ageDays(a) / 30.44, 3);
const evidenceLevel = (types) => Math.max(0.35, ...(types || []).map(t => EVIDENCE_LEVEL[t] || 0));
function evidenceGroup(types) {
  const set = new Set(types || []);
  for (const [k, members] of Object.entries(EVIDENCE_GROUPS)) if (members.some(m => set.has(m))) return k;
  return "other";
}

function computeScore(a, st) {
  const s = DB.settings;
  const w = s.weights;
  const total = Object.values(w).reduce((x, y) => x + Math.max(0, +y), 0) || 1;
  const half = Math.max(7, +s.half_life_days || 180);
  const vel = velocity(a);
  const themeW = Math.max(0, ...liveThemeIds(a).map(id => DB.themes[id].weight || 3));
  const impact = DB.sources[a.src]?.impact || 0;
  const comps = {
    evidence: evidenceLevel(a.types),
    velocity: Math.min(1, Math.max(Math.log1p(vel) / Math.log1p(6), Math.log1p(a.rcr || 0) / Math.log1p(12))),
    freshness: Math.exp(-ageDays(a) * Math.LN2 / half),
    journal: Math.min(1, Math.log1p(impact) / Math.log1p(20)),
    theme: Math.min(1, themeW / 5),
  };
  let score = Object.keys(comps).reduce((acc, k) => acc + comps[k] * Math.max(0, +w[k] || 0), 0) / total * 100;
  if (a.ret) score *= 0.1;
  if (st.d) score *= 0.6;
  return { score: Math.round(score * 10) / 10, comps, vel, impact: impact || null };
}

function badgesOf(a) {
  const b = [];
  const types = new Set(a.types || []);
  const age = ageDays(a);
  if (a.ret) b.push("retracted");
  if (a.pre) b.push("preprint");
  if (velocity(a) >= 1.5 && age <= 730) b.push("hot");
  if ((a.cc || 0) > 0) b.push("clinical");
  if (a.oa || a.pmc) b.push("oa");
  if (age <= 14) b.push("new");
  if (EVIDENCE_GROUPS.rct.some(t => types.has(t))) b.push("rct");
  return b;
}

/** Vue calculée d'un article (score, badges, état) pour l'affichage. */
function viewOf(a) {
  const st = stateOf(a.pmid);
  const sc = computeScore(a, st);
  return { a, st, ...sc, cites: cites(a), ev: evidenceGroup(a.types), badges: badgesOf(a), themeIds: liveThemeIds(a) };
}

const haystacks = new WeakMap();
function haystack(a) {
  let h = haystacks.get(a);
  if (!h) {
    h = [a.title, a.abstract, (a.mesh || []).join(" "), a.journal, (a.authors || []).join(" "), a.pmid, a.doi].join(" ").toLowerCase();
    haystacks.set(a, h);
  }
  return h;
}

const SORTS = {
  score: v => v.score, date: v => v.a.date || "", citations: v => v.cites, velocity: v => v.vel,
  rcr: v => v.a.rcr || 0, journal: v => v.impact || 0, added: v => v.a.fs || 0, changed: v => v.st.t || 0,
};

/** Filtrage + tri en mémoire. */
function queryArticles(f = {}) {
  const statuses = f.status ? new Set(f.status) : null;
  const themeSet = f.themes?.length ? descendants(f.themes) : null;
  const words = (f.q || "").toLowerCase().split(/\s+/).filter(Boolean);
  const types = f.types?.length ? new Set(f.types) : null;
  const need = f.badges || [];
  const since = f.since ? new Date(Date.now() - f.since * 864e5).toISOString().slice(0, 10) : null;
  const out = [];
  for (const a of DB.articles.values()) {
    if (isOrphan(a)) continue;
    const st = stateOf(a.pmid);
    if (statuses && !statuses.has(st.s)) continue;
    if (f.fav && !st.f) continue;
    if (f.hide_retracted !== false && a.ret) continue;
    if (themeSet && !(a.th || []).some(id => themeSet.has(id))) continue;
    if (since && (a.date || "") < since) continue;
    if (f.year_min && (a.date || "") < `${f.year_min}-01-01`) continue;
    if (f.year_max && (a.date || "9999") > `${f.year_max}-12-31`) continue;
    if (f.min_cites && cites(a) < f.min_cites) continue;
    if (f.oa && !(a.oa || a.pmc)) continue;
    if (words.length) { const h = haystack(a); if (!words.every(w => h.includes(w))) continue; }
    const v = viewOf(a);
    if (types && !types.has(v.ev)) continue;
    if (need.length && !need.every(b => v.badges.includes(b))) continue;
    out.push(v);
  }
  const key = SORTS[f.sort] || SORTS.score;
  const dir = f.order === "asc" ? 1 : -1;
  out.sort((x, y) => { const a = key(x), b = key(y); return a < b ? -dir : a > b ? dir : 0; });
  return out;
}

function computeStats() {
  const by = { inbox: 0, toread: 0, read: 0, club: 0, archive: 0, ignored: 0 };
  let favs = 0, total = 0;
  for (const a of DB.articles.values()) {
    if (isOrphan(a)) continue;
    const st = stateOf(a.pmid);
    by[st.s] = (by[st.s] || 0) + 1;
    if (st.f) favs++;
    total++;
  }
  const perDay = {};
  DB.events.forEach(e => { const k = dayKey(e.ts); perDay[k] = (perDay[k] || 0) + 1; });
  let streak = 0;
  const d = new Date();
  if (!perDay[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (perDay[dayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
  const lastScan = Math.max(0, ...Object.values(DB.scans).map(s => s.u || 0));
  return { by, favs, total, streak, today: perDay[todayISO()] || 0, perDay, lastScan };
}

function themeCounts() {
  const out = {};
  for (const a of DB.articles.values()) {
    const st = stateOf(a.pmid);
    for (const id of a.th || []) {
      const c = out[id] ||= { total: 0, inbox: 0, favs: 0 };
      c.total++;
      if (st.s === "inbox") c.inbox++;
      if (st.f) c.favs++;
    }
  }
  return out;
}

/* =====================================================================
   4. Requêtes PubMed
   ===================================================================== */
function termQuery(term, field) {
  term = (term || "").trim();
  if (!term) return "";
  if (field === "raw") return `(${term})`;
  const safe = term.replace(/"/g, "");
  if (field === "tiab") return `"${safe}"[tiab]`;
  if (field === "mesh") return `"${safe}"[mh]`;
  return safe.includes(" ") ? `"${safe}"` : safe;   // auto : mapping automatique PubMed
}
const orJoin = (parts) => { parts = parts.filter(Boolean); return !parts.length ? "" : parts.length === 1 ? parts[0] : `(${parts.join(" OR ")})`; };

function buildQuery(t) {
  const core = orJoin((t.terms || []).map(x => termQuery(x.t, x.f)));
  if (!core) return "";   // dossier
  let q = core;
  const s = DB.settings;
  if (s.context_enabled && t.ctx !== false && s.context_query) q = `${q} AND (${s.context_query})`;
  const excl = Object.values(DB.exclusions).filter(e => !e.del && e.enabled && (!e.theme || e.theme === t.id));
  const ex = orJoin(excl.map(e => termQuery(e.term, e.field)));
  if (ex) q = `(${q}) NOT ${ex}`;
  return q;
}
const termsHash = (t) => hashStr(JSON.stringify(t.terms || []) + "|" + (t.ctx !== false));

/* =====================================================================
   5. Réseau : limitation de débit, relais Worker si accès direct impossible
   ===================================================================== */
class Limiter {
  constructor(rps) { this.gap = 1000 / rps; this.last = 0; this.chain = Promise.resolve(); }
  setRate(rps) { this.gap = 1000 / rps; }
  wait() {
    this.chain = this.chain.then(async () => {
      const d = Date.now() - this.last;
      if (d < this.gap) await sleep(this.gap - d);
      this.last = Date.now();
    });
    return this.chain;
  }
}
const LIMIT = { ncbi: new Limiter(2.8), icite: new Limiter(3), openalex: new Limiter(8) };
const SERVICE_NAME = { ncbi: "PubMed", icite: "iCite", openalex: "OpenAlex" };
const viaProxy = {};

async function http(service, url, { method = "GET", params = {}, form = null, retries = 4, allow404 = false } = {}) {
  const u = new URL(url);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") u.searchParams.set(k, v); });
  const body = form ? new URLSearchParams(form) : undefined;
  let lastErr;
  for (let i = 0; i < retries; i++) {
    await LIMIT[service].wait();
    const sec = secrets();
    const proxied = viaProxy[service];
    let r;
    try {
      if (proxied) {
        r = await fetch(`${sec.worker_url.replace(/\/+$/, "")}/v1/proxy?url=${encodeURIComponent(u)}`, {
          method, body, headers: { Authorization: `Bearer ${sec.sync_token}` },
        });
      } else {
        r = await fetch(u, { method, body });
      }
    } catch (e) {
      lastErr = e;
      if (!proxied && sec.worker_url && sec.sync_token) {
        viaProxy[service] = true;
        scanLog(`${SERVICE_NAME[service]} : accès direct bloqué, passage par le Worker`);
        i--; continue;
      }
      if (!proxied) throw new Error(`${SERVICE_NAME[service]} injoignable depuis ce navigateur. Configure le Worker dans Réglages pour passer par le relais.`);
      await sleep(1500 * 2 ** i);
      continue;
    }
    if (allow404 && r.status === 404) return null;
    if (r.status === 429 || r.status >= 500) { lastErr = new Error(`${SERVICE_NAME[service]} : erreur ${r.status}`); await sleep(1500 * 2 ** i); continue; }
    if (r.status === 401 && proxied) throw new Error("Le Worker refuse le jeton : vérifie-le dans Réglages.");
    if (!r.ok) throw new Error(`${SERVICE_NAME[service]} : erreur ${r.status}`);
    return r;
  }
  throw lastErr;
}

/* ---------- PubMed (E-utilities) ---------- */
const EUTILS = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
function ncbiCommon() {
  const p = { tool: "veille_urcv" };
  if (DB.settings.email) p.email = DB.settings.email;
  const key = secrets().ncbi_api_key;
  if (key) { p.api_key = key; LIMIT.ncbi.setRate(9); } else LIMIT.ncbi.setRate(2.8);
  return p;
}
const ymd = (d) => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;

async function pubmedSearch(term, mindate, maxdate, retmax) {
  const r = await http("ncbi", EUTILS + "esearch.fcgi", {
    method: "POST",
    form: { ...ncbiCommon(), db: "pubmed", term, datetype: "edat", mindate: ymd(mindate), maxdate: ymd(maxdate),
      retmax: String(Math.min(retmax, 9999)), sort: "pub_date", retmode: "json" },
  });
  const js = (await r.json()).esearchresult || {};
  if (js.ERROR) throw new Error("PubMed : " + js.ERROR);
  return { count: +js.count || 0, ids: js.idlist || [] };
}

async function* pubmedFetch(ids) {
  for (let i = 0; i < ids.length; i += 200) {
    const r = await http("ncbi", EUTILS + "efetch.fcgi", {
      method: "POST", form: { ...ncbiCommon(), db: "pubmed", id: ids.slice(i, i + 200).join(","), retmode: "xml" },
    });
    yield parsePubmed(await r.text());
  }
}

const kid = (e, n) => e ? [...e.children].find(c => c.tagName === n) || null : null;
const kids = (e, n) => e ? [...e.children].filter(c => c.tagName === n) : [];
const path = (e, ...ns) => ns.reduce((x, n) => kid(x, n), e);
const txt = (e) => e ? e.textContent.replace(/\s+/g, " ").trim() : "";
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function dateFrom(e) {
  if (!e) return null;
  let y = txt(kid(e, "Year"));
  let m, d;
  if (!y) {
    const md = txt(kid(e, "MedlineDate")).match(/(\d{4})(?:\s+([A-Za-z]{3}))?/);
    if (!md) return null;
    y = md[1]; m = MON[(md[2] || "jan").toLowerCase()] || 1; d = 1;
  } else {
    const mo = txt(kid(e, "Month")) || "1";
    m = /^\d+$/.test(mo) ? +mo : (MON[mo.slice(0, 3).toLowerCase()] || 1);
    d = +(txt(kid(e, "Day")) || 1);
  }
  const dt = new Date(Date.UTC(+y, m - 1, d));
  return Number.isNaN(dt.getTime()) ? `${y}-01-01` : dt.toISOString().slice(0, 10);
}

function parsePubmed(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("PubMed : réponse XML illisible");
  const out = [];
  for (const pa of doc.getElementsByTagName("PubmedArticle")) {
    const mc = kid(pa, "MedlineCitation");
    const art = kid(mc, "Article");
    if (!mc || !art) continue;
    const abstract = kids(kid(art, "Abstract"), "AbstractText").map(ab => {
      const label = ab.getAttribute("Label");
      const t = txt(ab);
      return label ? `${label.charAt(0) + label.slice(1).toLowerCase()} : ${t}` : t;
    }).filter(Boolean).join("\n");
    const authors = kids(kid(art, "AuthorList"), "Author").map(au => {
      const coll = txt(kid(au, "CollectiveName"));
      if (coll) return coll;
      const last = txt(kid(au, "LastName"));
      return last ? `${last} ${txt(kid(au, "Initials"))}`.trim() : "";
    }).filter(Boolean);
    const types = kids(kid(art, "PublicationTypeList"), "PublicationType").map(txt);
    let doi = null, pmc = null;
    for (const id of kids(path(pa, "PubmedData", "ArticleIdList"), "ArticleId")) {
      if (id.getAttribute("IdType") === "doi") doi = txt(id).toLowerCase();
      if (id.getAttribute("IdType") === "pmc") pmc = txt(id);
    }
    if (!doi) for (const e of kids(art, "ELocationID")) if (e.getAttribute("EIdType") === "doi") doi = txt(e).toLowerCase();
    let edat = null;
    for (const d of kids(path(pa, "PubmedData", "History"), "PubMedPubDate")) {
      if (["entrez", "pubmed"].includes(d.getAttribute("PubStatus"))) { edat = dateFrom(d); break; }
    }
    const dates = [dateFrom(kid(art, "ArticleDate")), dateFrom(path(art, "Journal", "JournalIssue", "PubDate"))].filter(Boolean).sort();
    const retracted = types.includes("Retracted Publication") ||
      kids(kid(mc, "CommentsCorrectionsList"), "CommentsCorrections").some(c => c.getAttribute("RefType") === "RetractionIn");
    out.push({
      pmid: txt(kid(mc, "PMID")),
      doi, pmc,
      title: txt(kid(art, "ArticleTitle")),
      abstract,
      journal: txt(path(art, "Journal", "Title")),
      ja: txt(path(art, "Journal", "ISOAbbreviation")),
      date: dates[0] || edat,
      edat,
      authors, types,
      mesh: kids(kid(mc, "MeshHeadingList"), "MeshHeading").map(m => txt(kid(m, "DescriptorName"))),
      kw: kids(kid(mc, "KeywordList"), "Keyword").map(txt),
      lang: txt(kid(art, "Language")),
      pre: types.includes("Preprint") ? 1 : 0,
      ret: retracted ? 1 : 0,
    });
  }
  return out;
}

async function meshSuggest(term) {
  let r = await http("ncbi", EUTILS + "esearch.fcgi", { params: { ...ncbiCommon(), db: "mesh", term, retmax: "5", retmode: "json" } });
  const ids = (await r.json()).esearchresult?.idlist || [];
  if (!ids.length) return [];
  r = await http("ncbi", EUTILS + "esummary.fcgi", { params: { ...ncbiCommon(), db: "mesh", id: ids.join(","), retmode: "json" } });
  const res = (await r.json()).result || {};
  return (res.uids || []).map(u => res[u]).filter(x => x?.ds_meshterms?.length).map(x => ({
    heading: x.ds_meshterms[0], entries: x.ds_meshterms.slice(1, 12), scope: (x.ds_scopenote || "").slice(0, 300),
  }));
}

/* ---------- iCite (NIH) ---------- */
async function iciteMetrics(pmids) {
  const out = {};
  for (let i = 0; i < pmids.length; i += 200) {
    const r = await http("icite", "https://icite.od.nih.gov/api/pubs", { params: { pmids: pmids.slice(i, i + 200).join(","), format: "json" } });
    for (const d of (await r.json()).data || []) {
      const pmid = String(d.pmid ?? d._id ?? "");
      if (!pmid) continue;
      out[pmid] = { ci: d.citation_count ?? null, rcr: d.relative_citation_ratio ?? null, apt: d.apt ?? null,
        cc: Array.isArray(d.cited_by_clin) ? d.cited_by_clin.length : null };
    }
  }
  return out;
}

/* ---------- OpenAlex ---------- */
const OA_FIELDS = "id,doi,cited_by_count,counts_by_year,open_access,primary_location,is_retracted,fwci";
const normDoi = (d) => (d || "").toLowerCase().trim().replace(/^(https?:\/\/(dx\.)?doi\.org\/|doi:)/, "");
function oaParams(extra) {
  const p = { ...extra };
  const key = secrets().openalex_api_key;
  if (key) p.api_key = key;
  if (DB.settings.email) p.mailto = DB.settings.email;
  return p;
}
function oaExtract(w) {
  const src = w.primary_location?.source || {};
  return {
    co: w.cited_by_count ?? null,
    cby: (w.counts_by_year || []).map(c => ({ y: c.year, n: c.cited_by_count })),
    oa: w.open_access?.is_oa ? 1 : 0,
    oaUrl: w.open_access?.oa_url || null,
    ret: w.is_retracted ? 1 : 0,
    fwci: w.fwci ?? null,
    src: (src.id || "").split("/").pop() || null,
    srcName: src.display_name || null,
  };
}
async function openalexByDoi(dois) {
  dois = [...new Set(dois.map(normDoi))].filter(d => d && !/[|,]/.test(d));
  const out = {};
  if (secrets().openalex_api_key) {
    for (let i = 0; i < dois.length; i += 50) {
      const r = await http("openalex", "https://api.openalex.org/works", {
        params: oaParams({ filter: "doi:" + dois.slice(i, i + 50).join("|"), "per-page": "50", select: OA_FIELDS }),
      });
      for (const w of (await r.json()).results || []) out[normDoi(w.doi)] = oaExtract(w);
    }
    return out;
  }
  for (const d of dois) {   // sans clé : appels unitaires (gratuits)
    if (SCAN.cancel) break;
    const r = await http("openalex", `https://api.openalex.org/works/https://doi.org/${encodeURIComponent(d).replace(/%2F/gi, "/")}`,
      { params: oaParams({ select: OA_FIELDS }), retries: 2, allow404: true });
    if (r) out[d] = oaExtract(await r.json());
  }
  return out;
}
async function openalexSource(id) {
  const r = await http("openalex", `https://api.openalex.org/sources/${id}`,
    { params: oaParams({ select: "id,display_name,summary_stats" }), retries: 2, allow404: true });
  if (!r) return null;
  const js = await r.json();
  return { name: js.display_name, impact: js.summary_stats?.["2yr_mean_citedness"] ?? null, h: js.summary_stats?.h_index ?? null };
}

/* =====================================================================
   6. Scanner : un thème après l'autre, incrémental
   ===================================================================== */
const SCAN = { running: false, phase: "idle", queue: [], done: [], current: null, progress: 0, newTotal: 0, log: [], errors: [], cancel: false };
let wakeLock = null;

function scanLog(msg) {
  const stamp = new Date().toLocaleTimeString("fr-FR");
  SCAN.log = [...SCAN.log, `${stamp}  ${msg}`].slice(-80);
  renderScanUI();
}

function startScan(themeIds) {
  if (SCAN.running) return toast("Un scan est déjà en cours.");
  let list = themesList().filter(t => themeIds ? themeIds.includes(t.id) : t.enabled);
  list.sort((a, b) => (b.weight - a.weight) || a.name.localeCompare(b.name));
  Object.assign(SCAN, { running: true, phase: "scan", queue: list.map(t => ({ id: t.id, name: t.name })), done: [], current: null,
    progress: 0, newTotal: 0, log: [], errors: [], cancel: false });
  renderScanUI();
  runScan();
}

async function runScan() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { /* non disponible */ }
  const total = Math.max(1, SCAN.queue.length);
  try {
    const queue = [...SCAN.queue];
    for (let i = 0; i < queue.length; i++) {
      if (SCAN.cancel) { scanLog("Scan interrompu."); break; }
      SCAN.current = queue[i];
      SCAN.queue = queue.slice(i + 1);
      renderScanUI();
      try {
        const n = await scanTheme(queue[i].id);
        SCAN.done.push({ ...queue[i], n });
      } catch (e) {
        console.error(e);
        SCAN.errors.push(`${queue[i].name} : ${e.message}`);
        scanLog(`⚠ ${queue[i].name} : ${e.message}`);
        SCAN.done.push({ ...queue[i], n: 0, error: true });
      }
      SCAN.progress = (i + 1) / total;
    }
    SCAN.current = null;
    if (!SCAN.cancel) { SCAN.phase = "metrics"; renderScanUI(); await refreshMetrics(); }
  } catch (e) {
    SCAN.errors.push(e.message);
    scanLog(`⚠ ${e.message}`);
  } finally {
    SCAN.running = false; SCAN.phase = "idle"; SCAN.current = null;
    try { await wakeLock?.release(); } catch { /* déjà relâché */ }
    scanLog(`Terminé : ${plural(SCAN.newTotal, "nouvel article", "nouveaux articles")}.`);
    onScanFinished();
  }
}

async function scanTheme(themeId) {
  const t = getTheme(themeId);
  if (!t) return 0;
  const q = buildQuery(t);
  if (!q) { scanLog(`${t.name} : dossier sans terme, ignoré`); return 0; }
  const h = termsHash(t);
  const prev = DB.scans[t.id];
  const today = new Date();
  const deep = !prev || prev.hash !== h;
  const mindate = deep
    ? new Date(Date.now() - (+DB.settings.lookback_days || 365) * 864e5)
    : new Date(Date.parse(prev.last) - 3 * 864e5);
  scanLog(`${t.name} : recherche depuis le ${mindate.toLocaleDateString("fr-FR")}${deep ? " (scan profond)" : ""}`);

  const { count, ids } = await pubmedSearch(q, mindate, new Date(Date.now() + 864e5), +DB.settings.max_per_theme || 1000);
  if (count > ids.length) scanLog(`${t.name} : ${nf(count)} résultats, plafonnés à ${nf(ids.length)} (réglable)`);

  // Articles déjà connus : simple rattachement au thème
  const linked = [];
  const fresh = [];
  for (const pmid of ids) {
    const a = DB.articles.get(pmid);
    if (!a) { fresh.push(pmid); continue; }
    if (!(a.th || []).includes(t.id)) { a.th = [...(a.th || []), t.id]; linked.push(a); }
  }
  await saveArticles(linked);

  const inserted = [];
  let fetched = 0;
  for await (const batch of pubmedFetch(fresh)) {
    const now = Date.now();
    const toSave = [];
    for (const a of batch) {
      if (!a.pmid) continue;
      const existing = DB.articles.get(a.pmid);
      if (existing) { existing.th ||= []; if (!existing.th.includes(t.id)) { existing.th.push(t.id); toSave.push(existing); } continue; }
      const rec = { ...a, th: [t.id], fs: now, mu: 0 };
      DB.articles.set(a.pmid, rec);
      toSave.push(rec);
      inserted.push(rec);
    }
    await saveArticles(toSave);
    fetched += batch.length;
    scanLog(`${t.name} : ${nf(fetched)} sur ${nf(fresh.length)} téléchargés`);
    if (SCAN.cancel) break;
  }
  if (inserted.length) await enrich(inserted);

  DB.scans[t.id] = { last: today.toISOString().slice(0, 10), hash: h, n: inserted.length, u: Date.now() };
  touch("scans");
  // Un article déjà trié sur un autre appareil ne compte pas comme nouveau
  const newCount = inserted.filter(a => stateOf(a.pmid).s === "inbox").length;
  SCAN.newTotal += newCount;
  scanLog(`${t.name} : ${plural(newCount, "nouveau", "nouveaux")}, ${plural(ids.length - fresh.length, "déjà connu", "déjà connus")}`);
  return newCount;
}

async function enrich(articles) {
  const pmids = articles.map(a => a.pmid);
  let ic = {}, ox = {};
  try { ic = await iciteMetrics(pmids); } catch (e) { scanLog(`iCite indisponible : ${e.message}`); }
  try { ox = await openalexByDoi(articles.filter(a => a.doi).map(a => a.doi)); } catch (e) { scanLog(`OpenAlex indisponible : ${e.message}`); }
  const now = Date.now();
  const srcNames = {};
  for (const a of articles) {
    const m = ic[a.pmid] || {};
    const o = a.doi ? ox[normDoi(a.doi)] || {} : {};
    for (const k of ["ci", "rcr", "apt", "cc"]) if (m[k] !== null && m[k] !== undefined) a[k] = m[k];
    for (const k of ["co", "fwci", "src", "oaUrl"]) if (o[k] !== null && o[k] !== undefined) a[k] = o[k];
    if (o.cby?.length) a.cby = o.cby;
    if (o.oa) a.oa = 1;
    if (o.ret) a.ret = 1;
    if (o.src) srcNames[o.src] = o.srcName;
    a.mu = now;
  }
  await saveArticles(articles);

  // Impact des journaux, gardé 90 jours
  let changed = false;
  for (const [id, name] of Object.entries(srcNames)) {
    const s = DB.sources[id];
    if (s && s.t > now - 90 * 864e5) continue;
    if (SCAN.cancel) break;
    try {
      const info = await openalexSource(id);
      if (info) { DB.sources[id] = { ...info, name: info.name || name, t: now }; changed = true; }
    } catch { /* on réessaiera au prochain scan */ }
  }
  if (changed) touch("sources");
}

async function refreshMetrics() {
  const stale = Date.now() - (+DB.settings.metrics_refresh_days || 7) * 864e5;
  const horizon = new Date(Date.now() - 730 * 864e5).toISOString().slice(0, 10);
  const list = [...DB.articles.values()]
    .filter(a => !isOrphan(a) && stateOf(a.pmid).s !== "ignored" && (a.date || "") >= horizon && (a.mu || 0) < stale)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 2000);
  if (!list.length) return;
  scanLog(`Mise à jour des citations de ${plural(list.length, "article récent", "articles récents")}…`);
  for (let i = 0; i < list.length; i += 200) {
    if (SCAN.cancel) return;
    await enrich(list.slice(i, i + 200));
    SCAN.progress = Math.min(1, (i + 200) / list.length);
    renderScanUI();
  }
}

/* =====================================================================
   7. Synchronisation (Cloudflare Worker + KV)
   Documents : core (tout sauf les articles) + a00..a31 (articles).
   Fusion : la version la plus récente de chaque élément l'emporte.
   ===================================================================== */
const SHARDS = Array.from({ length: 32 }, (_, i) => "a" + String(i).padStart(2, "0"));
const DOC_NAMES = ["core", ...SHARDS];
const shardOf = (pmid) => SHARDS[(parseInt(pmid, 10) || 0) % 32];
const SYNC = { busy: false, again: false, status: "off", error: "", last: +localStorage.getItem("veille.lastSync") || 0 };
const dirty = new Set(JSON.parse(localStorage.getItem("veille.dirty") || "[]"));
const dirtyGen = {};

function markDirty(name) {
  dirty.add(name);
  dirtyGen[name] = (dirtyGen[name] || 0) + 1;
  localStorage.setItem("veille.dirty", JSON.stringify([...dirty]));
  scheduleSync();
}
const syncConfigured = () => { const s = secrets(); return !!(s.worker_url && s.sync_token); };
const scheduleSync = debounce(() => { if (syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true }); }, 8000);

async function worker(pathname, init = {}) {
  const s = secrets();
  const r = await fetch(s.worker_url.replace(/\/+$/, "") + pathname, {
    ...init, headers: { Authorization: `Bearer ${s.sync_token}`, ...(init.headers || {}) },
  });
  if (r.status === 401) throw new Error("Jeton de synchronisation refusé par le Worker.");
  return r;
}

function mergeMap(local, remote, key) {
  const out = { ...local };
  let changed = false, ahead = false;
  for (const [k, r] of Object.entries(remote || {})) {
    const l = out[k];
    if (!l || (r[key] || 0) > (l[key] || 0)) { out[k] = r; changed = true; }
    else if ((l[key] || 0) > (r[key] || 0)) ahead = true;
  }
  if (Object.keys(out).some(k => !(k in (remote || {})))) ahead = true;
  return { out, changed, ahead };
}

function exportCore() {
  const o = {};
  CORE_KEYS.forEach(k => o[k] = DB[k]);
  return o;
}
function exportShard(name) {
  return [...DB.articles.values()].filter(a => shardOf(a.pmid) === name);
}

async function applyCore(remote) {
  let changed = false, ahead = false;
  for (const [k, key] of [["themes", "u"], ["exclusions", "u"], ["states", "t"], ["scans", "u"], ["sources", "t"]]) {
    const m = mergeMap(DB[k], remote[k], key);
    if (m.changed) { DB[k] = m.out; changed = true; pendingDocs.add(k); }
    if (m.ahead) ahead = true;
  }
  const rs = remote.settings || {};
  if ((rs.u || 0) > (DB.settings.u || 0)) {
    DB.settings = { ...DEFAULT_SETTINGS, ...rs, weights: { ...DEFAULT_SETTINGS.weights, ...(rs.weights || {}) } };
    changed = true; pendingDocs.add("settings");
  } else if ((DB.settings.u || 0) > (rs.u || 0)) ahead = true;
  const ids = new Set(DB.events.map(e => e.id));
  const incoming = (remote.events || []).filter(e => !ids.has(e.id));
  if (incoming.length) { DB.events = [...DB.events, ...incoming].sort((a, b) => a.ts - b.ts); changed = true; pendingDocs.add("events"); }
  const rids = new Set((remote.events || []).map(e => e.id));
  if (DB.events.some(e => !rids.has(e.id))) ahead = true;
  flushDocs();
  return { changed, ahead };
}

async function applyShard(name, remoteList) {
  const toSave = [];
  let ahead = false;
  const remoteIds = new Set();
  for (const r of remoteList) {
    remoteIds.add(r.pmid);
    const l = DB.articles.get(r.pmid);
    if (!l) { DB.articles.set(r.pmid, r); toSave.push(r); continue; }
    const th = [...new Set([...(l.th || []), ...(r.th || [])])];
    const newer = (r.mu || 0) > (l.mu || 0);
    if ((l.mu || 0) > (r.mu || 0) || th.length > (r.th || []).length) ahead = true;
    if (newer || th.length > (l.th || []).length) {
      const merged = newer ? { ...l, ...r } : { ...l };
      merged.th = th;
      merged.fs = Math.min(l.fs || Infinity, r.fs || Infinity);
      DB.articles.set(r.pmid, merged);
      toSave.push(merged);
    }
  }
  if (exportShard(name).some(a => !remoteIds.has(a.pmid))) ahead = true;
  if (toSave.length) await IDB.putArticles(toSave);
  return { changed: toSave.length > 0, ahead };
}

async function syncDoc(name, remoteRev, revs) {
  let rev = remoteRev;
  let pull = !!remoteRev && remoteRev !== revs[name];
  let push = dirty.has(name) || (!remoteRev && (name === "core" || exportShard(name).length > 0));
  let changed = false;
  for (let attempt = 0; attempt < 4; attempt++) {
    if (pull) {
      const r = await worker(`/v1/doc/${name}`);
      if (r.status === 404) rev = null;
      else {
        if (!r.ok) throw new Error(`Lecture de ${name} impossible (${r.status})`);
        rev = r.headers.get("X-Rev");
        const data = JSON.parse(await gunzip(await r.arrayBuffer()));
        const res = name === "core" ? await applyCore(data) : await applyShard(name, data);
        changed ||= res.changed;
        if (res.ahead) push = true;
      }
    }
    if (!push) { revs[name] = rev; return changed; }
    const gen = dirtyGen[name] || 0;
    const body = await gzip(JSON.stringify(name === "core" ? exportCore() : exportShard(name)));
    const r = await worker(`/v1/doc/${name}`, { method: "PUT", body, headers: rev ? { "If-Match": rev } : {} });
    if (r.status === 409) { pull = true; continue; }
    if (!r.ok) throw new Error(`Envoi de ${name} impossible (${r.status})`);
    revs[name] = (await r.json()).rev;
    if ((dirtyGen[name] || 0) === gen) dirty.delete(name);
    localStorage.setItem("veille.dirty", JSON.stringify([...dirty]));
    return changed;
  }
  throw new Error("Conflit de synchronisation répété, réessaie dans un instant.");
}

async function syncNow({ quiet = false } = {}) {
  if (!syncConfigured()) { if (!quiet) toast("Renseigne l'adresse du Worker et le jeton dans Réglages."); return false; }
  if (SYNC.busy) { SYNC.again = true; return false; }
  SYNC.busy = true; SYNC.status = "busy"; renderSync();
  let changed = false;
  try {
    const r = await worker("/v1/revs");
    if (!r.ok) throw new Error(`Worker : erreur ${r.status}`);
    const remote = (await r.json()).revs || {};
    const revs = JSON.parse(localStorage.getItem("veille.revs") || "{}");
    for (const name of DOC_NAMES) {
      changed = (await syncDoc(name, remote[name]?.rev || null, revs)) || changed;
      localStorage.setItem("veille.revs", JSON.stringify(revs));
    }
    SYNC.last = Date.now();
    localStorage.setItem("veille.lastSync", String(SYNC.last));
    SYNC.status = "ok"; SYNC.error = "";
    if (!quiet) toast(changed ? "Synchronisé, données mises à jour" : "Synchronisé");
  } catch (e) {
    SYNC.status = "error";
    SYNC.error = e instanceof TypeError ? "Worker injoignable (adresse, réseau ou CORS)." : e.message;
    if (!quiet) toast(SYNC.error, { error: true });
  } finally {
    SYNC.busy = false;
    renderSync();
    if (changed) refreshAfterSync();
    if (SYNC.again) { SYNC.again = false; setTimeout(() => syncNow({ quiet: true }), 500); }
  }
  return SYNC.status === "ok";
}

  refreshStats();

  if (state.view === "triage") reloadTriage({ keepTop: true });
  else if (!typing && !$("#drawerRoot").children.length) RENDER[state.view]();
}

function themeOptions(selected, excludeId) {
  const byParent = {};
  themesList().forEach(t => (byParent[t.parent && getTheme(t.parent) ? t.parent : 0] ||= []).push(t));
  Object.values(byParent).forEach(l => l.sort((a, b) => a.name.localeCompare(b.name)));
  let out = "";
  const walk = (pid, depth) => (byParent[pid] || []).forEach(t => {
    if (t.id === excludeId) return;
    out += `<option value="${esc(t.id)}" ${selected === t.id ? "selected" : ""}>${"\u2003".repeat(depth)}${esc(t.name)}</option>`;
    walk(t.id, depth + 1);
  });
  walk(0, 0);
  return out;
}

/* Glisser la carte. Sur l'abstract (zone qui défile) : glissement horizontal seulement. */
function attachSwipe(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, horizOnly = false;
  const TH = isMobile() ? 90 : 120;
  const stamps = Object.fromEntries(["right", "left", "up", "down"].map(k => [k, $(`.stamp.${k}`, card)]));
  const dirOf = () => (horizOnly || Math.abs(dx) > Math.abs(dy)) ? (dx > 0 ? "right" : "left") : (dy < 0 ? "up" : "down");
  const power = () => (horizOnly ? Math.abs(dx) : Math.max(Math.abs(dx), Math.abs(dy))) / TH;
  const reset = () => {
    card.classList.add("snap");
    card.style.transform = "";
    Object.values(stamps).forEach(s => s.style.opacity = 0);
  };

  card.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest("a, button")) return;
    const onAbstract = !!e.target.closest(".abstract");
    if (onAbstract && e.pointerType === "mouse") return;   // sélection de texte à la souris
    horizOnly = onAbstract;
    active = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    if (!horizOnly) card.setPointerCapture(e.pointerId);
    card.classList.add("dragging");
    card.classList.remove("snap");
  });
  card.addEventListener("pointermove", (e) => {
    if (!active) return;
    dx = e.clientX - sx; dy = horizOnly ? 0 : e.clientY - sy;
    if (horizOnly && Math.abs(dx) < 10) return;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
    const d = dirOf(), p = Math.min(1, power());
    for (const k in stamps) stamps[k].style.opacity = k === d ? p : 0;
  });
  const end = (e) => {
    if (!active) return;
    active = false;
    card.classList.remove("dragging");
    if (e.type !== "pointercancel" && power() >= 1) commitSwipe(dirOf(), { dx, dy });
    else reset();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("lostpointercapture", (e) => { if (active && !horizOnly) end(e); });
}

const SWIPE = {
  right: { patch: { s: "toread" }, event: "swipe_right", msg: "Ajouté à « À lire »" },
  left: { patch: { s: "ignored" }, event: "swipe_left", msg: "Ignoré" },
  up: { patch: { s: "toread", f: 1 }, event: "swipe_up", msg: "Pépite ajoutée" },
  down: { patch: { s: "ignored", d: 1 }, event: "swipe_down", msg: "Noté : moins de ce genre" },
};

let swipeLock = false;
async function commitSwipe(dir, from) {
  if (swipeLock || !triage.queue.length) return;
  swipeLock = true;
  const pmid = triage.queue[0];
  const card = $("#deck .card.top");
  const cfg = SWIPE[dir];
  if (card && !reduceMotion) {
    const W = window.innerWidth + 200, H = window.innerHeight + 200;
    const far = { right: [W, (from?.dy || 0) + 60], left: [-W, (from?.dy || 0) + 60], up: [from?.dx || 0, -H], down: [from?.dx || 0, H] }[dir];
    $$(".stamp", card).forEach(s => s.style.opacity = s.classList.contains(dir) ? 1 : 0);
    card.classList.add("leaving");
    card.style.transform = `translate(${far[0]}px, ${far[1]}px) rotate(${far[0] / 40}deg)`;
    card.style.opacity = "0";
    await sleep(260);
  }
  if (navigator.vibrate && dir === "up") navigator.vibrate(12);
  const prev = setState(pmid, cfg.patch, cfg.event);
  triage.undo.push({ pmid, prev });
  if (triage.undo.length > 30) triage.undo.shift();
  triage.queue.shift();
  renderDeck();
  swipeLock = false;
  toast(cfg.msg, { action: { label: "Annuler", fn: undoSwipe }, timeout: 2600 });
  refreshStatsSoon();
}

function undoSwipe() {
  const last = triage.undo.pop();
  if (!last) return toast("Rien à annuler.");
  DB.states[last.pmid] = { ...last.prev, t: Date.now() };
  touch("states");
  triage.queue.unshift(last.pmid);
  renderDeck();
  refreshStatsSoon();
}

  const map = { ArrowRight: "right", ArrowLeft: "left", ArrowUp: "up", ArrowDown: "down" };
  const top = triage.queue[0];
  if (map[e.key]) { e.preventDefault(); commitSwipe(map[e.key]); }
  else if (e.key.toLowerCase() === "z" || e.key === "Backspace") { e.preventDefault(); undoSwipe(); }
  else if (e.key.toLowerCase() === "o" && top) window.open(`https://pubmed.ncbi.nlm.nih.gov/${top}/`, "_blank");
  else if (e.key === "Enter" && top) openArticle(top);
});

/* =====================================================================
   10. Vue THÈMES : graphe interactif + inspecteur
   ===================================================================== */
const graph = { k: 1, tx: 0, ty: 0, selected: null, centered: false, counts: {} };

RENDER.graph = function () {
  const root = $("#view-graph");
  root.innerHTML = `
    <div class="graph-wrap">
      <div class="gtools">
        <button class="btn" id="gAdd" title="Nouveau thème">${icon("plus")}<span class="lbl-desk">Nouveau thème</span></button>
        <button class="btn ghost" id="gLayout" title="Réorganiser">${icon("spark")}<span class="lbl-desk">Réorganiser</span></button>
        <button class="btn ghost" id="gScanAll" title="Scanner tout">${icon("play")}<span class="lbl-desk">Scanner tout</span></button>
      </div>
      <svg id="graph"><g id="gView"><g id="gEdges"></g><g id="gNodes"></g></g></svg>
      <div class="ghelp">Glisse un thème sur un autre pour le rattacher. Double-clic dans le vide pour en créer un. Molette ou pincement pour zoomer.</div>
      <aside class="inspector" id="inspector" hidden></aside>
    </div>`;
  $("#gAdd").onclick = () => newThemeModal();
  $("#gLayout").onclick = () => autoLayout();
  $("#gScanAll").onclick = () => startScan();
  setupGraphInteractions();
  if (!graph.centered) {
    const r = $("#graph").getBoundingClientRect();
    graph.tx = r.width / 2 - (isMobile() ? 0 : 160);
    graph.ty = isMobile() ? r.height * 0.32 : r.height / 2;
    graph.k = isMobile() ? 0.75 : 1;
    graph.centered = true;
  }
  const ts = themesList();
  const missing = ts.filter(t => t.x == null || t.y == null);
  missing.forEach((t, i) => {
    const p = getTheme(t.parent);
    const ang = (i / missing.length) * Math.PI * 2;
    t.x = (p?.x ?? 0) + Math.cos(ang) * (p ? 130 : 220);
    t.y = (p?.y ?? 0) + Math.sin(ang) * (p ? 130 : 220);
  });
  drawGraph();
  if (missing.length) autoLayout(missing.length === ts.length ? 260 : 120);
  if (graph.selected && getTheme(graph.selected)) openInspector(graph.selected);
};

const nodeRadius = (t) => 18 + Math.min(18, Math.sqrt(graph.counts[t.id]?.total || 0) * 1.6);
function applyView() { $("#gView")?.setAttribute("transform", `translate(${graph.tx},${graph.ty}) scale(${graph.k})`); }
function edgesHtml() {
  return themesList().filter(t => getTheme(t.parent)).map(t => {
    const p = getTheme(t.parent);
    return `<line class="edge" x1="${p.x}" y1="${p.y}" x2="${t.x}" y2="${t.y}"/>`;
  }).join("");
}

function drawGraph() {
  if (!$("#gNodes")) return;
  graph.counts = themeCounts();
  applyView();
  $("#gEdges").innerHTML = edgesHtml();
  $("#gNodes").innerHTML = themesList().map(t => {
    const r = nodeRadius(t);
    const c = graph.counts[t.id] || { total: 0, inbox: 0 };
    const folder = !t.terms.length;
    return `<g class="node ${folder ? "folder" : ""} ${t.enabled ? "" : "disabled"} ${graph.selected === t.id ? "selected" : ""}" data-id="${esc(t.id)}" transform="translate(${t.x},${t.y})">
      <circle class="pulse" r="${r}"/>
      <circle class="halo" r="${r + 6}"/>
      <circle class="core" r="${r}" fill="${esc(t.color)}" style="${folder ? `stroke:${esc(t.color)}` : ""}"/>
      <text class="initial" dy="4.5">${esc(t.name.slice(0, 2))}</text>
      <text y="${r + 18}">${esc(t.name)}</text>
      <text class="sub" y="${r + 33}">${folder ? "dossier" : plural(c.total, "article", "articles")}</text>
      ${c.inbox ? `<g class="nb" transform="translate(${r * 0.72},${-r * 0.72})"><circle r="10"/><text dy="3.6">${c.inbox > 99 ? "99+" : c.inbox}</text></g>` : ""}
    </g>`;
  }).join("");
  markScanningNodes();
}

function markScanningNodes() {
  const cur = SCAN.running && SCAN.current?.id;
  $$("#gNodes .node").forEach(n => n.classList.toggle("scanning", cur === n.dataset.id));
}

function toGraph(x, y) {
  const r = $("#graph").getBoundingClientRect();
  return { x: (x - r.left - graph.tx) / graph.k, y: (y - r.top - graph.ty) / graph.k };
}

function setupGraphInteractions() {
  const svg = $("#graph");
  const pointers = new Map();
  let mode = null, start = null, node = null, moved = 0, target = null, pinch = null, lastTap = 0;

  const zoomAt = (cx, cy, k2) => {
    k2 = Math.min(2.5, Math.max(0.3, k2));
    const r = svg.getBoundingClientRect();
    const mx = cx - r.left, my = cy - r.top;
    graph.tx = mx - (mx - graph.tx) * (k2 / graph.k);
    graph.ty = my - (my - graph.ty) * (k2 / graph.k);
    graph.k = k2;
    applyView();
  };

  svg.addEventListener("pointerdown", (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    svg.setPointerCapture(e.pointerId);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: graph.k };
      mode = "pinch";
      return;
    }
    start = { x: e.clientX, y: e.clientY, tx: graph.tx, ty: graph.ty };
    moved = 0;
    const g = e.target.closest(".node");
    if (g) {
      mode = "node";
      node = getTheme(g.dataset.id);
      const p = toGraph(e.clientX, e.clientY);
      start.ox = p.x - node.x; start.oy = p.y - node.y;
    } else {
      mode = "pan";
      svg.classList.add("panning");
    }
  });

  svg.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mode === "pinch" && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
      return;
    }
    if (!mode || mode === "pinch") return;
    moved = Math.max(moved, Math.hypot(e.clientX - start.x, e.clientY - start.y));
    if (mode === "pan") {
      graph.tx = start.tx + e.clientX - start.x;
      graph.ty = start.ty + e.clientY - start.y;
      applyView();
    } else if (moved > 4) {
      const p = toGraph(e.clientX, e.clientY);
      node.x = p.x - start.ox; node.y = p.y - start.oy;
      target = themesList().find(t => t.id !== node.id && Math.hypot(t.x - node.x, t.y - node.y) < nodeRadius(t) + 8) || null;
      const gEl = $(`#gNodes .node[data-id="${CSS.escape(node.id)}"]`);
      gEl.setAttribute("transform", `translate(${node.x},${node.y})`);
      $("#gNodes").append(gEl);
      $$("#gNodes .node").forEach(n => n.classList.toggle("target", !!target && n.dataset.id === target.id));
      $("#gEdges").innerHTML = edgesHtml();
    }
  });

  const end = (e) => {
    pointers.delete(e.pointerId);
    if (mode === "pinch") { if (pointers.size === 0) mode = null; return; }
    if (!mode) return;
    svg.classList.remove("panning");
    const m = mode; mode = null;
    if (m === "pan") {
      // double tap tactile dans le vide = nouveau thème
      if (moved < 6 && e.pointerType !== "mouse") {
        const now = Date.now();
        if (now - lastTap < 350) newThemeModal(toGraph(e.clientX, e.clientY));
        lastTap = now;
      }
      return;
    }
    if (moved <= 4) { openInspector(node.id); return; }
    if (target) {
      const child = node, parent = target;
      target = null;
      if (descendants([child.id]).has(parent.id)) toast("Ce rattachement créerait une boucle.", { error: true });
      else {
        child.parent = parent.id;
        child.x = parent.x + 90; child.y = parent.y + 70;
        toast(`« ${child.name} » rattaché à « ${parent.name} »`);
      }
    }
    saveTheme(node);
    drawGraph();
    if (graph.selected === node.id) openInspector(node.id);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, graph.k * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  svg.addEventListener("dblclick", (e) => {
    if (e.target.closest(".node")) return;
    newThemeModal(toGraph(e.clientX, e.clientY));
  });
}

/* Disposition par forces : répulsion, ressort parent-enfant, gravité centrale */
function autoLayout(iterations = 220) {
  const ts = themesList();
  if (!ts.length) return;
  const sim = ts.map(t => ({ t, vx: 0, vy: 0 }));
  const byId = Object.fromEntries(sim.map(s => [s.t.id, s]));
  let it = 0;
  const step = () => {
    for (let i = 0; i < sim.length; i++) {
      for (let j = i + 1; j < sim.length; j++) {
        const a = sim[i], b = sim[j];
        let dx = a.t.x - b.t.x, dy = a.t.y - b.t.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        const d = Math.sqrt(d2), f = 26000 / d2;
        a.vx += dx / d * f; a.vy += dy / d * f;
        b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
    }
    sim.forEach(s => {
      const p = byId[s.t.parent];
      if (p) {
        const dx = p.t.x - s.t.x, dy = p.t.y - s.t.y, d = Math.hypot(dx, dy) || 1;
        const f = (d - 150) * 0.05;
        s.vx += dx / d * f; s.vy += dy / d * f;
        p.vx -= dx / d * f; p.vy -= dy / d * f;
      }
      s.vx -= s.t.x * 0.012; s.vy -= s.t.y * 0.012;
    });
    const cool = 1 - it / iterations;
    sim.forEach(s => {
      s.vx *= 0.6; s.vy *= 0.6;
      s.t.x += Math.max(-30, Math.min(30, s.vx)) * cool;
      s.t.y += Math.max(-30, Math.min(30, s.vy)) * cool;
    });
    it++;
    if (it % 2 === 0 || it >= iterations) drawGraph();
    if (it < iterations) { if (reduceMotion) step(); else requestAnimationFrame(step); }
    else { ts.forEach(t => { t.x = Math.round(t.x); t.y = Math.round(t.y); t.u = Date.now(); }); touch("themes"); }
  };
  step();
}

  const box = $("#inspector");

  box.innerHTML = `
    <header>

        <div class="toggle-row"><span>Filtre réa cardio-vasculaire<br><span class="hint">Croise ce thème avec le contexte défini dans les réglages</span></span><label class="switch"><input type="checkbox" id="iCtx" ${t.ctx !== false ? "checked" : ""}><span></span></label></div>
      </div>

      <div class="section">
        <span class="label">Priorité dans le score</span>
        <div class="prio" id="iPrio">${[1, 2, 3, 4, 5].map(n => `<button data-v="${n}" class="${n <= t.weight ? "on" : ""}" aria-label="Priorité ${n}"></button>`).join("")}</div>
      </div>

      <div class="section">
        <span class="label">Couleur</span>
        <div class="swatches" id="iColor">${COLORS.map(col => `<button data-c="${col}" style="background:${col}" class="${col.toLowerCase() === t.color.toLowerCase() ? "on" : ""}" aria-label="Couleur ${col}"></button>`).join("")}</div>
      </div>

      <div class="section">
        <span class="label">Rattaché à</span>
        <select class="input" id="iParent"><option value="">Aucun (racine)</option>${themeOptions(getTheme(t.parent) ? t.parent : "", t.id)}</select>
      </div>

      <div class="section">
        <span class="label">Termes de recherche (en anglais)</span>
        <div id="iTerms">${t.terms.length ? "" : `<p class="hint">Aucun terme : ce nœud est un dossier qui regroupe ses enfants sans être scanné.</p>`}</div>
        <div class="addrow">
          <input class="input" id="iTermNew" placeholder="ex. vasoplegia" enterkeyhint="done">
          <select class="input" id="iTermField">${Object.entries(FIELDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
          <button class="btn" id="iTermAdd" aria-label="Ajouter le terme">${icon("plus")}</button>
        </div>
        <div style="margin-top:8px"><button class="btn plain small" id="iMesh">${icon("search")}Suggérer des termes MeSH</button></div>

        ${q ? `<pre class="query">${esc(q)}</pre><a href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(q)}" target="_blank" rel="noopener">Tester dans PubMed</a>` : `<p class="hint">Pas de requête pour un dossier.</p>`}

  };

  t.terms.forEach((term, i) => {
    const row = el(`<div class="term"><span title="${esc(term.t)}">${esc(term.t)}</span>
      <select aria-label="Champ">${Object.entries(FIELDS).map(([k, v]) => `<option value="${k}" ${k === term.f ? "selected" : ""}>${v}</option>`).join("")}</select>
      <button class="icon-btn" aria-label="Retirer">${icon("x")}</button></div>`);
    $("select", row).onchange = (e) => { update({ terms: t.terms.map((x, j) => j === i ? { ...x, f: e.target.value } : x) }); refresh(); };
    $("button", row).onclick = () => { update({ terms: t.terms.filter((_, j) => j !== i) }); refresh(); };
    termsBox.append(row);

    text = text.trim();
    if (!text) return;
    if (t.terms.some(x => x.t.toLowerCase() === text.toLowerCase())) return toast("Ce terme est déjà présent.");
    update({ terms: [...t.terms, { t: text, f: field }] });
    refresh();
  };
  $("#iTermNew").onkeydown = (e) => { if (e.key === "Enter") addTerm(e.target.value, $("#iTermField").value); };
  $("#iTermAdd").onclick = () => addTerm($("#iTermNew").value, $("#iTermField").value);

  $("#iMesh").onclick = async () => {
    const seed = t.terms[0]?.t || t.name;
    const mbox = $("#iMeshBox");
    mbox.innerHTML = `<p class="hint">Recherche MeSH pour « ${esc(seed)} »…</p>`;
    try {
      const res = await meshSuggest(seed);
      if (!res.length) { mbox.innerHTML = `<p class="hint">Aucun descripteur MeSH trouvé. Essaie un terme anglais plus général.</p>`; return; }
      mbox.innerHTML = "";
      res.forEach(m => {
        const item = el(`<div class="mesh-item"><div style="display:flex;align-items:center;gap:8px">
          <b style="flex:1">${esc(m.heading)}</b><button class="btn small">${icon("plus")}MeSH</button></div>
          ${m.scope ? `<div class="hint">${esc(m.scope)}</div>` : ""}
          <div class="chips">${m.entries.map(x => `<button class="chip" data-t="${esc(x)}">${icon("plus")}${esc(x)}</button>`).join("")}</div></div>`);
        $(".btn", item).onclick = () => addTerm(m.heading, "mesh");
        $$(".chip", item).forEach(ch => ch.onclick = () => addTerm(ch.dataset.t, "tiab"));
        mbox.append(item);
      });
    } catch (e) { mbox.innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  };

  $$("#iExcl .x").forEach(b => b.onclick = () => {
    const e = DB.exclusions[b.dataset.id];
    e.del = true; saveExclusion(e); refresh();
  });
  $("#iExclNew").onkeydown = (e) => {
    const term = e.target.value.trim();
    if (e.key !== "Enter" || !term) return;
    saveExclusion({ id: uid(), term, field: term.includes("[") ? "raw" : "tiab", theme: id, enabled: true, label: null, del: false });
    refresh();
  };

  $("#iScan").onclick = () => startScan([id]);
  $("#iSee").onclick = () => { lib.f = { ...DEFAULT_FILTERS(), themes: [id] }; lib.limit = 50; go("library"); };
  $("#iDel").onclick = () => deleteThemeModal(t);
}

function newThemeModal(pos) {
  const body = el(`<div>
    <div class="field"><label for="ntName">Nom du thème</label><input class="input" id="ntName" placeholder="ex. Vasoplégie"></div>
    <div class="field"><label for="ntTerm">Terme de recherche en anglais</label><input class="input" id="ntTerm" placeholder="ex. vasoplegia (par défaut : le nom)">
      <span class="hint">Tu pourras ajouter des synonymes et des termes MeSH ensuite.</span></div>
    <div class="field"><label for="ntParent">Rattaché à</label><select class="input" id="ntParent"><option value="">Aucun (racine)</option>${themeOptions(graph.selected || "")}</select></div>
    <div class="toggle-row"><span>Dossier<br><span class="hint">Regroupe d'autres thèmes sans être scanné lui-même</span></span><label class="switch"><input type="checkbox" id="ntFolder"><span></span></label></div>
  </div>`);
  openModal({
    title: "Nouveau thème", body,
    actions: [{ label: "Annuler" }, {
      label: "Créer le thème", primary: true, fn: () => {
        const name = $("#ntName").value.trim();
        if (!name) { toast("Donne un nom au thème.", { error: true }); return false; }
        if (themesList().some(x => x.name.toLowerCase() === name.toLowerCase())) { toast(`Le thème « ${name} » existe déjà.`, { error: true }); return false; }
        const term = $("#ntTerm").value.trim() || name;
        const parent = $("#ntParent").value || null;
        const pt = getTheme(parent);
        const p = pos || (pt ? { x: pt.x + 110, y: pt.y + 80 } : { x: Math.random() * 60 - 30, y: Math.random() * 60 - 30 });
        const t = { id: uid(), name, terms: $("#ntFolder").checked ? [] : [{ t: term, f: "auto" }], parent, weight: 3,
          color: pt?.color || "#0A6CFF", x: Math.round(p.x), y: Math.round(p.y), enabled: true, ctx: true, del: false };
        saveTheme(t);
        graph.selected = t.id;
        if (state.view === "graph") { drawGraph(); if (!pos) autoLayout(80); openInspector(t.id); }
        toast(`Thème « ${name} » créé`, { action: { label: "Le scanner", fn: () => startScan([t.id]) } });
      },
    }],
  });
  setTimeout(() => $("#ntName")?.focus(), 50);
}

function deleteThemeModal(t) {
  const body = el(`<p style="margin-top:0">Les articles déjà triés restent dans la bibliothèque s'ils appartiennent à d'autres thèmes. Les sous-thèmes remontent à la racine.</p>`);
  openModal({
    title: `Supprimer « ${t.name} » ?`, body,
    actions: [{ label: "Annuler" }, {
      label: "Supprimer", danger: true, fn: () => {
        themesList().filter(x => x.parent === t.id).forEach(x => { x.parent = null; saveTheme(x); });
        t.del = true; saveTheme(t);
        graph.selected = null;
        $("#inspector").hidden = true;
        drawGraph(); refreshStats();
        triage.queue = [];
        toast("Thème supprimé");
      },
    }],
  });
}
