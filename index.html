function openModal({ title, subtitle, body, actions = [], wide = false }) {
  closeModal();
  const back = el(`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" style="${wide ? "width:min(680px,100%)" : ""}">
    <header><h3>${esc(title)}</h3>${subtitle ? `<p>${esc(subtitle)}</p>` : ""}</header>
    <div class="body"></div><footer></footer></div></div>`);
  $(".body", back).append(body);
  actions.forEach(a => {
    const b = el(`<button class="btn ${a.primary ? "" : a.danger ? "danger" : "ghost"}">${esc(a.label)}</button>`);
    b.onclick = async () => {
      if (a.fn) { b.disabled = true; const keep = await a.fn(); b.disabled = false; if (keep === false) return; }
      closeModal();
    };
    $("footer", back).append(b);
  });
  back.addEventListener("pointerdown", (e) => { if (e.target === back) closeModal(); });
  back.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input:not([type=checkbox])") && !e.target.closest(".addrow")) {
      $$("footer .btn", back).pop()?.click();
    }
  });
  $("#modalRoot").append(back);
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

];

function exclusionsModal() {
  const body = el(`<div>
    <div class="addrow" style="margin-top:0">
      <input class="input" id="exNew" placeholder="Terme à exclure de tous les thèmes" enterkeyhint="done">
      <select class="input" id="exField">${Object.entries(FIELDS).filter(([k]) => k !== "auto").map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <button class="btn" id="exAdd" aria-label="Ajouter">${icon("plus")}</button>
    </div>
    <div id="exList" style="margin:12px 0 16px"></div>
    <span class="label">Exclusions courantes</span>
    <div class="chips" id="exPresets" style="margin:8px 0 16px"></div>
    <div class="toggle-row" style="border-top:1px solid var(--line);padding-top:12px">
      <span class="hint">Les exclusions s'appliquent aux prochains scans. Tu peux aussi masquer tout de suite les articles déjà dans l'Inbox qui contiennent un terme exclu.</span>
      <button class="btn ghost small" id="exApply">Masquer dans l'Inbox</button>
    </div></div>`);

  const refresh = () => {
    const all = Object.values(DB.exclusions).filter(e => !e.del);
    const globals = all.filter(e => !e.theme);
    const locals = all.filter(e => e.theme && getTheme(e.theme));
    const list = $("#exList", body);
    list.innerHTML = globals.length ? "" : `<p class="hint">Aucune exclusion globale.</p>`;
    globals.forEach(e => {
      const row = el(`<div class="excl">
        <label class="switch"><input type="checkbox" ${e.enabled ? "checked" : ""} aria-label="Activer"><span></span></label>
        <div class="what"><b>${esc(e.label || e.term)}</b>${e.label ? `<code>${esc(e.term)}</code>` : ""}</div>
        <span class="tag">${FIELDS[e.field] || e.field}</span>
        <button class="icon-btn" aria-label="Supprimer">${icon("trash")}</button></div>`);
      $("input", row).onchange = (ev) => { e.enabled = ev.target.checked; saveExclusion(e); };
      $("button", row).onclick = () => { e.del = true; saveExclusion(e); refresh(); };
      list.append(row);
    });
    if (locals.length) {
      const names = [...new Set(locals.map(l => getTheme(l.theme).name))].map(esc).join(", ");
      list.append(el(`<p class="hint" style="margin-top:10px">Plus ${plural(locals.length, "exclusion propre", "exclusions propres")} à certains thèmes (${names}), modifiables depuis la vue Thèmes.</p>`));
    }
    const have = new Set(globals.map(g => g.term));
    const pbox = $("#exPresets", body);
    pbox.innerHTML = "";
    PRESETS.filter(p => !have.has(p.term)).forEach(p => {
      const c = el(`<button class="chip">${icon("plus")}${esc(p.label)}</button>`);
      c.onclick = () => { saveExclusion({ id: uid(), term: p.term, field: "raw", label: p.label, theme: null, enabled: true, del: false }); refresh(); };
      pbox.append(c);
    });
    if (!pbox.children.length) pbox.innerHTML = `<span class="hint">Toutes les exclusions courantes sont déjà en place.</span>`;
  };
  const add = () => {
    const term = $("#exNew", body).value.trim();
    if (!term) return;
    saveExclusion({ id: uid(), term, field: $("#exField", body).value, label: null, theme: null, enabled: true, del: false });
    $("#exNew", body).value = "";
    refresh();
  };
  $("#exAdd", body).onclick = add;
  $("#exNew", body).onkeydown = (e) => { if (e.key === "Enter") add(); };
  $("#exNew", body).addEventListener("input", (e) => { if (e.target.value.includes("[")) $("#exField", body).value = "raw"; });
  $("#exApply", body).onclick = () => {
    const terms = Object.values(DB.exclusions)
      .filter(e => !e.del && e.enabled && !e.theme && e.field === "tiab").map(e => e.term.toLowerCase());
    let n = 0;
    for (const a of DB.articles.values()) {
      const st = stateOf(a.pmid);
      if (st.s !== "inbox" || st.f) continue;
      const h = `${a.title} ${a.abstract}`.toLowerCase();
      if (terms.some(t => h.includes(t))) { DB.states[a.pmid] = { ...st, s: "ignored", t: Date.now() }; n++; }
    }
    if (n) touch("states");
    toast(n ? `${plural(n, "article masqué", "articles masqués")} de l'Inbox` : "Aucun article de l'Inbox ne contient ces termes (seuls les termes titre/abstract sont vérifiés).");
    refreshStats();
    if (state.view === "triage") reloadTriage();
  };

  openModal({
    title: "Thèmes à exclure", wide: true,
    subtitle: "Ces termes sont retirés de toutes les recherches (opérateur NOT).",
    body, actions: [{ label: "Terminé", primary: true }],
  });
  refresh();
}

function renderSavedViews() {
  const box = $("#fViews");
  if (!box) return;
  const views = DB.settings.saved_views || [];
  box.innerHTML = views.length ? "" : `<span class="hint">Aucune pour l'instant.</span>`;
  views.forEach((v, i) => {
    const c = el(`<span class="chip saved-view"><button style="border:0;background:none;padding:0">${esc(v.name)}</button><button class="x" aria-label="Supprimer la vue">${icon("x")}</button></span>`);
    c.firstElementChild.onclick = () => { lib.f = { ...DEFAULT_FILTERS(), ...structuredClone(v.f) }; lib.limit = 50; RENDER.library(); };
    $(".x", c).onclick = () => { saveSettings({ saved_views: views.filter((_, j) => j !== i) }); renderSavedViews(); };
    box.append(c);
  });
}

function saveViewModal() {
  const body = el(`<div class="field"><label for="svName">Nom de la vue</label><input class="input" id="svName" placeholder="ex. ECR récents ECMO"></div>`);
  openModal({
    title: "Enregistrer la vue", body,
    actions: [{ label: "Annuler" }, {
      label: "Enregistrer", primary: true, fn: () => {
        const name = $("#svName").value.trim();
        if (!name) return false;
        const views = [...(DB.settings.saved_views || []).filter(v => v.name !== name), { name, f: structuredClone(lib.f) }];
        saveSettings({ saved_views: views });
        renderSavedViews();
        toast("Vue enregistrée");
      },
    }],
  });
  setTimeout(() => $("#svName")?.focus(), 50);
}

function loadLibrary() {
  const list = $("#rList");
  if (!list) return;
  const all = queryArticles(lib.f);
  const items = all.slice(0, lib.limit);
  $("#rCount").textContent = plural(all.length, "article", "articles");
  renderBulk();
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div><h3>Aucun article</h3><p>Aucun article ne correspond à ces filtres. Élargis la période ou le statut, ou lance un scan.</p>
      <button class="btn ghost" id="rReset">Réinitialiser les filtres</button></div></div>`;
    $("#rReset").onclick = () => { lib.f = DEFAULT_FILTERS(); RENDER.library(); };
    return;
  }
  list.innerHTML = `<div class="list"></div>`;
  const box = $(".list", list);
  const frag = document.createDocumentFragment();
  items.forEach(v => {
    const a = v.a;
    const first = a.authors?.[0] || "";
    const row = el(`<div class="item">
      <input type="checkbox" ${lib.selected.has(a.pmid) ? "checked" : ""} aria-label="Sélectionner">
      <span class="score ${scoreClass(v.score)}">${Math.round(v.score)}</span>
      <div style="min-width:0">
        <div class="t">${esc(a.title)}</div>
        <div class="m">${esc(a.ja || a.journal)}, ${fmtDate(a.date)}${first ? `, ${esc(first)}${a.authors.length > 1 ? " et al." : ""}` : ""}</div>
        <div class="chips">${badgesHtml(v)}${v.st.s !== "inbox" ? `<span class="status-tag">${STATUS[v.st.s]}</span>` : ""}</div>
      </div>
      <div class="side">
        <button class="star ${v.st.f ? "on" : ""}" title="Pépite" aria-label="Pépite">${icon("star")}</button>
        <span>${nf(v.cites)} cit.</span>
        <span>${nf(v.vel, 1)}/mois</span>
      </div></div>`);
    row.onclick = (e) => { if (!e.target.closest("input, .star")) openArticle(a.pmid); };
    $("input", row).onchange = (e) => { e.target.checked ? lib.selected.add(a.pmid) : lib.selected.delete(a.pmid); renderBulk(); };
    $(".star", row).onclick = (e) => {
      const fav = stateOf(a.pmid).f ? 0 : 1;
      setState(a.pmid, { f: fav }, fav ? "fav" : "unfav");
      e.currentTarget.classList.toggle("on", !!fav);
    };
    frag.append(row);
  });
  box.append(frag);
  if (all.length > items.length) {
    const more = el(`<div class="more"><button class="btn ghost">Afficher ${Math.min(50, all.length - items.length)} de plus</button></div>`);
    $("button", more).onclick = () => { lib.limit += 50; loadLibrary(); };
    list.append(more);
  }
}

function renderBulk() {
  const box = $("#rBulk");
  if (!box) return;
  if (!lib.selected.size) { box.innerHTML = ""; return; }
  const n = lib.selected.size;
  box.innerHTML = `<div class="bulk"><span>${plural(n, "sélectionné", "sélectionnés")}</span>
    ${["toread", "read", "club", "archive", "ignored"].map(s => `<button class="btn small" data-s="${s}">${STATUS[s]}</button>`).join("")}
    <button class="btn small" data-clear>Désélectionner</button></div>`;
  $$("[data-s]", box).forEach(b => b.onclick = () => {

const board = { theme: "", fav: false };
const COLS = [

function loadBoard() {
  $$("#view-board .col").forEach(col => {

    const items = all.slice(0, 200);

    items.forEach(v => box.append(kanbanCard(v)));

function kanbanCard(v) {
  const a = v.a;
  const k = el(`<div class="kcard" data-pmid="${esc(a.pmid)}">
    <div class="t">${v.st.f ? `<span style="color:var(--red)">★ </span>` : ""}${esc(a.title)}</div>
    <div class="m"><span>${esc(a.ja || a.journal)}</span><span>${(a.date || "").slice(0, 4)}</span>
    <span class="score ${scoreClass(v.score)}">${Math.round(v.score)}</span></div></div>`);
  let start = null, timer = null, suppressClick = false;

  const begin = (e) => {
    clearTimeout(timer);
    const r = k.getBoundingClientRect();
    const ghost = k.cloneNode(true);
    ghost.classList.add("kghost");
    ghost.style.width = r.width + "px";
    document.body.append(ghost);
    kdrag = { pmid: a.pmid, card: k, ghost, ox: e.clientX - r.left, oy: e.clientY - r.top, over: null };
    k.classList.remove("pressing");
    k.classList.add("dragging");
    if (navigator.vibrate) navigator.vibrate(10);
    move(e);
  };
  const move = (e) => {
    if (!kdrag) return;
    kdrag.ghost.style.left = (e.clientX - kdrag.ox) + "px";
    kdrag.ghost.style.top = (e.clientY - kdrag.oy) + "px";
    const col = document.elementFromPoint(e.clientX, e.clientY)?.closest(".col");
    $$("#board .col").forEach(c => c.classList.toggle("over", c === col && c !== k.closest(".col")));
    kdrag.over = col;
    const b = $("#board");
    const br = b.getBoundingClientRect();
    if (e.clientX < br.left + 40) b.scrollLeft -= 14;
    else if (e.clientX > br.right - 40) b.scrollLeft += 14;
  };
  const finish = (e) => {
    clearTimeout(timer);
    k.classList.remove("pressing");
    start = null;
    if (!kdrag) return;
    if (e?.type === "pointerup") move(e);   // position exacte au relâchement
    const { ghost, over } = kdrag;
    ghost.remove();
    k.classList.remove("dragging");
    $$("#board .col").forEach(c => c.classList.remove("over"));
    kdrag = null;
    suppressClick = true;
    setTimeout(() => suppressClick = false, 50);
    if (over && over !== k.closest(".col")) {
      $("p.hint", over)?.remove();
      $(".cards", over).prepend(k);
      setState(a.pmid, { s: over.dataset.s }, `status_${over.dataset.s}`);
      $$("#board .col").forEach(c => { $(".n", c).textContent = nf($$(".kcard", c).length); });
      refreshStatsSoon();
    }
  };

  k.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY, type: e.pointerType };
    if (e.pointerType !== "mouse") {
      k.classList.add("pressing");
      timer = setTimeout(() => { k.setPointerCapture(e.pointerId); begin({ clientX: start.x, clientY: start.y }); }, 350);
    }
  });
  k.addEventListener("pointermove", (e) => {
    if (kdrag?.card === k) { move(e); return; }
    if (!start) return;
    const d = Math.hypot(e.clientX - start.x, e.clientY - start.y);
    if (start.type === "mouse" && d > 5) { k.setPointerCapture(e.pointerId); begin(e); }
    else if (start.type !== "mouse" && d > 8) { clearTimeout(timer); k.classList.remove("pressing"); start = null; }
  });
  k.addEventListener("pointerup", finish);
  k.addEventListener("pointercancel", finish);
  k.addEventListener("contextmenu", (e) => e.preventDefault());
  k.addEventListener("click", () => { if (!suppressClick) openArticle(a.pmid); });
  return k;
}
// Pendant un glisser tactile, on bloque le défilement de la page
document.addEventListener("touchmove", (e) => { if (kdrag) e.preventDefault(); }, { passive: false });

/** Import : format web, ou export de la version Python (veille-urcv/1). */
async function importData(data) {
  let incoming;
  if (data.format === "veille-urcv-web/1") {
    incoming = data;
  } else if (data.format === "veille-urcv/1") {
    incoming = convertPythonExport(data);
  } else throw new Error("Ce fichier n'est pas un export Veille URCV.");
  await applyCore(incoming);
  const bySh = {};
  (incoming.articles || []).forEach(a => (bySh[shardOf(a.pmid)] ||= []).push(a));
  for (const [name, list] of Object.entries(bySh)) { await applyShard(name, list); markDirty(name); }
  markDirty("core");
  return { articles: (incoming.articles || []).length };
}

function convertPythonExport(d) {
  const J = (v, def) => { try { return typeof v === "string" ? JSON.parse(v) : (v ?? def); } catch { return def; } };
  const ms = (iso) => iso ? Date.parse(iso) || 0 : 0;
  const tid = (id) => "py-" + id;
  const now = Date.now();
  const themes = {}, exclusions = {}, states = {}, scans = {}, sources = {};
  (d.themes || []).forEach(t => {
    themes[tid(t.id)] = { id: tid(t.id), name: t.name, terms: J(t.terms, []), parent: t.parent_id ? tid(t.parent_id) : null,
      weight: t.weight, color: t.color, x: t.x, y: t.y, enabled: !!t.enabled, ctx: !!t.use_context, u: now, del: false };
    if (t.last_scan) scans[tid(t.id)] = { last: t.last_scan, hash: termsHash(themes[tid(t.id)]), n: t.last_new || 0, u: now };
  });
  (d.exclusions || []).forEach(e => {
    exclusions["py-x" + e.id] = { id: "py-x" + e.id, term: e.term, field: e.field, theme: e.theme_id ? tid(e.theme_id) : null,
      enabled: !!e.enabled, label: e.label, u: now, del: false };
  });
  const links = {};
  (d.article_themes || []).forEach(l => (links[l.pmid] ||= []).push(tid(l.theme_id)));
  const articles = (d.articles || []).map(a => {
    if (a.status !== "inbox" || a.favorite || a.note) {
      states[a.pmid] = { s: a.status, f: a.favorite ? 1 : 0, d: a.dislike ? 1 : 0, n: a.note || "", t: ms(a.status_changed_at) || ms(a.first_seen) };
    }
    return {
      pmid: a.pmid, doi: a.doi, pmc: a.pmc, title: a.title, abstract: a.abstract, journal: a.journal, ja: a.journal_abbr,
      date: a.pub_date, edat: a.entrez_date, authors: J(a.authors, []), types: J(a.pub_types, []), mesh: J(a.mesh, []),
      kw: J(a.keywords, []), lang: a.lang, pre: a.is_preprint, ret: a.is_retracted, oa: a.is_oa, oaUrl: a.oa_url,
      ci: a.citations_icite, co: a.citations_oa, rcr: a.rcr, apt: a.apt, cc: a.clinical_cites, fwci: a.fwci,
      cby: J(a.counts_by_year, []).map(c => ({ y: c.year, n: c.cited_by_count })), src: a.source_id,
      mu: ms(a.metrics_updated_at), fs: ms(a.first_seen), th: links[a.pmid] || [],
    };
  });
  (d.sources || []).forEach(s => { sources[s.id] = { name: s.name, impact: s.impact, h: s.h_index, t: ms(s.fetched_at) }; });
  const events = (d.events || []).map(e => ({ id: "py-" + hashStr(e.ts + e.kind + e.pmid), ts: ms(e.ts), k: e.kind, p: e.pmid }));
  return { themes, exclusions, states, scans, sources, events, settings: {}, articles };
}

/* =====================================================================
   15. Démarrage
   ===================================================================== */
(async function boot() {
  try {
    await loadDB();
  } catch (e) {
    document.body.innerHTML = `<div class="empty" style="height:100vh"><div><h3>Stockage indisponible</h3><p>${esc(e.message)}. En navigation privée, certains navigateurs bloquent le stockage local.</p></div></div>`;
    return;
  }
  navigator.storage?.persist?.();
  refreshStats();
  renderSync();
  go("triage");

  if (syncConfigured() && secrets().auto_sync) await syncNow({ quiet: true });
  const s = DB.settings;
  if (s.auto_scan_enabled && Date.now() - (state.stats?.lastScan || 0) > (+s.auto_scan_hours || 20) * 3600e3) {
    toast("Scan automatique lancé");
    startScan();
  }
  setInterval(() => {
    renderSync();
    if (document.visibilityState === "visible" && syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true });
  }, 5 * 60e3);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && syncConfigured() && secrets().auto_sync && !SCAN.running) syncNow({ quiet: true });
  });
  window.addEventListener("beforeunload", (e) => { if (SCAN.running) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("resize", debounce(() => { if (state.view === "library") $("#fOpen") && ($("#fOpen").hidden = !isMobile()); }, 200));
})();
